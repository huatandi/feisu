<!doctype html><html lang="zh"><meta charset="utf-8"><title>旧盘点历史迁移</title><body><h2>导出旧浏览器盘点历史</h2><p>必须把本页面放到原FEISU网站同一目录，用原设备、原浏览器、原网站地址打开。下载后，在新版“历史盘点”中选择该JSON文件导入。导出不会删除旧记录。</p><button id="export">导出迁移文件</button><p id="status"></p><script>
document.getElementById('export').onclick=async function(){try{const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('sanfei_inventory_v4');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});if(!db.objectStoreNames.contains('sessions'))throw Error('本网址没有旧盘点数据，请回到原网址');const entries=await new Promise((resolve,reject)=>{const tx=db.transaction('sessions','readonly'),out=[];const r=tx.objectStore('sessions').openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push({key:c.key,data:c.value});c.continue();}};tx.oncomplete=()=>resolve(out);tx.onerror=tx.onabort=()=>reject(tx.error);});db.close();const map=new Map();for(const e of entries){const d=e.data;if(!d||!Array.isArray(d.db)||!d.db.length)continue;if(!d.id)d.id='history:'+Date.now()+':'+Math.random().toString(36).slice(2);map.set(d.id,d);}const blob=new Blob([JSON.stringify([...map.values()])],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FEISU-旧历史迁移.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='已导出 '+map.size+' 份，旧数据保留。';}catch(e){document.getElementById('status').textContent=e.message;}};
</script></body></html>
