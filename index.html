<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>飞速盘点 · Sanfei v2.2.5</title> 
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.19.1"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 样式代码完全保持与最终版一致，此处省略以缩短篇幅，实际使用时保留完整样式 */
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }
        /* ... 此处省略完整样式，实际请将原 v2.2.5 的样式完整粘贴 ... */
        /* 为确保直接可用，下面使用简写占位，您实际部署时务必替换为原始完整样式 */
        .main-card { background: white; width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header-fixed { flex-shrink: 0; background: white; z-index: 20; }
        /* ... 省略其余样式，部署时请用原文件样式 ... */
        .scan-frame { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 220px; border: 3px solid #3b82f6; border-radius: 20px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.75); z-index: 10; pointer-events: none; background: rgba(0,0,0,0.1); }
        .scan-line { position: absolute; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, #3b82f6, transparent); top: 0; animation: scanLineMove 1.2s infinite ease-in-out; box-shadow: 0 0 20px #3b82f6; }
        @keyframes scanLineMove { 0%, 100% { top: 5%; } 50% { top: 95%; } }
        /* 底部按钮3列布局 */
        .bottom-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 600px; margin: 0 auto; }
        .scan-header { background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%); border-bottom: 3px solid #3b82f6; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
        .scan-header-left { display: flex; gap: 12px; align-items: center; }
        .scan-enhance-btn { background: #10b981; color: white; border: none; border-radius: 50px; padding: 12px 24px; font-size: 18px; font-weight: 900; cursor: pointer; }
        .scan-enhance-btn.active { background: #f59e0b; }
        /* 其余样式原封不动 */
    </style>
</head>
<body>
    <!-- HTML 结构完全保持原 v2.2.5 不变，此处省略以缩短篇幅，实际部署时请使用原完整 HTML -->
    <div id="toast"></div>
    <div id="colModal">...</div>
    <div class="main-card">...</div>
    <div class="bottom-fixed-btns">...</div>
    <div id="scanUI">...</div>

    <script>
        const VERSION = "S2.2.5";
        const STORAGE_KEY = "FEISUPANDIAN_" + VERSION;
        
        let db = [];
        let columns = [];
        let scanning = false;
        let reader = null;
        let lastCode = "";
        let lastTime = 0;
        let currentFocusInterval = null;
        let pendingJump = null;
        let currentInputElement = null;
        let originalViewportHeight = window.innerHeight;
        let cameraTrack = null;
        
        // 增强模式相关
        let enhanceMode = false;
        let consecutiveFailures = 0;
        const AUTO_ENHANCE_THRESHOLD = 3;
        let lastDecodeSucceeded = true;
        
        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIPad = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
        const isMobile = isAndroid || isIPad || /iPhone/i.test(navigator.userAgent);
        
        // 检测 iPad Pro（用于对焦优化）
        const isIPadPro = /iPad|Macintosh/.test(navigator.userAgent) && (screen.width >= 1024 || window.matchMedia("(min-width:1024px)").matches);
        
        // ========== 键盘处理、数据存储、列位置标准化（完全保持原逻辑） ==========
        function setupKeyboardListener() { /* 原样 */ }
        function showKeyboard() { /* 原样 */ }
        function hideKeyboard() { /* 原样 */ }
        
        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    db = data.db || [];
                    columns = data.columns || [];
                }
                if (!columns.length) columns = ['实际数量', '商品名称', '编码', '价格'];
                normalizeActualQtyColumnPosition();
                db.forEach(row => { if (row['实际数量'] === undefined) row['实际数量'] = ''; });
            } catch(e) { columns = ['实际数量', '商品名称', '编码', '价格']; db = []; }
        }
        
        // 强制“实际数量”列移到第5列（索引4）
        function normalizeActualQtyColumnPosition() {
            if (!Array.isArray(columns) || !columns.length) return;
            const qtyCol = '实际数量';
            const targetIndex = 4;
            const currentIndex = columns.indexOf(qtyCol);
            if (currentIndex === -1 || currentIndex === targetIndex) return;
            columns.splice(currentIndex, 1);
            const insertAt = Math.min(targetIndex, columns.length);
            columns.splice(insertAt, 0, qtyCol);
        }
        
        function saveData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ db, columns, version: VERSION })); } catch(e) { showToast("存储空间不足", true); } }
        function showToast(msg, isError = false) { /* 原样 */ }
        function playBeep(success) { try { const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const oscillator = audioCtx.createOscillator(); const gainNode = audioCtx.createGain(); oscillator.connect(gainNode); gainNode.connect(audioCtx.destination); oscillator.frequency.value = success ? 1200 : 400; gainNode.gain.value = 0.6; oscillator.start(); gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2); oscillator.stop(audioCtx.currentTime + 0.2); audioCtx.resume(); } catch(e) {} }
        function vibrate() { if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(30); }
        
        // 图像预处理函数（与原版相同）
        function getFrameROI(videoEl, frameEl) { /* 保持原样 */ }
        function preprocessImageForBarcode(videoEl, roi) { /* 保持原样 */ }
        async function tryEnhancedDecode(videoEl, frameEl) { /* 保持原样 */ }
        
        function preprocessCode(code) { /* 原样 */ }
        function exactMatch(code, dbValue) { /* 原样 */ }
        function findBarcodeRow(code) { /* 原样 */ }
        function getSearchableRowText(row) { /* 原样 */ }
        function findBestMatchRowIndex(query) { /* 原样 */ }
        
        function jumpToRowAndFocusQty(foundIndex) { /* 原样 */ }
        function stopScanningAndJump(foundIndex) { /* 原样 */ }
        function handleBarcode(code, fromCamera) { /* 原样（音量已提高）*/ }
        
        // 相机控制（完全恢复原有稳定版本，仅针对 iPad Pro 在启动后追加优化）
        function setupCameraControls(track) {
            cameraTrack = track || null;
            const torchBtn = document.getElementById('torchBtn');
            if (!torchBtn) return;
            torchBtn.classList.remove('active');
            torchBtn.textContent = '🔦 补光';
            torchBtn.onclick = async () => {
                if (!cameraTrack || !cameraTrack.getCapabilities) { showToast('当前相机不支持补光控制', true); return; }
                const caps = cameraTrack.getCapabilities();
                if (!caps.torch) { showToast('当前设备不支持手电筒', true); return; }
                const turnOn = !torchBtn.classList.contains('active');
                try {
                    await cameraTrack.applyConstraints({ advanced: [{ torch: turnOn }] });
                    torchBtn.classList.toggle('active', turnOn);
                    torchBtn.textContent = turnOn ? '🔦 关补光' : '🔦 补光';
                } catch (e) { showToast('补光切换失败', true); }
            };
            const videoContainer = document.querySelector('#scanUI .relative');
            if (videoContainer) {
                videoContainer.addEventListener('click', async () => {
                    if (cameraTrack && cameraTrack.getCapabilities && cameraTrack.getCapabilities().focusMode) {
                        try {
                            await cameraTrack.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: 1.0 }] });
                            setTimeout(() => {
                                if (cameraTrack) cameraTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                            }, 500);
                            showToast("🎯 已触发对焦", false);
                        } catch(e) {}
                    }
                });
            }
        }
        
        function applyCameraTuning(track) {
            if (!track || !track.getCapabilities) return;
            const caps = track.getCapabilities();
            const advanced = [];
            if (caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({ focusMode: 'continuous' });
            if (caps.exposureMode && caps.exposureMode.includes('continuous')) advanced.push({ exposureMode: 'continuous' });
            if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) advanced.push({ whiteBalanceMode: 'continuous' });
            if (caps.exposureCompensation) {
                const minExp = caps.exposureCompensation.min === undefined ? -1 : caps.exposureCompensation.min;
                const maxExp = caps.exposureCompensation.max === undefined ? 1 : caps.exposureCompensation.max;
                advanced.push({ exposureCompensation: Math.max(minExp, Math.min(maxExp, 0.2)) });
            }
            if (advanced.length) track.applyConstraints({ advanced }).catch(() => {});
        }
        
        // 仅在 iPad Pro 上尝试一次近距对焦（完全 try-catch，不影响主流程）
        async function applyIPadProNearFocus(track) {
            if (!track || !isIPadPro) return;
            try {
                const caps = track.getCapabilities();
                if (caps.focusMode && caps.focusMode.includes('manual')) {
                    await track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: 0.12 }] });
                    // 300ms 后恢复连续对焦（避免一直卡在手动）
                    setTimeout(() => {
                        if (track && track.getCapabilities && track.getCapabilities().focusMode?.includes('continuous')) {
                            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                        }
                    }, 300);
                }
                // 可选：稍微降低曝光补偿提升条码对比度
                if (caps.exposureCompensation) {
                    const min = caps.exposureCompensation.min || -1;
                    const max = caps.exposureCompensation.max || 1;
                    const val = Math.max(min, Math.min(max, -0.2));
                    await track.applyConstraints({ advanced: [{ exposureCompensation: val }] }).catch(() => {});
                }
            } catch(e) { /* 静默失败，不影响主流程 */ }
        }
        
        async function startScanning() {
            if (scanning) { showToast("扫描器已在运行", false); return; }
            const scanUI = document.getElementById('scanUI');
            scanUI.style.display = 'flex';
            scanning = true;
            if (reader) { try { await reader.reset(); } catch(e) {} reader = null; }
            
            const badge = document.getElementById('enhanceBadge');
            if (enhanceMode) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
            
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    }
                };
                
                const hints = new Map();
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                hints.set(ZXing.DecodeHintType.CHARACTER_SET, "UTF-8");
                hints.set(ZXing.DecodeHintType.ALLOWED_LENGTHS, null);
                hints.set(ZXing.DecodeHintType.RETURN_CODABAR_START_END, true);
                hints.set(ZXing.DecodeHintType.ALSO_INVERTED, true);
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
                    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR,
                    ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.PDF_417, ZXing.BarcodeFormat.QR_CODE
                ]);
                
                reader = new ZXing.BrowserMultiFormatReader(hints);
                reader.timeBetweenDecodingAttempts = 20;
                
                const videoEl = document.getElementById('video');
                const frameEl = document.getElementById('scanFrame');
                
                await reader.decodeFromConstraints(constraints, 'video', async (result, err) => {
                    if (!scanning) return;
                    if (result) {
                        const code = result.getText();
                        if (code) {
                            handleBarcode(code, true);
                            consecutiveFailures = 0;
                            lastDecodeSucceeded = true;
                            return;
                        }
                    }
                    consecutiveFailures++;
                    lastDecodeSucceeded = false;
                    if (enhanceMode || consecutiveFailures >= AUTO_ENHANCE_THRESHOLD) {
                        const enhancedCode = await tryEnhancedDecode(videoEl, frameEl);
                        if (enhancedCode) {
                            handleBarcode(enhancedCode, true);
                            consecutiveFailures = 0;
                            vibrate();
                        }
                    }
                });
                
                showToast("极速扫码引擎已启动" + (enhanceMode ? " (增强模式)" : ""), false);
                
                // 获取视频轨道并进行设置
                setTimeout(() => {
                    const track = videoEl?.srcObject?.getVideoTracks?.()[0];
                    if (track) {
                        setupCameraControls(track);
                        applyCameraTuning(track);
                        // ---------- 仅针对 iPad Pro 优化近距对焦速度 ----------
                        if (isIPadPro) {
                            applyIPadProNearFocus(track);
                            // 将对焦维持间隔从300ms缩短到120ms，提升近距离跟焦速度
                            if (currentFocusInterval) clearInterval(currentFocusInterval);
                            currentFocusInterval = setInterval(() => {
                                if (scanning && track && track.getCapabilities) {
                                    const caps = track.getCapabilities();
                                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                                        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                                    }
                                    // 同时维持曝光补偿
                                    if (caps.exposureCompensation) {
                                        const min = caps.exposureCompensation.min || -1;
                                        const max = caps.exposureCompensation.max || 1;
                                        const val = Math.max(min, Math.min(max, -0.2));
                                        track.applyConstraints({ advanced: [{ exposureCompensation: val }] }).catch(() => {});
                                    }
                                }
                            }, 120);  // 原非iPad为300ms，iPad Pro缩短到120ms
                        } else {
                            // 非 iPad Pro 保持原有300ms间隔（原有逻辑）
                            if (currentFocusInterval) clearInterval(currentFocusInterval);
                            currentFocusInterval = setInterval(() => {
                                if (!scanning) { clearInterval(currentFocusInterval); return; }
                                if (videoEl && videoEl.srcObject) {
                                    const t = videoEl.srcObject.getVideoTracks()[0];
                                    if (t && t.getCapabilities) {
                                        const caps = t.getCapabilities();
                                        if (caps.focusMode && caps.focusMode.includes('continuous')) {
                                            t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                                        }
                                        if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
                                            t.applyConstraints({ advanced: [{ exposureMode: 'continuous' }] }).catch(() => {});
                                        }
                                    }
                                }
                            }, 300);
                        }
                    }
                }, 300);
                
            } catch(err) {
                console.error("相机错误:", err);
                showToast("无法启动摄像头，请检查权限", true);
                stopScanning(true);
            }
        }
        
        function stopScanning(manual = false) {
            scanning = false;
            if (currentFocusInterval) { clearInterval(currentFocusInterval); currentFocusInterval = null; }
            if (reader) { try { reader.reset(); } catch(e) {} reader = null; }
            const videoEl = document.getElementById('video');
            if (videoEl && videoEl.srcObject) {
                const tracks = videoEl.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoEl.srcObject = null;
            }
            document.getElementById('scanUI').style.display = 'none';
            cameraTrack = null;
            consecutiveFailures = 0;
        }
        
        function toggleEnhanceMode() {
            enhanceMode = !enhanceMode;
            const topBtn = document.getElementById('scanEnhanceBtn');
            const badge = document.getElementById('enhanceBadge');
            if (enhanceMode) {
                topBtn.classList.add('active');
                topBtn.innerHTML = "✨ 增强开";
                if (badge) badge.classList.remove('hidden');
                showToast("增强模式已开启，将提高劣质条码识别率", false);
            } else {
                topBtn.classList.remove('active');
                topBtn.innerHTML = "✨ 增强";
                if (badge) badge.classList.add('hidden');
                showToast("增强模式已关闭", false);
            }
            if (scanning) {
                stopScanning(true);
                setTimeout(() => startScanning(), 200);
            }
        }
        
        // 表格渲染函数（与原版完全相同，此处省略详细实现）
        function render() { /* 原样 */ }
        function updateQty(i, v) { db[i]['实际数量'] = v; saveData(); showToast("已保存", false); hideKeyboard(); }
        function updateCell(i, c, v) { db[i][c] = v; saveData(); }
        function autoAdjustColumns() { /* 原样 */ }
        function renderColList() { /* 原样 */ }
        function setupDragAndDrop() { /* 原样 */ }
        function moveColumnUp(i) { /* 原样 */ }
        function moveColumnDown(i) { /* 原样 */ }
        function openColModal() { /* 原样 */ }
        function closeColModal() { /* 原样 */ }
        function addColumn() { /* 原样 */ }
        function deleteColumn(cn) { /* 原样 */ }
        
        // 导入导出
        document.getElementById('fileInput').onchange = function(e) { /* 原样 */ };
        function exportExcel() { /* 原样 */ }
        function hardReset() { /* 原样 */ }
        
        // 初始化事件
        window.addEventListener('resize', () => setTimeout(() => autoAdjustColumns(), 100));
        window.addEventListener('beforeunload', () => { if (scanning) stopScanning(true); });
        document.addEventListener('touchstart', function(e) { if (currentInputElement && !e.target.closest('.qty-input') && !e.target.closest('#manualInput')) hideKeyboard(); });
        
        loadData(); render(); setupKeyboardListener();
        
        document.getElementById('confirmBtn').onclick = () => { const input = document.getElementById('manualInput'); if (input.value.trim()) { handleBarcode(input.value, false); input.value = ''; } hideKeyboard(); };
        document.getElementById('manualInput').onkeypress = (e) => { if (e.key === 'Enter') { const input = e.target; if (input.value.trim()) { handleBarcode(input.value, false); input.value = ''; } hideKeyboard(); } };
        document.getElementById('scanBtn').onclick = () => { if (scanning) stopScanning(true); else startScanning(); hideKeyboard(); };
        document.getElementById('showKeyboardBtn').onclick = () => showKeyboard();
        document.getElementById('scanEnhanceBtn').onclick = () => toggleEnhanceMode();
        
        console.log(`⚡ 飞速盘点 最终稳定版 - iPad Pro 近距对焦优化 | 其他设备完全不变`);
    </script>
</body>
</html>
