<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飞速打印 · Supeasy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            background: #1e1e24;
            color: #f8fafc;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'SimHei', 'SimSun', 'NSimSun', 'WenQuanYi Micro Hei', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            padding: clamp(16px, 4vw, 24px);
        }
        h1 {
            font-size: clamp(22px, 6vw, 28px);
            color: #fbbf24;
            margin-bottom: 6px;
        }
        .sub {
            font-size: clamp(12px, 3vw, 14px);
            color: #64748b;
            margin-bottom: clamp(20px, 5vh, 32px);
            line-height: 1.5;
        }
        label {
            display: block;
            font-size: clamp(13px, 3.2vw, 15px);
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            height: clamp(52px, 8vh, 60px);
            border: 2px solid #3a3a44;
            border-radius: 12px;
            background: #0a0a0c;
            color: #22c55e;
            font-size: clamp(22px, 5.5vw, 28px);
            font-weight: 800;
            padding: 0 14px;
            outline: none;
        }
        input:focus { border-color: #d97706; }
        .hint {
            font-size: clamp(11px, 2.8vw, 13px);
            color: #64748b;
            margin: 10px 0 20px;
            line-height: 1.45;
        }
        .btn {
            width: 100%;
            min-height: clamp(52px, 8vh, 60px);
            border: none;
            border-radius: 12px;
            font-size: clamp(17px, 4.2vw, 20px);
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d97706, #b45309);
            box-shadow: 0 4px 0 #92400e;
        }
        .btn:active { filter: brightness(0.9); }
        .status {
            margin-top: auto;
            padding-top: 16px;
            font-size: 12px;
            color: #475569;
            text-align: center;
        }
        .ok { color: #22c55e; }
        .err { color: #ef4444; }
    </style>
</head>
<body>
    <h1>飞速打印</h1>
    <p class="sub">Supeasy 专用 · 连接新闻超市系统<br>（与 hipos 商贸通互不影响）</p>

    <label for="macIp">中心电脑 IP（Mac 局域网地址）</label>
    <input type="text" id="macIp" inputmode="decimal" autocomplete="off" placeholder="例如 192.168.100.116">
    <p class="hint">勿填手持机自己的 WiFi IP。hipos 商贸通请勿修改；仅本 Supeasy 壳使用此页。</p>

    <button type="button" class="btn btn-primary" id="btnEnter">进入超市系统</button>

    <p class="status" id="status"></p>

    <script>
        (function() {
            var KEY = 'supeasy_server_ip';
            var KEY_ALT = 'hh_feisu_ip';
            var ipInput = document.getElementById('macIp');
            var statusEl = document.getElementById('status');
            var params = new URLSearchParams(location.search);
            var queryIp = (params.get('ip') || '').trim();
            var saved = queryIp || localStorage.getItem(KEY) || localStorage.getItem(KEY_ALT) || '';

            function normIp(v) {
                return String(v || '').trim().replace(/^https?:\/\//i, '').split(':')[0].split('/')[0];
            }

            function targetUrl(ip) {
                return 'http://' + ip + ':8080/';
            }

            function saveAndGo(ip) {
                ip = normIp(ip);
                if (!ip) {
                    statusEl.textContent = '请输入 Mac 的 IP 地址';
                    statusEl.className = 'status err';
                    return;
                }
                localStorage.setItem(KEY, ip);
                localStorage.setItem(KEY_ALT, ip);
                statusEl.textContent = '正在打开 ' + targetUrl(ip) + ' …';
                statusEl.className = 'status ok';
                location.replace(targetUrl(ip));
            }

            if (saved) ipInput.value = saved;

            if (params.get('auto') === '1' && saved) {
                saveAndGo(saved);
                return;
            }

            document.getElementById('btnEnter').onclick = function() {
                saveAndGo(ipInput.value);
            };

            ipInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') saveAndGo(ipInput.value);
            });

            if (typeof window.AndroidHardware !== 'undefined') {
                statusEl.textContent = '已检测到内置打印接口（Supeasy/H60）';
                statusEl.className = 'status ok';
            }
        })();
    </script>
</body>
</html>
