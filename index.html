            position: absolute; top: 25%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 220px;
            border: 3px solid #3b82f6; border-radius: 20px;
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.75);
            z-index: 10; pointer-events: none; background: rgba(0,0,0,0.1);

            position: absolute; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, #3b82f6, transparent);
            top: 0; animation: scanLineMove 1.2s infinite ease-in-out;

        .bottom-btn {

        if(!codes.length){e.style.display='block';e.textContent='❌ 系统初始化中，请稍后重试';return}
        var matched=null;
        for(var j=0;j<codes.length;j++){if(codes[j].code===c){matched=codes[j];break}}
        if(!matched){e.style.display='block';e.textContent='❌ 授权码不存在';return}
        if(matched.used&&matched.deviceId!==getDid()){e.style.display='block';e.textContent='❌ 该授权码已被其他设备使用';return}
        matched.used=true;matched.deviceId=getDid();
        data.activated=true;saveAuthData(data);
        document.getElementById('authOverlay').style.display='none';
        try{typeof showToast==='function'&&showToast("✅ 授权成功！欢迎使用飞速盘点",false)}catch(_){}
        try{typeof playBeep==='function'&&playBeep(true)}catch(_){}
    }
    var data=getAuthData();
    var authEl=document.getElementById('authOverlay');
    if(data&&data.activated){ authEl.style.display='none'; }
    else { authEl.style.display='flex'; }
    </script>

    <script>
        // ============================================================
        // 飞速盘点 · Sanfei v3.3.6
        // 智能扫码识别引擎（独立文件，不和SUPEASY关联）
        // ============================================================
        
        const VERSION = "S3.3.6";
        const STORAGE_KEY = "FEISUPANDIAN_DATA";
        
        let db = [];
        let columns = [];
        let scanning = false;
        let reader = null;
        let lastCode = "";
        let lastTime = 0;
        let currentFocusInterval = null;
        let pendingJump = null;
        let currentInputElement = null;
        let originalViewportHeight = window.innerHeight;
        let cameraTrack = null;
        
        let enhanceMode = false;
        let consecutiveFailures = 0;
        const AUTO_ENHANCE_THRESHOLD = 3;
        let lastDecodeSucceeded = true;
        let preprocessCanvas = null;

        // ============================================================
        // 智能扫码识别引擎
        // ============================================================
        
        function normalizeCode(str) {
            if (!str) return '';
            return String(str)
                .toUpperCase()
                .replace(/\s+/g, '')
                .replace(/-/g, '')
                .replace(/_/g, '')
                .replace(/[^A-Z0-9]/g, '');
        }

        function reverseString(str) {
            if (!str) return '';
            return str.split('').reverse().join('');
        }

        function detectBarcodeAndCodeColumns(row) {
            const barcodeKeywords = [
                '条码', 'barcode', 'ean', 'upc', '商品编号', '产品编号', '货号', 'sku',
                'codigo', 'código', 'product code', 'item', 'ref', 'referencia'
            ];
            const codeKeywords = [
                '编码', 'code', '编号', '商品编码', '产品编码', '型号', 'modelo',
                'codigo', 'código', 'producto', 'item code', 'part', 'partnumber',
                '零件号', '料号', '规格', 'spec'
            ];
            const skipColumnKeywords = ['名称', 'name', 'descripcion', 'desc', '备注', '说明'];
            
            let barcodeKey = null, codeKey = null;
            let scoredBarcode = [], scoredCode = [];
            
            for (let key of Object.keys(row)) {
                const keyLower = key.toLowerCase().trim();
                const val = String(row[key] || '').trim();
                if (!val) continue;
                
                let isSkipColumn = false;
                for (let sk of skipColumnKeywords) {
                    if (keyLower.includes(sk)) { isSkipColumn = true; break; }
                }
                if (isSkipColumn) continue;
                
                for (let kw of barcodeKeywords) {
                    if (keyLower.includes(kw)) { scoredBarcode.push({ key, val, score: 10 }); break; }
                }
                for (let kw of codeKeywords) {
                    if (keyLower.includes(kw)) { scoredCode.push({ key, val, score: 10 }); break; }
                }
                if (keyLower.includes('名称') || keyLower.includes('name')) continue;
                
                if (/^\d{8,}$/.test(val)) {
                    scoredBarcode.push({ key, val, score: 5 });
                } else if (/[A-Za-z]/.test(val) && /\d/.test(val)) {
                    scoredCode.push({ key, val, score: 5 });
                }
            }
            
            const bestBarcode = scoredBarcode.sort((a, b) => b.score - a.score)[0];
            const bestCode = scoredCode.sort((a, b) => b.score - a.score)[0];
            
            if (bestBarcode && bestCode && bestBarcode.key === bestCode.key) {
                return { barcodeKey: bestBarcode.key, codeKey: null };
            }
            
            return {
                barcodeKey: bestBarcode ? bestBarcode.key : null,
                codeKey: bestCode ? bestCode.key : null
            };
        }

        function computePrecomputedFields(row) {
            const { barcodeKey, codeKey } = detectBarcodeAndCodeColumns(row);
            
            let barcode = barcodeKey ? String(row[barcodeKey] || '').trim() : '';
            let code = codeKey ? String(row[codeKey] || '').trim() : '';
            
            if (!barcode) {
                for (let key of Object.keys(row)) {
                    const val = String(row[key] || '').trim();
                    if (val && /^\d{8,}$/.test(val)) { barcode = val; break; }
                }
            }
            if (!barcode) {
                for (let key of Object.keys(row)) {
                    if (key.startsWith('__')) continue;
                    const val = String(row[key] || '').trim();
                    if (!val) continue;
                    const keyLower = key.toLowerCase();
                    if (keyLower.includes('名称') || keyLower.includes('name') || 
                        keyLower.includes('descripcion') || keyLower.includes('desc') ||
                        keyLower.includes('备注') || keyLower.includes('说明') ||
                        keyLower.includes('cantidad') || keyLower.includes('precio') ||
                        keyLower.includes('price') || keyLower.includes('数量') ||
                        keyLower.includes('折扣') || keyLower.includes('descuento') ||
                        keyLower.includes('total')) continue;
                    if (val.length >= 3) { barcode = val; break; }
                }
            }
            if (!code && barcode) { code = barcode; }
            
            const barcodeNorm = normalizeCode(barcode || '');
            const codeNorm = normalizeCode(code || '');
            
            row.__barcode_normalized = barcodeNorm;
            row.__barcode_reverse = reverseString(barcodeNorm);
            row.__barcode_last6 = barcodeNorm.length >= 6 ? barcodeNorm.slice(-6) : barcodeNorm;
            row.__code_normalized = codeNorm;
            row.__code_reverse = reverseString(codeNorm);
            row.__code_last6 = codeNorm.length >= 6 ? codeNorm.slice(-6) : codeNorm;
        }

        function recomputeAllPrecomputedFields() {
            for (let i = 0; i < db.length; i++) { computePrecomputedFields(db[i]); }
        }

        function smartMatch(input) {
            if (!input || !db.length) return null;
            
            const normalized = normalizeCode(input);
            if (!normalized) return null;
            
            const reversed = reverseString(normalized);
            
            const matchedIndices = new Set();
            let results = [];
            
            // ① 精确匹配
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                if (row.__barcode_normalized === normalized || row.__code_normalized === normalized) {
                    if (!matchedIndices.has(i)) { matchedIndices.add(i); results.push({ index: i, matchType: '精确匹配', score: 1000 }); }
                }
            }
            if (results.length === 1) return results[0];
            if (results.length > 1) return { multiMatch: true, results };
            
            // ② 反向精确匹配
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                if (row.__barcode_reverse === reversed || row.__code_reverse === reversed) {
                    if (!matchedIndices.has(i)) { matchedIndices.add(i); results.push({ index: i, matchType: '反向精确匹配', score: 900 }); }
                }
            }
            if (results.length === 1) return results[0];
            if (results.length > 1) return { multiMatch: true, results };
            
            // ③ 尾6位匹配
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                const last6 = normalized.length >= 6 ? normalized.slice(-6) : normalized;
                if (last6 && row.__barcode_last6 === last6) {
                    if (!matchedIndices.has(i)) { matchedIndices.add(i); results.push({ index: i, matchType: '尾6位匹配', score: 800 }); }
                }
            }
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                const last6 = normalized.length >= 6 ? normalized.slice(-6) : normalized;
                if (last6 && row.__code_last6 === last6) {
                    if (!matchedIndices.has(i)) { matchedIndices.add(i); results.push({ index: i, matchType: '编码尾6位匹配', score: 700 }); }
                }
            }
            if (results.length === 1) return results[0];
            if (results.length > 1) return { multiMatch: true, results };
            
            // ④ 反向尾6位匹配
            const revLast6 = reversed.length >= 6 ? reversed.slice(-6) : reversed;
            if (revLast6) {
                for (let i = 0; i < db.length; i++) {
                    const row = db[i];
                    if (row.__barcode_last6 === revLast6 || row.__code_last6 === revLast6) {
                        if (!matchedIndices.has(i)) { matchedIndices.add(i); results.push({ index: i, matchType: '反向尾6位匹配', score: 600 }); }
                    }
                }
                if (results.length === 1) return results[0];
                if (results.length > 1) return { multiMatch: true, results };
            }
            
            // ⑤ contains模糊匹配
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                if ((row.__barcode_normalized && row.__barcode_normalized.includes(normalized)) || 
                    (row.__code_normalized && row.__code_normalized.includes(normalized)) ||
                    getSearchableRowText(row).includes(normalized.toLowerCase())) {
                    if (!matchedIndices.has(i)) { matchedIndices.add(i); results.push({ index: i, matchType: '模糊匹配', score: 500 }); }
                }
            }
            if (results.length === 1) return results[0];
            if (results.length > 1) return { multiMatch: true, results };
            
            // ⑥ 全字段兜底
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                for (let key of Object.keys(row)) {
                    if (key.startsWith('__')) continue;
                    const cellVal = String(row[key] || '').trim();
                    if (!cellVal) continue;
                    const cellNorm = normalizeCode(cellVal);
                    if (cellNorm === normalized || cellNorm.includes(normalized) || normalized.includes(cellNorm)) {
                        if (!matchedIndices.has(i)) { matchedIndices.add(i); results.push({ index: i, matchType: '全字段兜底匹配', score: 400 }); }
                        break;
                    }
                    if (input.length >= 3 && cellVal.toLowerCase().includes(input.toLowerCase())) {
                        if (!matchedIndices.has(i)) { matchedIndices.add(i); results.push({ index: i, matchType: '全字段包含匹配', score: 300 }); }
                        break;
                    }
                }
            }
            if (results.length === 1) return results[0];
            if (results.length > 1) return { multiMatch: true, results };
            
            return null;
        }

        function smartMatchWithPopup(input) {
            const result = smartMatch(input);
            if (result && result.multiMatch !== true && typeof result.index === 'number') {
                return result.index;
            }
            if (result && result.multiMatch && result.results && result.results.length > 1) {
                showMultiMatchPopup(result.results);
                return null;
            }
            return null;
        }

        let multiMatchCallback = null;
        let multiMatchPopupShowing = false;

        function showMultiMatchPopup(matchResults) {
            multiMatchPopupShowing = true;
            const modal = document.getElementById('multiMatchModal');
            const list = document.getElementById('matchList');
            list.innerHTML = matchResults.map(m => {
                const row = db[m.index];
                const name = row['商品名称'] || row['名称'] || '(无名称)';
                const code = row['条码'] || row['编码'] || '';
                const qty = row['实际数量'] || 0;
                return `<div class="match-item" onclick="selectMatch(${m.index})">
                    <div><div class="name">${escapeHtml(String(name).substring(0, 30))}</div>
                    <div class="code">${escapeHtml(String(code).substring(0, 25))}</div></div>
                    <div class="qty-badge">已盘: ${qty || 0}</div></div>`;
            }).join('');
            modal.style.display = 'flex';
        }

        function closeMultiMatchModal() {
            document.getElementById('multiMatchModal').style.display = 'none';
            multiMatchCallback = null;
            multiMatchPopupShowing = false;
        }

        function selectMatch(index) {
            closeMultiMatchModal();
            consecutiveFailures = 0;
            lastDecodeSucceeded = true;
            playBeep(true);
            vibrate();
            jumpToRowAndFocusQty(index);
            showToast(`✅ ${db[index]['商品名称'] || db[index]['名称'] || '已选择'}`, false);
        }

        function onManualInputChange() {
            const input = document.getElementById('manualInput');
            const indicator = document.getElementById('smartIndicator');
            const val = (input.value || '').trim();
            if (val.length >= 4) {
                const result = smartMatch(val);
                if (result && result.multiMatch !== true && typeof result.index === 'number') {
                    const row = db[result.index];
                    const name = row['商品名称'] || row['名称'] || '';
                    input.placeholder = `🤖 识别: ${escapeHtml(String(name).substring(0,20))}`;
                    indicator.style.display = 'inline-block';
                } else if (result && result.multiMatch) {
                    input.placeholder = `📋 匹配到 ${result.results.length} 个商品，点击确认选择`;
                    indicator.style.display = 'inline-block';
                } else {
                    input.placeholder = '📱 输入条码/编码/名称（支持智能识别）...';
                    indicator.style.display = 'none';
                }
            } else {
                input.placeholder = '📱 输入条码/编码/名称（支持智能识别）...';
                indicator.style.display = 'none';
            }
        }

        // ---------- 兼容旧版匹配 ----------
        function preprocessCode(code) {
            if (!code) return code;
            let cleaned = code.replace(/[^\w\d]/g, '');
            if (cleaned.startsWith('*') && cleaned.endsWith('*')) cleaned = cleaned.slice(1, -1);
            if (cleaned.length === 12 && /^\d+$/.test(cleaned)) cleaned = '0' + cleaned;
            return cleaned;
        }

        function exactMatch(code, dbValue) {
            if (!code || !dbValue) return false;
            const codeStr = String(code).trim();
            const dbStr = String(dbValue).trim();
            if (codeStr === dbStr) return true;
            const processedCode = preprocessCode(codeStr);
            const processedDb = preprocessCode(dbStr);
            if (processedCode === processedDb) return true;
            if (codeStr.toLowerCase() === dbStr.toLowerCase()) return true;
            if (/^\d+$/.test(codeStr) && /^\d+$/.test(dbStr)) {
                const codeNum = codeStr.replace(/^0+/, '');
                const dbNum = dbStr.replace(/^0+/, '');
                if (codeNum === dbNum && codeNum.length > 0) return true;
            }
            return false;
        }

        function findBarcodeRow(code) {
            if (!code || db.length === 0) return -1;
            const codeStr = String(code).trim();
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                for (let key in row) {
                    if (key.startsWith('__')) continue;
                    const val = String(row[key] || '').trim();
                    if (exactMatch(codeStr, val)) return i;
                }
            }
            return -1;
        }

        function getSearchableRowText(row) {
            return Object.keys(row || {}).filter(k => !k.startsWith('__')).map(k => String(row[k] || '').trim()).join(' ').toLowerCase();
        }

        function findBestMatchRowIndex(query) {
            if (!query || !db.length) return -1;
            const token = String(query).trim();
            if (!token) return -1;
            const exact = findBarcodeRow(token);
            if (exact !== -1) return exact;
            const normalized = preprocessCode(token).toLowerCase();
            for (let i = 0; i < db.length; i++) {
                const row = db[i] || {};
                const values = Object.keys(row).filter(k => !k.startsWith('__')).map(k => String(row[k] || '').trim());
                for (const val of values) {
                    const v = val.toLowerCase();
                    const pv = preprocessCode(val).toLowerCase();
                    if ((normalized && (v.startsWith(normalized) || pv.startsWith(normalized))) || v.startsWith(token.toLowerCase())) return i;
                }
            }
            for (let i = 0; i < db.length; i++) {
                if (getSearchableRowText(db[i]).includes(token.toLowerCase())) return i;
            }
            return -1;
        }

        // ---------- UI ----------
        function jumpToRowAndFocusQty(foundIndex) {
            const rowEl = document.getElementById(`row-${foundIndex}`);
            if (rowEl) {
                document.querySelectorAll('#mainTable tbody tr').forEach(tr => tr.classList.remove('row-focus'));
                rowEl.classList.add('row-focus');
                rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const qtyInput = document.getElementById(`qty-${foundIndex}`);
                if (qtyInput) {
                    currentInputElement = qtyInput;
                    setTimeout(() => {
                        qtyInput.focus();
                        qtyInput.select();
                        qtyInput.style.transform = 'scale(1.02)';
                        qtyInput.style.borderColor = '#10b981';
                        qtyInput.style.backgroundColor = '#fef9c3';
                        const handleInputComplete = function(e) {
                            if (e.type === 'blur' || (e.type === 'keypress' && e.key === 'Enter')) {
                                hideKeyboard();
                                qtyInput.removeEventListener('blur', handleInputComplete);
                                qtyInput.removeEventListener('keypress', handleInputComplete);
                            }
                        };
                        qtyInput.addEventListener('blur', handleInputComplete);
                        qtyInput.addEventListener('keypress', handleInputComplete);
                        setTimeout(() => { if (qtyInput) { qtyInput.style.transform = ''; qtyInput.style.borderColor = ''; qtyInput.style.backgroundColor = ''; } }, 500);
                    }, 300);
                }
                return true;
            }
            return false;
        }

        function stopScanningAndJump(foundIndex) {
            pendingJump = foundIndex;
            scanning = false;
            if (currentFocusInterval) { clearInterval(currentFocusInterval); currentFocusInterval = null; }
            if (reader) { try { reader.reset(); } catch(e) {} reader = null; }
            const videoEl = document.getElementById('video');
            if (videoEl && videoEl.srcObject) {
                const tracks = videoEl.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoEl.srcObject = null;
            }
            document.getElementById('scanUI').style.display = 'none';
            setTimeout(() => { jumpToRowAndFocusQty(foundIndex); pendingJump = null; }, 150);
        }

        function handleBarcode(code, fromCamera = false) {
            if (!code) return false;
            const now = Date.now();
            const codeStr = String(code).trim();
            if (codeStr === lastCode && (now - lastTime) < 200) return false;
            lastCode = codeStr;
            lastTime = now;
            
            let foundIndex = smartMatchWithPopup(codeStr);
            
            if (foundIndex === null || foundIndex === undefined || foundIndex === -1) {
                if (multiMatchPopupShowing) return true;
                foundIndex = findBestMatchRowIndex(codeStr);
            }
            
            if (foundIndex === null || foundIndex === undefined || foundIndex === -1) {
                playBeep(false);
                showToast(`❌ 未匹配: ${codeStr.substring(0, 20)}`, true);
                vibrate();
                consecutiveFailures++;
                lastDecodeSucceeded = false;
                setTimeout(() => { const m = document.getElementById('manualInput'); if (m) { m.focus(); m.select(); currentInputElement = m; } }, 100);
                return false;
            }
            
            consecutiveFailures = 0;
            lastDecodeSucceeded = true;
            playBeep(true);
            vibrate();
            const productName = db[foundIndex]['商品名称'] || db[foundIndex]['名称'] || codeStr;
            showToast(`✅ ${productName}`, false);
            const scanFrame = document.getElementById('scanFrame');
            if (scanFrame) { scanFrame.classList.add('scan-success'); setTimeout(() => scanFrame.classList.remove('scan-success'), 200); }
            if (fromCamera) stopScanningAndJump(foundIndex);
            else jumpToRowAndFocusQty(foundIndex);
            return true;
        }

        // ---------- 相机 ----------
        function setupCameraControls(track) {
            cameraTrack = track || null;
            const torchBtn = document.getElementById('torchBtn');
            if (!torchBtn) return;
            torchBtn.classList.remove('active');
            torchBtn.textContent = '🔦 补光';
            torchBtn.onclick = async () => {
                if (!cameraTrack || !cameraTrack.getCapabilities) { showToast('当前相机不支持补光控制', true); return; }
                const caps = cameraTrack.getCapabilities();
                if (!caps.torch) { showToast('当前设备不支持手电筒', true); return; }
                const turnOn = !torchBtn.classList.contains('active');
                try {
                    await cameraTrack.applyConstraints({ advanced: [{ torch: turnOn }] });
                    torchBtn.classList.toggle('active', turnOn);
                    torchBtn.textContent = turnOn ? '🔦 关补光' : '🔦 补光';
                } catch (e) { showToast('补光切换失败', true); }
            };
        }

        async function triggerFastFocus(track) {
            if (!track || !track.getCapabilities) return;
            const caps = track.getCapabilities();
            if (!caps.focusMode) return;
            try {
                if (caps.focusMode.includes('manual')) { await track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: 0.05 }] }); }
                const distances = [0.05, 0.08, 0.12, 0.18];
                for (const d of distances) {
                    if (caps.focusMode.includes('manual')) { await track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: d }] }); }
                    await new Promise(r => setTimeout(r, 30));
                }
                if (caps.focusMode.includes('continuous')) { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); }
            } catch (e) {
                try { if (caps.focusMode.includes('continuous')) { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } } catch(_) {}
            }
        }

        function applyCameraTuning(track) {
            if (!track || !track.getCapabilities) return;
            const caps = track.getCapabilities();
            const advanced = [];
            if (caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({ focusMode: 'continuous' });
            if (caps.exposureMode && caps.exposureMode.includes('continuous')) advanced.push({ exposureMode: 'continuous' });
            if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) advanced.push({ whiteBalanceMode: 'continuous' });
            if (caps.exposureCompensation) {
                const minExp = typeof caps.exposureCompensation.min === 'number' ? caps.exposureCompensation.min : -2;
                const maxExp = typeof caps.exposureCompensation.max === 'number' ? caps.exposureCompensation.max : 2;
                advanced.push({ exposureCompensation: Math.max(minExp, Math.min(maxExp, 0.5)) });
            }
            if (advanced.length) track.applyConstraints({ advanced }).catch(() => {});
        }

        function getFrameROI(videoEl, frameEl) {
            const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
            if (!vw || !vh) return null;
            const vr = videoEl.getBoundingClientRect();
            const fr = frameEl.getBoundingClientRect();
            const videoAspect = vw / vh;
            const boxAspect = vr.width / vr.height;
            let renderW, renderH, offsetX = 0, offsetY = 0;
            if (videoAspect > boxAspect) { renderH = vr.height; renderW = renderH * videoAspect; offsetX = (renderW - vr.width) / 2; }
            else { renderW = vr.width; renderH = renderW / videoAspect; offsetY = (renderH - vr.height) / 2; }
            const xInBox = fr.left - vr.left + offsetX;
            const yInBox = fr.top - vr.top + offsetY;
            const sx = vw / renderW, sy = vh / renderH;
            let roiX = Math.max(0, Math.floor(xInBox * sx));
            let roiY = Math.max(0, Math.floor(yInBox * sy));
            let roiW = Math.min(vw - roiX, Math.floor(fr.width * sx));
            let roiH = Math.min(vh - roiY, Math.floor(fr.height * sy));
            if (roiW <= 0 || roiH <= 0) return null;
            const lowerY = roiY + Math.floor(roiH * 0.55);
            const lowerH = roiH - Math.floor(roiH * 0.55);
            if (lowerH < 10) return { x: roiX, y: roiY, w: roiW, h: roiH };
            return { x: roiX, y: lowerY, w: roiW, h: lowerH };
        }

        function preprocessImageForBarcode(videoEl, roi) {
            const canvas = document.createElement('canvas');
            canvas.width = roi.w; canvas.height = roi.h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(videoEl, roi.x, roi.y, roi.w, roi.h, 0, 0, roi.w, roi.h);
            const imgData = ctx.getImageData(0, 0, roi.w, roi.h);
            const data = imgData.data;
            let min = 255, max = 0;
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                data[i] = data[i+1] = data[i+2] = gray;
                if (gray < min) min = gray;
                if (gray > max) max = gray;
            }
            const threshold = min + (max - min) * 0.55;
            for (let i = 0; i < data.length; i += 4) { const val = data[i] > threshold ? 255 : 0; data[i] = data[i+1] = data[i+2] = val; }
            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }

        async function tryEnhancedDecode(videoEl, frameEl) {
            if (!videoEl || videoEl.readyState < 2) return null;
            const roi = getFrameROI(videoEl, frameEl);
            if (!roi) return null;
            const processedCanvas = preprocessImageForBarcode(videoEl, roi);
            if (!processedCanvas) return null;
            if ('BarcodeDetector' in window) {
                try {
                    const detector = new window.BarcodeDetector({
                        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_39', 'code_93', 'code_128', 'itf', 'codabar']
                    });
                    const codes = await detector.detect(processedCanvas);
                    if (codes && codes.length > 0) return codes[0].rawValue;
                } catch(e) {}
            }
            return null;
        }

        async function startScanning() {
            if (scanning) { showToast("扫描器已在运行", false); return; }
            const hasNativeDetector = 'BarcodeDetector' in window;
            const isIPadDevice = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchstart' in window;
            const scanFrame = document.getElementById('scanFrame');
            if (scanFrame) scanFrame.style.top = isIPadDevice ? '15%' : '25%';
            const scanUI = document.getElementById('scanUI');
            scanUI.style.display = 'flex';
            scanning = true;
            if (reader) { try { await reader.reset(); } catch(e) {} reader = null; }
            const badge = document.getElementById('enhanceBadge');
            if (enhanceMode) badge.classList.remove('hidden'); else badge.classList.add('hidden');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }
                });
                const videoEl = document.getElementById('video');
                videoEl.srcObject = stream;
                await videoEl.play();
                
                setTimeout(() => {
                    const track = videoEl?.srcObject?.getVideoTracks?.()[0];
                    if (track) { setupCameraControls(track); applyCameraTuning(track); triggerFastFocus(track); }
                }, 300);
                
                if (hasNativeDetector) {
                    const detector = new window.BarcodeDetector({
                        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_39', 'code_93', 'code_128', 'itf', 'codabar', 'qr_code', 'data_matrix', 'pdf417', 'aztec']
                    });
                    const nativeDecodeLoop = async () => {
                        while (scanning && videoEl.readyState >= 2) {
                            try {
                                const codes = await detector.detect(videoEl);
                                if (codes && codes.length > 0 && scanning) {
                                    const code = codes[0].rawValue;
                                    if (code) {
                                        const now = Date.now();
                                        if (code !== lastCode || (now - lastTime) >= 300) {
                                            handleBarcode(code, true);
                                            consecutiveFailures = 0; lastDecodeSucceeded = true;
                                            lastCode = code; lastTime = now;
                                        }
                                    }
                                } else {
                                    consecutiveFailures++;
                                    if (enhanceMode || consecutiveFailures >= AUTO_ENHANCE_THRESHOLD) {
                                        const enhancedCode = await tryEnhancedDecode(videoEl, scanFrame);
                                        if (enhancedCode) { handleBarcode(enhancedCode, true); consecutiveFailures = 0; vibrate(); }
                                    }
                                }
                            } catch(e) { consecutiveFailures++; }
                            await new Promise(r => setTimeout(r, 150));
                        }
                    };
                    nativeDecodeLoop();
                    showToast("📷 原生条码引擎已启动" + (enhanceMode ? " (增强模式)" : ""), false);
                } else {
                    const hints = new Map();
                    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                    hints.set(ZXing.DecodeHintType.CHARACTER_SET, "UTF-8");
                    hints.set(ZXing.DecodeHintType.ALLOWED_LENGTHS, null);
                    hints.set(ZXing.DecodeHintType.RETURN_CODABAR_START_END, true);
                    hints.set(ZXing.DecodeHintType.ALSO_INVERTED, true);
                    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
                        ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
                        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR,
                        ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.PDF_417, ZXing.BarcodeFormat.QR_CODE
                    ]);
                    reader = new ZXing.BrowserMultiFormatReader(hints);
                    reader.timeBetweenDecodingAttempts = 15;
                    reader.decodeFromVideoElement('video', (result, err) => {
                        if (!scanning) return;
                        if (result) { const code = result.getText(); if (code) { handleBarcode(code, true); consecutiveFailures = 0; lastDecodeSucceeded = true; return; } }
                        consecutiveFailures++; lastDecodeSucceeded = false;
                        if (enhanceMode || consecutiveFailures >= AUTO_ENHANCE_THRESHOLD) {
                            tryEnhancedDecode(videoEl, scanFrame).then(enhancedCode => {
                                if (enhancedCode) { handleBarcode(enhancedCode, true); consecutiveFailures = 0; vibrate(); }
                            });
                        }
                    });
                    showToast("ZXing 扫码引擎已启动" + (enhanceMode ? " (增强模式)" : ""), false);
                }
                
                currentFocusInterval = setInterval(() => {
                    if (!scanning) { clearInterval(currentFocusInterval); return; }
                    if (videoEl && videoEl.srcObject) {
                        const track = videoEl.srcObject.getVideoTracks()[0];
                        if (track && track.getCapabilities) {
                            const caps = track.getCapabilities();
                            const cycleStep = (Math.floor(Date.now() / 180)) % 8;
                            if (cycleStep < 4 && caps.focusMode && caps.focusMode.includes('manual')) {
                                const dist = [0.04, 0.07, 0.10, 0.15][cycleStep];
                                track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: dist }] }).catch(() => {});
                            } else {
                                if (caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                                if (caps.exposureMode && caps.exposureMode.includes('continuous')) track.applyConstraints({ advanced: [{ exposureMode: 'continuous' }] }).catch(() => {});
                            }
                        }
                    }
                }, 180);
                
                videoEl.addEventListener('click', async () => {
                    if (!scanning) return;
                    const track = videoEl?.srcObject?.getVideoTracks?.()[0];
                    if (track) { await triggerFastFocus(track); showToast("🎯 快速对焦完成", false); }
                });
                
            } catch(err) { console.error("相机错误:", err); showToast("无法启动摄像头，请检查权限", true); stopScanning(true); }
        }

        function stopScanning(manual = false) {
            scanning = false;
            if (currentFocusInterval) { clearInterval(currentFocusInterval); currentFocusInterval = null; }
            if (reader) { try { reader.reset(); } catch(e) {} reader = null; }
            const videoEl = document.getElementById('video');
            if (videoEl && videoEl.srcObject) { const tracks = videoEl.srcObject.getTracks(); tracks.forEach(track => track.stop()); videoEl.srcObject = null; }
            document.getElementById('scanUI').style.display = 'none';
            cameraTrack = null;
            consecutiveFailures = 0;
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) { const data = JSON.parse(saved); db = data.db || []; columns = data.columns || []; }
                if (!columns.length) { columns = ['实际数量', '商品名称', '编码', '价格']; db = []; }
                normalizeActualQtyColumnPosition();
                db.forEach(row => { if (row['实际数量'] === undefined) row['实际数量'] = ''; });
                recomputeAllPrecomputedFields();
            } catch(e) { console.error(e); columns = ['实际数量', '商品名称', '编码', '价格']; normalizeActualQtyColumnPosition(); db = []; }
        }

        function normalizeActualQtyColumnPosition() {
            if (!Array.isArray(columns) || !columns.length) return;
            const qtyCol = '实际数量';
            const idx = columns.indexOf(qtyCol);
            if (idx === -1) return;
            columns.splice(idx, 1);
            columns.splice(Math.min(4, columns.length), 0, qtyCol);
        }

        function saveData() {
            try { recomputeAllPrecomputedFields(); localStorage.setItem(STORAGE_KEY, JSON.stringify({ db, columns, version: VERSION })); }
            catch(e) { showToast("存储空间不足", true); }
        }

        function playBeep(success) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = success ? 1200 : 400;
                gain.gain.value = 0.6;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.2);
                osc.stop(ctx.currentTime + 0.2);
                ctx.resume();
            } catch(e) {}
        }

            for (let code of fb) { if (added >= 10) break; if (!exist.has(code)) { exist.add(code); authCodes.push({ code, used: false, deviceId: '' }); added++; } }
            saveAuthState(); renderAdminCodeList(); showToast(`✅ 已追加 ${added} 个新授权码`, false);
        }

        // ---------- 渲染 ----------
        function render() {
            const thead = document.getElementById('tHead');
            const tbody = document.getElementById('tBody');
            if (!columns.length) { tbody.innerHTML = '<tr><td colspan="10" class="text-center p-6 text-gray-500">暂无数据，请导入Excel或添加列表</td></tr>'; return; }
            thead.innerHTML = `<tr>${columns.map(col => `<th>${col}</th>`).join('')}</tr>`;
            tbody.innerHTML = db.map((row, idx) => `<tr id="row-${idx}">${columns.map(col => `<td>${col === '实际数量' ? `<input id="qty-${idx}" type="number" value="${row[col] || ''}" class="qty-input" onchange="updateQty(${idx}, this.value)" onfocus="this.select()" placeholder="0" inputmode="numeric" />` : `<input type="text" value="${escapeHtml(String(row[col] || ''))}" class="w-full p-2 text-sm outline-none bg-transparent" style="min-width:80px;width:100%;" onchange="updateCell(${idx}, '${col}', this.value)" />`}</td>`).join('')}</tr>`).join('');
            setTimeout(() => autoAdjustColumns(), 50);
            if (pendingJump !== null) setTimeout(() => { jumpToRowAndFocusQty(pendingJump); pendingJump = null; }, 100);
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
        function updateQty(i, v) { db[i]['实际数量'] = v; saveData(); showToast("已保存", false); hideKeyboard(); }
        function updateCell(i, col, v) { db[i][col] = v; computePrecomputedFields(db[i]); saveData(); }

        function autoAdjustColumns() {
            const table = document.getElementById('mainTable'); if (!table) return;
            const cc = columns.length; if (cc === 0) return;
            const headers = table.querySelectorAll('thead th'); const rows = table.querySelectorAll('tbody tr');
            if (headers.length === 0) return;
            const mw = new Array(cc).fill(0);
            headers.forEach((th, i) => { if (i < cc) mw[i] = Math.max(mw[i], Math.min((th.textContent||'').length * 14 + 40, 200)); });
            rows.forEach(row => { row.querySelectorAll('td').forEach((cell, i) => {
                if (i < cc) {
                    const inp = cell.querySelector('input'); let t = inp ? (inp.value||inp.placeholder||'') : (cell.textContent||'');
                    let w = 0; for (let c of t) { const cd = c.charCodeAt(0); w += cd >= 0x4e00 && cd <= 0x9fff ? 16 : (cd >= 0x30 && cd <= 0x39 ? 8 : 10); }
                    w = Math.min(Math.max(w + 30, 80), 250);
                    if (w > mw[i]) mw[i] = w;
                }
            }); });
            headers.forEach((th, i) => { if (i < cc && mw[i] > 0) { th.style.width = mw[i] + 'px'; th.style.minWidth = mw[i] + 'px'; } });
        }

        function renderColList() {
            const c = document.getElementById('colList');
            c.innerHTML = columns.map((col, idx) => `<div class="col-item p-3" draggable="true" data-index="${idx}" data-col="${col}"><div class="flex items-center justify-between"><div class="flex items-center gap-2 flex-1"><span class="drag-handle text-xl cursor-move">☰</span><span class="font-bold text-sm">${idx+1}. ${col}</span></div><div class="flex gap-1"><button onclick="moveColumnUp(${idx})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬆️</button><button onclick="moveColumnDown(${idx})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬇️</button><button onclick="deleteColumn('${col}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">删</button></div></div></div>`).join('');
            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            const items = document.querySelectorAll('.col-item');
            const isTouch = 'ontouchstart' in window;
            let draggedItem = null;
            items.forEach(item => {
                if (isTouch) { item.setAttribute('draggable', 'false'); return; }
                item.setAttribute('draggable', 'true');
                item.addEventListener('dragstart', e => { draggedItem = item; item.style.opacity = '0.5'; e.dataTransfer.effectAllowed = 'move'; });
                item.addEventListener('dragend', () => { item.style.opacity = ''; draggedItem = null; });
                item.addEventListener('dragover', e => e.preventDefault());
                item.addEventListener('drop', e => {
                    e.preventDefault(); if (!draggedItem || draggedItem === item) return;
                    const fi = parseInt(draggedItem.dataset.index); const ti = parseInt(item.dataset.index);
                    if (!isNaN(fi) && !isNaN(ti)) { const t = columns[fi]; columns[fi] = columns[ti]; columns[ti] = t; renderColList(); render(); saveData(); showToast("列顺序已更新", false); }
                });
            });
        }

        function moveColumnUp(i) { if (i > 0) { const t = columns[i]; columns[i] = columns[i-1]; columns[i-1] = t; renderColList(); render(); saveData(); showToast("列顺序已更新", false); } }
        function moveColumnDown(i) { if (i < columns.length-1) { const t = columns[i]; columns[i] = columns[i+1]; columns[i+1] = t; renderColList(); render(); saveData(); showToast("列顺序已更新", false); } }
        function openColModal() { renderColList(); document.getElementById('colModal').style.display = 'flex'; }
        function closeColModal() { document.getElementById('colModal').style.display = 'none'; render(); }
        function addColumn() { const n = document.getElementById('newColName').value.trim(); if (n && !columns.includes(n)) { columns.push(n); db.forEach(r => r[n] = ''); renderColList(); render(); saveData(); showToast(`已添加列: ${n}`, false); document.getElementById('newColName').value = ''; } else if (columns.includes(n)) showToast("列名已存在", true); }
        function deleteColumn(col) { if (confirm(`确定删除列 "${col}" 吗？数据将丢失！`)) { const i = columns.indexOf(col); if (i !== -1) { columns.splice(i, 1); db.forEach(r => delete r[col]); renderColList(); render(); saveData(); showToast(`已删除列: ${col}`, false); } } }

        // ---------- 导入导出 ----------
        document.getElementById('fileInput').onchange = function(e) {
            const file = e.target.files[0]; if (!file) return;
            showToast("正在导入...", false);
            const fr = new FileReader();
            fr.onload = function(ev) {
                try {
                    const data = new Uint8Array(ev.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
                    if (json.length > 0) {
                        columns = Object.keys(json[0]);
                        if (!columns.includes('实际数量')) columns.unshift('实际数量');
                        normalizeActualQtyColumnPosition();
                        db = json.map(row => { const r = { ...row }; if (r['实际数量'] === undefined) r['实际数量'] = ''; computePrecomputedFields(r); return r; });
                        saveData(); render(); showToast(`✅ 导入成功！共 ${db.length} 条数据`, false);
                    } else showToast("文件无数据", true);
                } catch(err) { console.error(err); showToast("解析失败", true); }
            };
            fr.onerror = function() { showToast("读取失败", true); };
            fr.readAsArrayBuffer(file);
            e.target.value = '';
        };

        function exportExcel() {
            if (!db.length) { showToast("暂无数据可导出", true); return; }
            let name = prompt("请输入导出文件名：", `飞速盘点_${new Date().toLocaleDateString()}`);
            if (!name || !name.trim()) name = `飞速盘点_${new Date().toLocaleDateString()}`;
            const exportData = db.map(row => { const r = { ...row }; delete r.__barcode_normalized; delete r.__barcode_reverse; delete r.__barcode_last6; delete r.__code_normalized; delete r.__code_reverse; delete r.__code_last6; return r; });
            const ws = XLSX.utils.json_to_sheet(exportData, { header: columns });
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "库存数据"); XLSX.writeFile(wb, name.trim() + ".xlsx"); showToast("✅ 导出成功", false);
        }

        function hardReset() { if (confirm("⚠️ 确定清空所有数据吗？此操作不可恢复！")) { localStorage.removeItem(STORAGE_KEY); db = []; columns = ['实际数量', '商品名称', '编码', '价格']; normalizeActualQtyColumnPosition(); saveData(); render(); showToast("已清空所有数据", false); } }

        // ---------- 初始化 ----------
        window.addEventListener('resize', () => setTimeout(() => autoAdjustColumns(), 100));
        window.addEventListener('beforeunload', () => { if (scanning) stopScanning(true); });
        document.addEventListener('touchstart', function(e) { if (currentInputElement && !e.target.closest('.qty-input') && !e.target.closest('#manualInput')) hideKeyboard(); });

        loadData(); render(); setupKeyboardListener(); initAuthSystem();

        const authInput = document.getElementById('authInput');
        if (authInput) authInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyAuthCode(); });

        document.getElementById('confirmBtn').onclick = () => {
            const input = document.getElementById('manualInput'); const val = input.value.trim();
            if (val === '授权码') { openAdminPanel(); input.value = ''; return; }
            if (val) { handleBarcode(val, false); input.value = ''; document.getElementById('smartIndicator').style.display = 'none'; input.placeholder = '📱 输入条码/编码/名称（支持智能识别）...'; }
            hideKeyboard();
        };

        document.getElementById('manualInput').oninput = onManualInputChange;

        document.getElementById('manualInput').onkeypress = (e) => {
            if (e.key === 'Enter') {
                const input = e.target; const val = input.value.trim();
                if (val === '授权码') { openAdminPanel(); input.value = ''; return; }
                if (val) { handleBarcode(val, false); input.value = ''; document.getElementById('smartIndicator').style.display = 'none'; input.placeholder = '📱 输入条码/编码/名称（支持智能识别）...'; }
                hideKeyboard();
            }
        };

        document.getElementById('scanBtn').onclick = () => { if (scanning) stopScanning(true); else startScanning(); hideKeyboard(); };
        document.getElementById('showKeyboardBtn').onclick = () => showKeyboard();

        const topEnhanceBtn = document.getElementById('scanEnhanceBtn');
        if (topEnhanceBtn) topEnhanceBtn.onclick = () => toggleEnhanceMode();

        console.log(`⚡ 飞速盘点 智能扫码版 ${VERSION}`);
        console.log(`📌 已加载 ${db.length} 条商品数据`);
        console.log(`🔍 智能匹配引擎就绪: normalizeCode + reverseString + last6 + 多匹配弹窗 + 全字段兜底`);
        console.log(`📷 摄像头优化: 持续自动对焦 + 快速阶梯对焦(180ms轮询) + 原生BarcodeDetector优先`);
    </script>
</body>
