<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>飞速盘点 · CSV测试 v3.3.30</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #f0f4f8; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; display: flex; align-items: center; gap: 12px; }
        .sub { color: #4a6a8a; font-size: 14px; margin-bottom: 16px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; padding: 12px 16px; background: #f8faff; border-radius: 12px; }
        .file-label { background: #1a5fb4; color: white; padding: 8px 20px; border-radius: 40px; font-weight: 500; font-size: 14px; cursor: pointer; transition: 0.15s; }
        .file-label:hover { background: #0d4a8e; }
        .file-label input { display: none; }
        .stats { display: flex; gap: 20px; font-size: 14px; color: #1f3a6b; margin-left: auto; }
        .stats span { background: white; padding: 4px 16px; border-radius: 30px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        #progressArea { background: #eef3fa; border-radius: 12px; padding: 12px 18px; margin: 8px 0 12px 0; display: none; }
        #progressArea.active { display: block; }
        .progress-track { background: #d0dae8; height: 10px; border-radius: 40px; overflow: hidden; margin-top: 4px; }
        .progress-fill { height: 100%; width: 0%; background: #1a5fb4; border-radius: 40px; transition: width 0.15s ease; }
        .progress-info { display: flex; justify-content: space-between; font-size: 13px; color: #1f3a6b; }
        .table-wrap { border: 1px solid #e2e8f0; border-radius: 12px; overflow: auto; max-height: 70vh; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { position: sticky; top: 0; background: #1e293b; color: white; padding: 10px 12px; text-align: left; font-weight: 600; white-space: nowrap; z-index: 10; }
        td { padding: 6px 10px; border-bottom: 1px solid #edf2f7; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
        tr:hover td { background: #f8fbff; }
        .empty { text-align: center; padding: 40px; color: #94a3b8; }
        .error-box { background: #fff5f5; border-left: 4px solid #dc2626; padding: 10px 16px; border-radius: 8px; margin: 8px 0; font-size: 13px; display: none; }
        .error-box.active { display: block; }
        .error-box details { cursor: pointer; }
        .error-box summary { font-weight: 600; color: #b71c1c; }
        .error-box ul { max-height: 100px; overflow-y: auto; margin: 4px 0 0 16px; color: #5f2b2b; font-size: 12px; }
        .toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 10px 24px; border-radius: 40px; z-index: 999; display: none; font-weight: bold; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); pointer-events: none; }
        .toast.show { display: block; }
        .qty-input { width: 70px; padding: 4px 6px; border: 2px solid #3b82f6; border-radius: 6px; text-align: center; font-weight: 700; }
        .price-input { width: 80px; padding: 4px 6px; border: 2px solid #10b981; border-radius: 6px; text-align: center; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
            <div>
                <h1>⚡ 飞速盘点 · CSV测试版</h1>
                <div class="sub">v3.3.30 · 不保存localStorage · 测试导入</div>
            </div>
            <div style="font-size:12px;color:#94a3b8;">如果导入失败，请按F12查看控制台错误</div>
        </div>

        <div class="toolbar">
            <label class="file-label">
                📂 选择CSV文件
                <input type="file" id="fileInput" accept=".csv" />
            </label>
            <button onclick="resetData()" style="background:#ef4444;color:white;border:none;border-radius:40px;padding:8px 20px;font-weight:500;cursor:pointer;">🗑️ 清空</button>
            <div class="stats">
                <span id="countDisplay">📊 0 条</span>
                <span id="priceDisplay">💰 0.00</span>
            </div>
        </div>

        <div id="progressArea">
            <div class="progress-info">
                <span id="progressLabel">⏳ 正在读取...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-info" style="margin-top:2px;">
                <span id="progressCount">0 / 0</span>
                <span id="progressStatus">准备中</span>
            </div>
        </div>

        <div class="error-box" id="errorBox">
            <details>
                <summary id="errorTitle">⚠️ 导入完成，部分行失败</summary>
                <ul id="errorList"></ul>
            </details>
        </div>

        <div class="table-wrap">
            <table>
                <thead id="tHead"></thead>
                <tbody id="tBody"><tr><td class="empty">请选择CSV文件导入</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var db = [];
        var columns = [];
        var isProcessing = false;
        var toastTimer = null;

        function showToast(msg, isError) {
            var toast = document.getElementById('toast');
            if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
            toast.textContent = msg;
            toast.style.background = isError ? '#dc2626' : '#10b981';
            toast.className = 'toast show';
            toastTimer = setTimeout(function() { toast.className = 'toast'; toastTimer = null; }, 3000);
        }

        function showProgress(show) {
            var el = document.getElementById('progressArea');
            if (show) el.className = 'active';
            else el.className = '';
        }

        function updateProgress(current, total, label, status) {
            var pct = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
            document.getElementById('progressPercent').textContent = Math.min(pct, 100) + '%';
            document.getElementById('progressCount').textContent = current + ' / ' + total;
            if (label) document.getElementById('progressLabel').textContent = label;
            if (status) document.getElementById('progressStatus').textContent = status;
        }

        function showErrors(errors) {
            var el = document.getElementById('errorBox');
            var list = document.getElementById('errorList');
            var title = document.getElementById('errorTitle');
            if (!errors || errors.length === 0) { el.className = 'error-box'; return; }
            el.className = 'error-box active';
            title.textContent = '⚠️ 导入完成，' + errors.length + ' 行失败';
            list.innerHTML = errors.map(function(e) { return '<li>行 ' + e.row + ': ' + (e.message || '数据异常') + '</li>'; }).join('');
        }

        function updateStats() {
            var total = db.length;
            var totalPrice = 0;
            for (var i = 0; i < db.length; i++) {
                var row = db[i];
                var qty = parseFloat(row['实际数量']) || 0;
                var price = parseFloat(row['实际价格']) || 0;
                totalPrice += qty * price;
            }
            document.getElementById('countDisplay').textContent = '📊 ' + total + ' 条';
            document.getElementById('priceDisplay').textContent = '💰 ' + totalPrice.toFixed(2);
        }

        // ==================== 提取数据 ====================
        function extractProduct(row) {
            var barcode = row['条码'] || row['barcode'] || row['Barcode'] || row['商品编码'] || row['编码'] || '';
            var name = row['名称'] || row['商品名称'] || row['name'] || row['Name'] || '';
            
            var qty = 0;
            if (row['库存数量'] !== undefined && row['库存数量'] !== '') qty = parseFloat(row['库存数量']) || 0;
            else if (row['数量'] !== undefined && row['数量'] !== '') qty = parseFloat(row['数量']) || 0;
            else if (row['库存'] !== undefined && row['库存'] !== '') qty = parseFloat(row['库存']) || 0;
            
            var price = 0;
            if (row['零售价'] !== undefined && row['零售价'] !== '') price = parseFloat(row['零售价']) || 0;
            else if (row['售价'] !== undefined && row['售价'] !== '') price = parseFloat(row['售价']) || 0;
            else if (row['价格'] !== undefined && row['价格'] !== '') price = parseFloat(row['价格']) || 0;

            if (!barcode) {
                for (var key in row) {
                    var val = String(row[key] || '').trim();
                    if (val && /^\d{8,14}$/.test(val.replace(/-/g, ''))) {
                        barcode = val;
                        break;
                    }
                }
            }
            if (!name && barcode) { name = barcode; }

            return {
                barcode: String(barcode).trim(),
                name: String(name).trim(),
                quantity: qty,
                price: price,
                valid: (barcode && barcode !== '') || (name && name !== '')
            };
        }

        // ==================== 渲染表格 ====================
        function render() {
            try {
                var thead = document.getElementById('tHead');
                var tbody = document.getElementById('tBody');
                
                if (!columns.length || db.length === 0) {
                    thead.innerHTML = '';
                    tbody.innerHTML = '<tr><td class="empty">暂无数据，请导入CSV文件</td></tr>';
                    return;
                }

                thead.innerHTML = '<tr>' + columns.map(function(col) {
                    return '<th>' + col + '</th>';
                }).join('') + '</tr>';

                tbody.innerHTML = db.map(function(row, idx) {
                    return '<tr>' + columns.map(function(col) {
                        if (col === '实际数量') {
                            return '<td><input class="qty-input" type="number" value="' + (row[col] || '') + '" onchange="updateQty(' + idx + ', this.value)" /></td>';
                        } else if (col === '实际价格') {
                            return '<td><input class="price-input" type="number" step="0.01" value="' + (row[col] || '') + '" onchange="updatePrice(' + idx + ', this.value)" /></td>';
                        } else {
                            var val = String(row[col] || '');
                            if (val.length > 50) val = val.substring(0, 50) + '...';
                            return '<td title="' + String(row[col] || '') + '">' + val + '</td>';
                        }
                    }).join('') + '</tr>';
                }).join('');

                updateStats();
            } catch(e) {
                console.error('渲染错误:', e);
            }
        }

        function updateQty(idx, val) { 
            if (db[idx]) { db[idx]['实际数量'] = val; updateStats(); } 
        }
        function updatePrice(idx, val) { 
            if (db[idx]) { db[idx]['实际价格'] = val; updateStats(); } 
        }

        // ==================== CSV导入 ====================
        function importCSV(file) {
            return new Promise(function(resolve, reject) {
                var result = {
                    rows: [],
                    errors: [],
                    total: 0,
                    valid: 0
                };

                var reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        var csvText = ev.target.result;
                        if (csvText.charCodeAt(0) === 0xFEFF) {
                            csvText = csvText.slice(1);
                        }

                        var firstRowPrinted = false;

                        Papa.parse(csvText, {
                            header: true,
                            comments: '#',
                            skipEmptyLines: true,
                            trimHeaders: true,
                            transformHeader: function(h) {
                                return h.trim();
                            },
                            worker: false,
                            step: function(results) {
                                var row = results.data;
                                if (!row || Object.keys(row).length === 0) return;

                                result.total++;

                                if (!firstRowPrinted) {
                                    firstRowPrinted = true;
                                    console.log('📋 列名:', Object.keys(row));
                                    console.log('📋 第一行:', row);
                                }

                                var product = extractProduct(row);

                                if (product.valid) {
                                    result.rows.push({
                                        barcode: product.barcode,
                                        name: product.name,
                                        quantity: product.quantity,
                                        price: product.price,
                                        original: row
                                    });
                                    result.valid++;
                                } else {
                                    result.errors.push({
                                        row: result.total,
                                        data: row,
                                        message: '缺少条码或名称'
                                    });
                                }

                                if (result.total % 100 === 0) {
                                    updateProgress(result.total, 0, '📄 解析中...', result.total + ' 行');
                                }
                            },
                            complete: function() {
                                console.log('✅ 解析完成');
                                console.log('📊 总行数:', result.total);
                                console.log('✅ 有效:', result.valid);
                                console.log('❌ 错误:', result.errors.length);
                                resolve(result);
                            },
                            error: function(err) {
                                console.error('PapaParse错误:', err);
                                reject(err);
                            }
                        });
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = function() {
                    reject(new Error('读取文件失败'));
                };
                reader.readAsText(file);
            });
        }

        // ==================== 文件导入入口 ====================
        document.getElementById('fileInput').onchange = function(e) {
            if (isProcessing) {
                showToast('⏳ 正在处理中...', false);
                return;
            }
            var file = e.target.files[0];
            if (!file) return;
            e.target.value = '';

            isProcessing = true;
            showProgress(true);
            updateProgress(0, 1, '📄 正在读取...', '准备中');

            importCSV(file).then(function(result) {
                console.log('📊 解析到 ' + result.rows.length + ' 条数据');

                if (result.rows.length === 0) {
                    showToast('⚠️ 没有有效数据行', true);
                    showProgress(false);
                    isProcessing = false;
                    return;
                }

                // 收集所有列名
                var allColumns = new Set();
                allColumns.add('实际数量');
                allColumns.add('实际价格');
                allColumns.add('条码');
                allColumns.add('名称');

                for (var i = 0; i < result.rows.length; i++) {
                    var r = result.rows[i];
                    if (r.original) {
                        for (var key in r.original) {
                            if (r.original.hasOwnProperty(key)) {
                                allColumns.add(key);
                            }
                        }
                    }
                }

                var finalCols = Array.from(allColumns);
                // 把实际数量和实际价格移到前面
                var qtyCol = '实际数量';
                var priceCol = '实际价格';
                var qtyIdx = finalCols.indexOf(qtyCol);
                if (qtyIdx > 0) { finalCols.splice(qtyIdx, 1); finalCols.unshift(qtyCol); }
                var priceIdx = finalCols.indexOf(priceCol);
                if (priceIdx > 1 && priceIdx !== -1) { finalCols.splice(priceIdx, 1); finalCols.splice(1, 0, priceCol); }

                // 转换数据
                var loadedRows = [];
                for (var i = 0; i < result.rows.length; i++) {
                    var r = result.rows[i];
                    var newRow = {};

                    if (r.original) {
                        for (var key in r.original) {
                            if (r.original.hasOwnProperty(key)) {
                                newRow[key] = r.original[key];
                            }
                        }
                    }

                    newRow['条码'] = r.barcode || '';
                    newRow['名称'] = r.name || '';
                    newRow['实际数量'] = r.quantity || 0;
                    newRow['实际价格'] = r.price || 0;

                    loadedRows.push(newRow);
                }

                columns = finalCols;
                db = loadedRows;

                console.log('✅ 最终数据条数:', db.length);
                console.log('📋 列名:', columns);
                if (db.length > 0) {
                    console.log('📦 第一条:', db[0]);
                }

                render();
                showErrors(result.errors.slice(0, 100));
                showProgress(false);

                if (db.length > 0) {
                    showToast('✅ 导入成功！共 ' + db.length + ' 条商品', false);
                    if (result.errors.length > 0) {
                        showToast('⚠️ 跳过 ' + result.errors.length + ' 行无效数据', true);
                    }
                } else {
                    showToast('⚠️ 无有效商品数据', true);
                }
                isProcessing = false;

            }).catch(function(err) {
                console.error('导入失败:', err);
                showToast('❌ 导入失败: ' + (err.message || err.toString()), true);
                showProgress(false);
                isProcessing = false;
            });
        };

        function resetData() {
            db = [];
            columns = [];
            render();
            showToast('已清空', false);
            document.getElementById('errorBox').className = 'error-box';
        }

        // 全局错误捕获
        window.onerror = function(msg, url, line, col, error) {
            console.error('全局错误:', msg, error);
            showToast('❌ 错误: ' + msg, true);
            showProgress(false);
            isProcessing = false;
            return false;
        };

        // 初始化
        render();
        console.log('⚡ 飞速盘点 v3.3.30 - CSV测试版');
        console.log('📌 请选择CSV文件导入，查看控制台日志');
    </script>
</body>
</html>
