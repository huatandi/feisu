            document.getElementById('authOverlay').style.display='none';
            try{typeof showToast==='function'&&showToast("✅ 管理员模式已激活",false)}catch(_){}
            return
        }
        var data=getAuthData(),codes=data&&data.codes?data.codes:[];
        if(!codes.length){e.style.display='block';e.textContent='❌ 系统初始化中，请稍后重试';return}
        var matched=null;
        for(var j=0;j<codes.length;j++){if(codes[j].code===c){matched=codes[j];break}}
        if(!matched){e.style.display='block';e.textContent='❌ 授权码不存在';return}
        if(matched.used&&matched.deviceId!==getDid()){e.style.display='block';e.textContent='❌ 该授权码已被其他设备使用';return}
        matched.used=true;matched.deviceId=getDid();
        data.activated=true;saveAuthData(data);
        document.getElementById('authOverlay').style.display='none';
        try{typeof showToast==='function'&&showToast("✅ 授权成功！欢迎使用飞速盘点",false)}catch(_){}
        try{typeof playBeep==='function'&&playBeep(true)}catch(_){}
    }
    var data=getAuthData();
    var authEl=document.getElementById('authOverlay');
    if(data&&data.activated){ authEl.style.display='none'; }
    else { authEl.style.display='flex'; }
    </script>

    <script>
        // ============================================================
        // 飞速盘点 · Sanfei v3.3.6
        // 智能扫码识别引擎（独立文件，不和SUPEASY关联）
        // ============================================================
        
        const VERSION = "S3.3.6";
        const STORAGE_KEY = "FEISUPANDIAN_DATA";
        
        let db = [];               // 原始数据 [{商品名称, 编码, 条码, ...}, ...]
        let columns = [];          // 列名数组
        let scanning = false;
        let reader = null;
        let lastCode = "";
        let lastTime = 0;
        let currentFocusInterval = null;
        let pendingJump = null;
        let currentInputElement = null;
        let originalViewportHeight = window.innerHeight;
        let cameraTrack = null;
        
        // 增强模式
        let enhanceMode = false;
        let consecutiveFailures = 0;
        const AUTO_ENHANCE_THRESHOLD = 3;
        let lastDecodeSucceeded = true;
        let preprocessCanvas = null;

        // ============================================================
        // 智能扫码识别引擎
        // ============================================================
        
        /**
         * 字符串标准化规则
         * 1. 转大写
         * 2. 去除空格
         * 3. 去除 -
         * 4. 去除 _
         * 5. 去除所有特殊字符（仅保留字母和数字）
         * 6. 返回标准化字符串
         */
        function normalizeCode(str) {
            if (!str) return '';
            return String(str)
                .toUpperCase()
                .replace(/\s+/g, '')    // 去除空格
                .replace(/-/g, '')       // 去除 -
                .replace(/_/g, '')       // 去除 _
                .replace(/[^A-Z0-9]/g, ''); // 去除其他所有特殊字符
        }

        /**
         * 反向字符串
         */
        function reverseString(str) {
            if (!str) return '';
            return str.split('').reverse().join('');
        }

        /**
         * 预计算字段：为数据库中的每一条商品生成优化查询字段
         * 当 db 加载完成或新增/更新商品时调用
         */
        function computePrecomputedFields(row) {
            // 确定条码字段：优先取"条码"、"编码"，其次遍历查找
            const barcodeField = '条码';
            const codeField = '编码';
            
            let barcode = String(row[barcodeField] || row[codeField] || '').trim();
            let code = String(row[codeField] || row[barcodeField] || '').trim();
            
            // 如果条码为空，尝试其他字段
            if (!barcode) {
                for (let key of Object.keys(row)) {
                    const val = String(row[key] || '').trim();
                    if (val && /^[0-9]{8,}$/.test(val)) {
                        barcode = val;
                        break;
                    }
                }
            }
            
            const barcodeNorm = normalizeCode(barcode);
            const codeNorm = normalizeCode(code);
            
            row.__barcode_normalized = barcodeNorm;
            row.__barcode_reverse = reverseString(barcodeNorm);
            row.__barcode_last6 = barcodeNorm.length >= 6 ? barcodeNorm.slice(-6) : barcodeNorm;
            row.__code_normalized = codeNorm;
            row.__code_reverse = reverseString(codeNorm);
            row.__code_last6 = codeNorm.length >= 6 ? codeNorm.slice(-6) : codeNorm;
        }

        /**
         * 为整个 db 重新生成预计算字段
         */
        function recomputeAllPrecomputedFields() {
            for (let i = 0; i < db.length; i++) {
                computePrecomputedFields(db[i]);
            }
        }

        /**
         * 智能扫码主入口
         * 按以下优先级进行匹配查询：
         * 
         * ① 精确匹配（normalized）
         * ② 反向后精确匹配
         * ③ 条码最后6位匹配
         * ④ 反向后最后6位匹配
         * ⑤ 编码contains模糊匹配（兜底）
         * 
         * @param {string} input 用户输入
         * @returns {object} { index: number, matchType: string } 或 null（未匹配）
         */
        function smartMatch(input) {
            if (!input || !db.length) return null;
            
            // Step 1: 标准化
            const normalized = normalizeCode(input);
            if (!normalized) return null;
            
            // Step 2: 生成反向
            const reversed = reverseString(normalized);
            
            // 缓存匹配结果用于去重
            const matchedIndices = new Set();
            let results = [];
            
            // ===== ① 精确匹配 (normalized) =====
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                if (row.__barcode_normalized === normalized || row.__code_normalized === normalized) {
                    if (!matchedIndices.has(i)) {
                        matchedIndices.add(i);
                        results.push({ index: i, matchType: '精确匹配', score: 1000 });
                    }
                }
            }
            if (results.length === 1) return results[0];
            if (results.length > 1) return null; // 多匹配 -> 弹窗
            
            // ===== ② 反向后精确匹配 =====
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                if (row.__barcode_reverse === reversed || row.__code_reverse === reversed) {
                    if (!matchedIndices.has(i)) {
                        matchedIndices.add(i);
                        results.push({ index: i, matchType: '反向精确匹配', score: 900 });
                    }
                }
            }
            if (results.length === 1) return results[0];
            if (results.length > 1) return null;
            
            // ===== ③ 条码最后6位匹配 =====
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                const last6 = normalized.length >= 6 ? normalized.slice(-6) : normalized;
                if (last6 && row.__barcode_last6 === last6) {
                    if (!matchedIndices.has(i)) {
                        matchedIndices.add(i);
                        results.push({ index: i, matchType: '尾6位匹配', score: 800 });
                    }
                }
            }
            // 也匹配编码的 last6
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                const last6 = normalized.length >= 6 ? normalized.slice(-6) : normalized;
                if (last6 && row.__code_last6 === last6) {
                    if (!matchedIndices.has(i)) {
                        matchedIndices.add(i);
                        results.push({ index: i, matchType: '编码尾6位匹配', score: 700 });
                    }
                }
            }
            if (results.length === 1) return results[0];
            if (results.length > 1) {
                // 多个匹配，返回 null 触发弹窗
                return null; // 外面会收集所有匹配项
            }
            
            // ===== ④ 反向后最后6位匹配 =====
            const revLast6 = reversed.length >= 6 ? reversed.slice(-6) : reversed;
            if (revLast6) {
                for (let i = 0; i < db.length; i++) {
                    const row = db[i];
                    if (row.__barcode_last6 === revLast6 || row.__code_last6 === revLast6) {
                        if (!matchedIndices.has(i)) {
                            matchedIndices.add(i);
                            results.push({ index: i, matchType: '反向尾6位匹配', score: 600 });
                        }
                    }
                }
                if (results.length === 1) return results[0];
                if (results.length > 1) return null;
            }
            
            // ===== ⑤ 编码contains模糊匹配（兜底） =====
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                if (row.__barcode_normalized.includes(normalized) || 
                    row.__code_normalized.includes(normalized) ||
                    getSearchableRowText(row).includes(normalized.toLowerCase())) {
                    if (!matchedIndices.has(i)) {
                        matchedIndices.add(i);
                        results.push({ index: i, matchType: '模糊匹配', score: 500 });
                    }
                }
            }
            if (results.length === 1) return results[0];
            
            // 多个匹配结果 -> 返回所有匹配项让调用方处理
            if (results.length > 1) {
                return { multiMatch: true, results };
            }
            
            return null;
        }

        /**
         * 智能匹配——如果多匹配则弹出选择框
         * @param {string} input 用户输入
         * @returns {number|null} 匹配到的 row index
         */
        function smartMatchWithPopup(input) {
            const result = smartMatch(input);
            
            // 单匹配
            if (result && result.multiMatch !== true && typeof result.index === 'number') {
                return result.index;
            }
            
            // 多匹配 -> 弹窗
            if (result && result.multiMatch && result.results && result.results.length > 1) {
                showMultiMatchPopup(result.results);
                return null;
            }
            
            // 无匹配
            return null;
        }

        // ---------- 多匹配弹窗 ----------
        let multiMatchCallback = null;

        function showMultiMatchPopup(matchResults) {
            const modal = document.getElementById('multiMatchModal');
            const list = document.getElementById('matchList');
            
            list.innerHTML = matchResults.map(m => {
                const row = db[m.index];
                const name = row['商品名称'] || row['名称'] || '(无名称)';
                const code = row['条码'] || row['编码'] || '';
                const qty = row['实际数量'] || 0;
                return `<div class="match-item" onclick="selectMatch(${m.index})">
                    <div>
                        <div class="name">${escapeHtml(String(name).substring(0, 30))}</div>
                        <div class="code">${escapeHtml(String(code).substring(0, 25))}</div>
                    </div>
                    <div class="qty-badge">已盘: ${qty || 0}</div>
                </div>`;
            }).join('');
            
            modal.style.display = 'flex';
        }

        function closeMultiMatchModal() {
            document.getElementById('multiMatchModal').style.display = 'none';
            multiMatchCallback = null;
        }

        function selectMatch(index) {
            closeMultiMatchModal();
            // 跳转到选中商品并聚焦数量输入框
            jumpToRowAndFocusQty(index);
            playBeep(true);
            vibrate();
            showToast(`✅ ${db[index]['商品名称'] || db[index]['名称'] || '已选择'}`, false);
        }

        // ---------- 智能输入增强辅助 ----------
        /**
         * 在 manualInput 中输入时，延时探测是否可能进行智能匹配
         */
        function onManualInputChange() {
            const input = document.getElementById('manualInput');
            const indicator = document.getElementById('smartIndicator');
            const val = (input.value || '').trim();
            
            if (val.length >= 4) {
                const result = smartMatch(val);
                if (result && result.multiMatch !== true && typeof result.index === 'number') {
                    const row = db[result.index];
                    const name = row['商品名称'] || row['名称'] || '';
                    input.placeholder = `🤖 识别: ${escapeHtml(String(name).substring(0,20))}`;
                    indicator.style.display = 'inline-block';
                } else if (result && result.multiMatch) {
                    input.placeholder = `📋 匹配到 ${result.results.length} 个商品，点击确认选择`;
                    indicator.style.display = 'inline-block';
                } else {
                    input.placeholder = '📱 输入条码/编码/名称（支持智能识别）...';
                    indicator.style.display = 'none';
                }
            } else {
                input.placeholder = '📱 输入条码/编码/名称（支持智能识别）...';
                indicator.style.display = 'none';
            }
        }

        // ---------- 兼容旧版匹配函数 ----------
        function preprocessCode(code) {
            if (!code) return code;
            let cleaned = code.replace(/[^\w\d]/g, '');
            if (cleaned.startsWith('*') && cleaned.endsWith('*')) cleaned = cleaned.slice(1, -1);
            if (cleaned.length === 12 && /^\d+$/.test(cleaned)) cleaned = '0' + cleaned;
            return cleaned;
        }

        function exactMatch(code, dbValue) {
            if (!code || !dbValue) return false;
            const codeStr = String(code).trim();
            const dbStr = String(dbValue).trim();
            if (codeStr === dbStr) return true;
            const processedCode = preprocessCode(codeStr);
            const processedDb = preprocessCode(dbStr);
            if (processedCode === processedDb) return true;
            if (codeStr.toLowerCase() === dbStr.toLowerCase()) return true;
            if (/^\d+$/.test(codeStr) && /^\d+$/.test(dbStr)) {
                const codeNum = codeStr.replace(/^0+/, '');
                const dbNum = dbStr.replace(/^0+/, '');
                if (codeNum === dbNum && codeNum.length > 0) return true;
            }
            return false;
        }

        function findBarcodeRow(code) {
            if (!code || db.length === 0) return -1;
            const codeStr = String(code).trim();
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                for (let key in row) {
                    const val = String(row[key] || '').trim();
                    if (exactMatch(codeStr, val)) return i;
                }
            }
            return -1;
        }

        function getSearchableRowText(row) {
            return Object.keys(row || {}).map(k => String(row[k] || '').trim()).join(' ').toLowerCase();
        }

        function findBestMatchRowIndex(query) {
            if (!query || !db.length) return -1;
            const token = String(query).trim();
            if (!token) return -1;
            const exact = findBarcodeRow(token);
            if (exact !== -1) return exact;
            const normalized = preprocessCode(token).toLowerCase();
            for (let i = 0; i < db.length; i++) {
                const row = db[i] || {};
                const values = Object.keys(row).map(k => String(row[k] || '').trim());
                for (const val of values) {
                    const v = val.toLowerCase();
                    const pv = preprocessCode(val).toLowerCase();
                    if ((normalized && (v.startsWith(normalized) || pv.startsWith(normalized))) || v.startsWith(token.toLowerCase())) {
                        return i;
                    }
                }
            }
            for (let i = 0; i < db.length; i++) {
                if (getSearchableRowText(db[i]).includes(token.toLowerCase())) return i;
            }
            return -1;
        }

        // ---------- UI 交互 ----------
        function jumpToRowAndFocusQty(foundIndex) {
            const rowEl = document.getElementById(`row-${foundIndex}`);
            if (rowEl) {
                document.querySelectorAll('#mainTable tbody tr').forEach(tr => tr.classList.remove('row-focus'));
                rowEl.classList.add('row-focus');
                rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const qtyInput = document.getElementById(`qty-${foundIndex}`);
                if (qtyInput) {
                    currentInputElement = qtyInput;
                    setTimeout(() => {
                        qtyInput.focus();
                        qtyInput.select();
                        qtyInput.style.transform = 'scale(1.02)';
                        qtyInput.style.borderColor = '#10b981';
                        qtyInput.style.backgroundColor = '#fef9c3';
                        const handleInputComplete = function(e) {
                            if (e.type === 'blur' || (e.type === 'keypress' && e.key === 'Enter')) {
                                hideKeyboard();
                                qtyInput.removeEventListener('blur', handleInputComplete);
                                qtyInput.removeEventListener('keypress', handleInputComplete);
                            }
                        };
                        qtyInput.addEventListener('blur', handleInputComplete);
                        qtyInput.addEventListener('keypress', handleInputComplete);
                        setTimeout(() => {
                            if (qtyInput) {
                                qtyInput.style.transform = '';
                                qtyInput.style.borderColor = '';
                                qtyInput.style.backgroundColor = '';
                            }
                        }, 500);
                    }, 300);
                }
                return true;
            }
            return false;
        }

        function stopScanningAndJump(foundIndex) {
            pendingJump = foundIndex;
            scanning = false;
            if (currentFocusInterval) { clearInterval(currentFocusInterval); currentFocusInterval = null; }
            if (reader) { try { reader.reset(); } catch(e) {} reader = null; }
            const videoEl = document.getElementById('video');
            if (videoEl && videoEl.srcObject) {
                const tracks = videoEl.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoEl.srcObject = null;
            }
            document.getElementById('scanUI').style.display = 'none';
            setTimeout(() => { jumpToRowAndFocusQty(foundIndex); pendingJump = null; }, 150);
        }

        // 核心：处理识别到的条码（使用智能匹配）
        function handleBarcode(code, fromCamera = false) {
            if (!code) return false;
            const now = Date.now();
            const codeStr = String(code).trim();
            if (codeStr === lastCode && (now - lastTime) < 200) return false;
            lastCode = codeStr;
            lastTime = now;
            
            // 使用智能匹配
            const foundIndex = smartMatchWithPopup(codeStr);
            
            if (foundIndex === null || foundIndex === undefined) {
                // 没有找到匹配，或者多匹配弹窗打开
                playBeep(false);
                showToast(`❌ 未匹配: ${codeStr.substring(0, 20)}`, true);
                vibrate();
                consecutiveFailures++;
                lastDecodeSucceeded = false;
                setTimeout(() => {
                    const manualInput = document.getElementById('manualInput');
                    if (manualInput) { manualInput.focus(); manualInput.select(); currentInputElement = manualInput; }
                }, 100);
                return false;
            }
            
            // 成功匹配
            consecutiveFailures = 0;
            lastDecodeSucceeded = true;
            playBeep(true);
            vibrate();
            const productName = db[foundIndex]['商品名称'] || db[foundIndex]['名称'] || codeStr;
            showToast(`✅ ${productName}`, false);
            const scanFrame = document.getElementById('scanFrame');
            if (scanFrame) { scanFrame.classList.add('scan-success'); setTimeout(() => scanFrame.classList.remove('scan-success'), 200); }
            if (fromCamera) stopScanningAndJump(foundIndex);
            else jumpToRowAndFocusQty(foundIndex);
            return true;
        }

        // ---------- 相机与扫码（优化对焦速度）----------
        /**
         * 优化的相机对焦策略：
         * 1. 持续自动对焦 (continuous) —— 默认开启
         * 2. 点击画面触发手动瞬间拉近对焦 + 快速回到auto
         * 3. 扫描框对准条码中心区域
         * 4. 每隔500ms自动微调对焦（针对近距离条码）
         */
        function setupCameraControls(track) {
            cameraTrack = track || null;
            const torchBtn = document.getElementById('torchBtn');
            if (!torchBtn) return;
            torchBtn.classList.remove('active');
            torchBtn.textContent = '🔦 补光';
            torchBtn.onclick = async () => {
                if (!cameraTrack || !cameraTrack.getCapabilities) { showToast('当前相机不支持补光控制', true); return; }
                const caps = cameraTrack.getCapabilities();
                if (!caps.torch) { showToast('当前设备不支持手电筒', true); return; }
                const turnOn = !torchBtn.classList.contains('active');
                try {
                    await cameraTrack.applyConstraints({ advanced: [{ torch: turnOn }] });

                    torchBtn.textContent = turnOn ? '🔦 关补光' : '🔦 补光';

        /**
         * 快速对焦：点击画面触发手动对焦 + 快速回到持续自动对焦
         * 在 300ms 内完成一次快速拉近再恢复
         */
        async function triggerFastFocus(track) {
            if (!track || !track.getCapabilities) return;
            const caps = track.getCapabilities();
            if (!caps.focusMode) return;
            
            try {
                // Step 1: 瞬间切手动对焦到近距离
                if (caps.focusMode.includes('manual')) {
                    await track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: 0.05 }] });
                }
                
                // Step 2: 快速阶梯对焦（从最近到稍远，覆盖条码常见距离）
                const distances = [0.05, 0.08, 0.12, 0.18];
                for (const d of distances) {
                    if (caps.focusMode.includes('manual')) {
                        await track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: d }] });
                    }
                    await new Promise(r => setTimeout(r, 30));
                }
                
                // Step 3: 恢复持续自动对焦
                if (caps.focusMode.includes('continuous')) {
                    await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                }
            } catch (e) {
                // fallback: 尝试直接设回 continuous
                try {
                    if (caps.focusMode.includes('continuous')) {
                        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                } catch (_) {}
            }
        }

        function applyCameraTuning(track) {
            if (!track || !track.getCapabilities) return;
            const caps = track.getCapabilities();
            const advanced = [];
            
            // 开启持续自动对焦
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
                advanced.push({ focusMode: 'continuous' });
            }
            // 开启持续自动曝光
            if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
                advanced.push({ exposureMode: 'continuous' });
            }
            // 开启持续白平衡
            if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) {
                advanced.push({ whiteBalanceMode: 'continuous' });
            }
            // 轻微曝光补偿（条码场景偏亮一点）
            if (caps.exposureCompensation) {
                const minExp = typeof caps.exposureCompensation.min === 'number' ? caps.exposureCompensation.min : -2;
                const maxExp = typeof caps.exposureCompensation.max === 'number' ? caps.exposureCompensation.max : 2;
                advanced.push({ exposureCompensation: Math.max(minExp, Math.min(maxExp, 0.5)) });
            }
            
            if (advanced.length) {
                track.applyConstraints({ advanced }).catch(() => {});
            }
        }
        
        // ---------- 图像预处理（增强扫码能力）----------
        function getFrameROI(videoEl, frameEl) {
            const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
            if (!vw || !vh) return null;
            const vr = videoEl.getBoundingClientRect();
            const fr = frameEl.getBoundingClientRect();
            const videoAspect = vw / vh;
            const boxAspect = vr.width / vr.height;
            let renderW, renderH, offsetX = 0, offsetY = 0;
            if (videoAspect > boxAspect) {
                renderH = vr.height;
                renderW = renderH * videoAspect;
                offsetX = (renderW - vr.width) / 2;
            } else {
                renderW = vr.width;
                renderH = renderW / videoAspect;
                offsetY = (renderH - vr.height) / 2;
            }
            const xInBox = fr.left - vr.left + offsetX;
            const yInBox = fr.top - vr.top + offsetY;
            const sx = vw / renderW, sy = vh / renderH;
            let roiX = Math.max(0, Math.floor(xInBox * sx));
            let roiY = Math.max(0, Math.floor(yInBox * sy));
            let roiW = Math.min(vw - roiX, Math.floor(fr.width * sx));
            let roiH = Math.min(vh - roiY, Math.floor(fr.height * sy));
            if (roiW <= 0 || roiH <= 0) return null;
            const lowerY = roiY + Math.floor(roiH * 0.55);
            const lowerH = roiH - Math.floor(roiH * 0.55);
            if (lowerH < 10) return { x: roiX, y: roiY, w: roiW, h: roiH };
            return { x: roiX, y: lowerY, w: roiW, h: lowerH };
        }

        function preprocessImageForBarcode(videoEl, roi) {
            const canvas = document.createElement('canvas');
            canvas.width = roi.w;
            canvas.height = roi.h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(videoEl, roi.x, roi.y, roi.w, roi.h, 0, 0, roi.w, roi.h);
            const imgData = ctx.getImageData(0, 0, roi.w, roi.h);
            const data = imgData.data;
            let min = 255, max = 0;
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                data[i] = data[i+1] = data[i+2] = gray;
                if (gray < min) min = gray;
                if (gray > max) max = gray;
            }
            const range = max - min;
            const threshold = min + range * 0.55;
            for (let i = 0; i < data.length; i += 4) {
                const val = data[i] > threshold ? 255 : 0;
                data[i] = data[i+1] = data[i+2] = val;
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }

        async function tryEnhancedDecode(videoEl, frameEl) {
            if (!videoEl || videoEl.readyState < 2) return null;
            const roi = getFrameROI(videoEl, frameEl);
            if (!roi) return null;
            const processedCanvas = preprocessImageForBarcode(videoEl, roi);
            if (!processedCanvas) return null;
            if ('BarcodeDetector' in window) {
                try {
                    const detector = new window.BarcodeDetector({
                        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_39', 'code_93', 'code_128', 'itf', 'codabar']
                    });
                    const codes = await detector.detect(processedCanvas);
                    if (codes && codes.length > 0) return codes[0].rawValue;
                } catch(e) {}
            }
            return null;
        }

        // 解码拦截器
        async function startScanning() {
            if (scanning) { showToast("扫描器已在运行", false); return; }
            
            // iPad 扫描框上移10%
            const isIPadDevice = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchstart' in window;
            const scanFrame = document.getElementById('scanFrame');
            if (scanFrame) {
                scanFrame.style.top = isIPadDevice ? '15%' : '25%';
            }
            
            const scanUI = document.getElementById('scanUI');
            scanUI.style.display = 'flex';
            scanning = true;
            if (reader) { try { await reader.reset(); } catch(e) {} reader = null; }
            
            const badge = document.getElementById('enhanceBadge');
            if (enhanceMode) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
            
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    }
                };
                
                const hints = new Map();
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                hints.set(ZXing.DecodeHintType.CHARACTER_SET, "UTF-8");
                hints.set(ZXing.DecodeHintType.ALLOWED_LENGTHS, null);
                hints.set(ZXing.DecodeHintType.RETURN_CODABAR_START_END, true);
                hints.set(ZXing.DecodeHintType.ALSO_INVERTED, true);
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
                    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR,
                    ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.PDF_417, ZXing.BarcodeFormat.QR_CODE
                ]);
                
                reader = new ZXing.BrowserMultiFormatReader(hints);
                reader.timeBetweenDecodingAttempts = 15; // 更快的解码间隔
                
                const videoEl = document.getElementById('video');
                const frameEl = document.getElementById('scanFrame');
                
                await reader.decodeFromConstraints(constraints, 'video', async (result, err) => {
                    if (!scanning) return;
                    if (result) {
                        const code = result.getText();
                        if (code) {
                            handleBarcode(code, true);
                            consecutiveFailures = 0;
                            lastDecodeSucceeded = true;
                            return;
                        }
                    }
                    consecutiveFailures++;
                    lastDecodeSucceeded = false;
                    if (enhanceMode || consecutiveFailures >= AUTO_ENHANCE_THRESHOLD) {
                        const enhancedCode = await tryEnhancedDecode(videoEl, frameEl);
                        if (enhancedCode) {
                            handleBarcode(enhancedCode, true);
                            consecutiveFailures = 0;
                            vibrate();
                        }
                    }
                });
                
                showToast("极速扫码引擎已启动" + (enhanceMode ? " (增强模式)" : ""), false);
                
                // 摄像头设置延迟（等待轨道可用）
                setTimeout(() => {
                    const track = videoEl?.srcObject?.getVideoTracks?.()[0];
                    if (track) {
                        setupCameraControls(track);
                        applyCameraTuning(track);
                        // 首次快速对焦
                        triggerFastFocus(track);
                    }
                }, 300);
                
                // 优化的对焦循环 —— 更快、更稳定
                currentFocusInterval = setInterval(() => {
                    if (!scanning) { clearInterval(currentFocusInterval); return; }
                    if (videoEl && videoEl.srcObject) {
                        const track = videoEl.srcObject.getVideoTracks()[0];
                        if (track && track.getCapabilities) {
                            const caps = track.getCapabilities();
                            // 前3次快速手动对焦扫描，然后切回持续自动对焦
                            const cycleStep = (Math.floor(Date.now() / 180)) % 8;
                            if (cycleStep < 4 && caps.focusMode && caps.focusMode.includes('manual')) {
                                const dist = [0.04, 0.07, 0.10, 0.15][cycleStep];
                                track.applyConstraints({ 
                                    advanced: [{ focusMode: 'manual', focusDistance: dist }] 
                                }).catch(() => {});
                            } else {
                                // 恢复持续自动对焦
                                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                                    track.applyConstraints({ 
                                        advanced: [{ focusMode: 'continuous' }] 
                                    }).catch(() => {});
                                }
                                // 确保曝光和白平衡也是持续的
                                if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
                                    track.applyConstraints({ 
                                        advanced: [{ exposureMode: 'continuous' }] 
                                    }).catch(() => {});
                                }
                            }
                        }
                    }
                }, 180); // 更快的对焦轮询（200ms -> 180ms）
                
                // 点击视频画面——触发快速手动对焦（针对条码近距离）
                videoEl.addEventListener('click', async () => {
                    if (!scanning) return;
                    const track = videoEl?.srcObject?.getVideoTracks?.()[0];
                    if (track) {
                        await triggerFastFocus(track);
                        showToast("🎯 快速对焦完成", false);
                    }
                }, { once: false });
                
            } catch(err) {
                console.error("相机错误:", err);
                showToast("无法启动摄像头，请检查权限", true);
                stopScanning(true);
            }
        }

        function stopScanning(manual = false) {
            scanning = false;
            if (currentFocusInterval) { clearInterval(currentFocusInterval); currentFocusInterval = null; }
            if (reader) { try { reader.reset(); } catch(e) {} reader = null; }
            const videoEl = document.getElementById('video');
            if (videoEl && videoEl.srcObject) {
                const tracks = videoEl.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoEl.srcObject = null;
            }
            document.getElementById('scanUI').style.display = 'none';
            cameraTrack = null;
            consecutiveFailures = 0;
        }

        // ---------- 键盘处理 ----------
        function setupKeyboardListener() {
            if (!(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent))) return;
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    const currentHeight = window.visualViewport.height;
                    const keyboardHeight = originalViewportHeight - currentHeight;
                    if (keyboardHeight > 150) document.body.classList.add('keyboard-open');
                    else {
                        document.body.classList.remove('keyboard-open');
                        setTimeout(() => {
                            if (pendingJump !== null) {
                                const rowEl = document.getElementById(`row-${pendingJump}`);
                                if (rowEl) rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }, 100);
                    }
                });
            }
            window.addEventListener('resize', () => {
                const currentHeight = window.innerHeight;
                const keyboardHeight = originalViewportHeight - currentHeight;
                if (keyboardHeight > 150) document.body.classList.add('keyboard-open');
                else document.body.classList.remove('keyboard-open');
            });
        }

        function showKeyboard() {
            if (currentInputElement && document.activeElement !== currentInputElement) {
                currentInputElement.focus();
                currentInputElement.select();
            } else {
                const manualInput = document.getElementById('manualInput');
                if (manualInput) {
                    manualInput.focus();
                    manualInput.select();
                    currentInputElement = manualInput;
                }
            }
        }

        function hideKeyboard() {
            if (currentInputElement) {
                currentInputElement.blur();
                currentInputElement = null;
            }
            document.activeElement?.blur();
            document.body.classList.remove('keyboard-open');
        }

        // ---------- 数据存储 ----------
        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    db = data.db || [];
                    columns = data.columns || [];
                }
                if (!columns.length) {
                    columns = ['实际数量', '商品名称', '编码', '价格'];
                    db = [];
                }
                normalizeActualQtyColumnPosition();
                db.forEach(row => {
                    if (row['实际数量'] === undefined) row['实际数量'] = '';
                });
                // 重新生成预计算字段
                recomputeAllPrecomputedFields();
            } catch(e) {
                console.error(e);
                columns = ['实际数量', '商品名称', '编码', '价格'];
                normalizeActualQtyColumnPosition();
                db = [];
            }
        }

        function normalizeActualQtyColumnPosition() {
            if (!Array.isArray(columns) || !columns.length) return;
            const qtyCol = '实际数量';
            const qtyIndex = columns.indexOf(qtyCol);
            if (qtyIndex === -1) return;
            columns.splice(qtyIndex, 1);
            const targetIndex = 4;
            columns.splice(Math.min(targetIndex, columns.length), 0, qtyCol);
        }

        function saveData() {
            try {
                // 保存前重新生成预计算字段
                recomputeAllPrecomputedFields();
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ db, columns, version: VERSION }));
            } catch(e) { showToast("存储空间不足", true); }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = isError ? '#dc2626' : '#10b981';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 1500);
        }

        function playBeep(success) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = success ? 1200 : 400;
                gainNode.gain.value = 0.6;
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                oscillator.stop(audioCtx.currentTime + 0.2);
                audioCtx.resume();
            } catch(e) {}
        }

            document.getElementById('adminPanel').style.display = 'flex';
        }

        function closeAdminPanel() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        function renderAdminCodeList() {
            const container = document.getElementById('adminCodeList');
            if (!container) return;
            const total = authCodes.length;
            const usedCount = authCodes.filter(a => a.used).length;
            const unused = authCodes.filter(a => !a.used);
            container.innerHTML = `
                <div style="text-align:center;font-size:14px;color:#334155;margin-bottom:12px;font-weight:bold;">已用 ${usedCount} / 总计 ${total}</div>
                ${unused.length ? unused.map(a => `
                    <div class="admin-code-item">
                        <span style="font-size:16px;letter-spacing:2px;">${a.code}</span>
                        <span class="status-badge">未使用</span>
                    </div>
                `).join('') : '<div style="text-align:center;color:#94a3b8;padding:20px;font-size:14px;">⚠️ 所有授权码已用完，请追加</div>'}
            `;
        }

        function generateNewCodes() {
            const fallbackCodes = ["000WENXI","11W1ENXI","22WE2NXI","33WEN3XI","44WENX4I","55WENXI5","6W66ENXI","7W7E7NXI","8W8EN8XI","9W9ENX9I","0W0ENXI0","1WE11NXI","2WE2N2XI","3WE3NX3I","4WE4NXI4","5WEN55XI","6WEN6X6I","7WEN7XI7","8WENX88I","9WENX9I9","0WENXI00","W111ENXI","W22E2NXI","W33EN3XI","W44ENX4I","W55ENXI5","W6E66NXI","W7E7N7XI","W8E8NX8I","W9E9NXI9","W0EN00XI","W1EN1X1I","W2EN2XI2","W3ENX33I","W4ENX4I4","W5ENXI55","WE666NXI","WE77N7XI","WE88NX8I","WE99NXI9","WE0N00XI","WE1N1X1I","WE2N2XI2","WE3NX33I","WE4NX4I4","WE5NXI55","WEN666XI","WEN77X7I","WEN88XI8","WEN9X99I"];
            let added = 0;
            const existingSet = new Set(authCodes.map(a => a.code));
            for (let code of fallbackCodes) {
                if (added >= 10) break;
                if (!existingSet.has(code)) {
                    existingSet.add(code);
                    authCodes.push({ code, used: false, deviceId: '' });
                    added++;
                }
            }
            saveAuthState();
            renderAdminCodeList();
            showToast(`✅ 已追加 ${added} 个新授权码`, false);
        }

        // ---------- 表格渲染 ----------
        function render() {
            const thead = document.getElementById('tHead');
            const tbody = document.getElementById('tBody');
            if (!columns.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center p-6 text-gray-500">暂无数据，请导入Excel或添加列表</td></tr>';
                return;
            }
            thead.innerHTML = `<tr>${columns.map(col => `<th>${col}</th>`).join('')}</tr>`;
            tbody.innerHTML = db.map((row, idx) => `
                <tr id="row-${idx}">
                    ${columns.map(col => `
                        <td>
                            ${col === '实际数量' ? 
                                `<input id="qty-${idx}" type="number" value="${row[col] || ''}" 
                                    class="qty-input" onchange="updateQty(${idx}, this.value)"
                                    onfocus="this.select()" placeholder="0" inputmode="numeric" />` :
                                `<input type="text" value="${escapeHtml(String(row[col] || ''))}" 
                                    class="w-full p-2 text-sm outline-none bg-transparent"
                                    style="min-width:80px; width:100%;"
                                    onchange="updateCell(${idx}, '${col}', this.value)" />`
                            }
                        </td>
                    `).join('')}
                </tr>
            `).join('');
            setTimeout(() => autoAdjustColumns(), 50);
            if (pendingJump !== null) setTimeout(() => { jumpToRowAndFocusQty(pendingJump); pendingJump = null; }, 100);
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        
        function updateQty(rowIndex, value) { 
            db[rowIndex]['实际数量'] = value; 
            saveData(); 
            showToast("已保存", false); 
            hideKeyboard(); 
        }
        function updateCell(rowIndex, col, value) { 
            db[rowIndex][col] = value; 
            // 如果修改了条码或编码，重新生成预计算字段
            computePrecomputedFields(db[rowIndex]);
            saveData(); 
        }
        
        function autoAdjustColumns() {
            const table = document.getElementById('mainTable');
            if (!table) return;
            const colCount = columns.length;
            if (colCount === 0) return;
            const headers = table.querySelectorAll('thead th');
            const rows = table.querySelectorAll('tbody tr');
            if (headers.length === 0) return;
            const colMaxWidths = new Array(colCount).fill(0);
            headers.forEach((th, idx) => {
                if (idx < colCount) {
                    let headerWidth = (th.textContent || '').length * 14 + 40;
                    colMaxWidths[idx] = Math.max(colMaxWidths[idx], Math.min(headerWidth, 200));
                }
            });
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                cells.forEach((cell, idx) => {
                    if (idx < colCount) {
                        const input = cell.querySelector('input');
                        let text = input ? (input.value || input.placeholder || '') : (cell.textContent || '');
                        let textWidth = 0;
                        for (let i = 0; i < text.length; i++) {
                            const code = text.charCodeAt(i);
                            if (code >= 0x4e00 && code <= 0x9fff) textWidth += 16;
                            else if (code >= 0x30 && code <= 0x39) textWidth += 8;
                            else textWidth += 10;
                        }
                        textWidth = Math.max(textWidth + 30, 80);
                        textWidth = Math.min(textWidth, 250);
                        if (textWidth > colMaxWidths[idx]) colMaxWidths[idx] = textWidth;
                    }
                });
            });
            headers.forEach((th, idx) => {
                if (idx < colCount && colMaxWidths[idx] > 0) {
                    th.style.width = colMaxWidths[idx] + 'px';
                    th.style.minWidth = colMaxWidths[idx] + 'px';
                }
            });
        }

        function renderColList() {
            const container = document.getElementById('colList');
            container.innerHTML = columns.map((col, idx) => `
                <div class="col-item p-3" draggable="true" data-index="${idx}" data-col="${col}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 flex-1">
                            <span class="drag-handle text-xl cursor-move">☰</span>
                            <span class="font-bold text-sm">${idx + 1}. ${col}</span>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="moveColumnUp(${idx})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬆️</button>
                            <button onclick="moveColumnDown(${idx})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬇️</button>
                            <button onclick="deleteColumn('${col}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">删</button>
                        </div>
                    </div>
                </div>
            `).join('');
            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            const items = document.querySelectorAll('.col-item');
            const isTouch = 'ontouchstart' in window;
            let draggedItem = null;
            items.forEach(item => {
                if (isTouch) { item.setAttribute('draggable', 'false'); return; }
                item.setAttribute('draggable', 'true');
                item.addEventListener('dragstart', (e) => { draggedItem = item; item.style.opacity = '0.5'; e.dataTransfer.effectAllowed = 'move'; });
                item.addEventListener('dragend', (e) => { item.style.opacity = ''; draggedItem = null; });
                item.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (!draggedItem || draggedItem === item) return;
                    const fromIndex = parseInt(draggedItem.getAttribute('data-index'));
                    const toIndex = parseInt(item.getAttribute('data-index'));
                    if (!isNaN(fromIndex) && !isNaN(toIndex)) {
                        const temp = columns[fromIndex]; columns[fromIndex] = columns[toIndex]; columns[toIndex] = temp;
                        renderColList(); render(); saveData(); showToast("列顺序已更新", false);
                    }
                });
            });
        }

        function moveColumnUp(index) { if (index > 0) { const temp = columns[index]; columns[index] = columns[index-1]; columns[index-1] = temp; renderColList(); render(); saveData(); showToast("列顺序已更新", false); } }
        function moveColumnDown(index) { if (index < columns.length-1) { const temp = columns[index]; columns[index] = columns[index+1]; columns[index+1] = temp; renderColList(); render(); saveData(); showToast("列顺序已更新", false); } }
        function openColModal() { renderColList(); document.getElementById('colModal').style.display = 'flex'; }
        function closeColModal() { document.getElementById('colModal').style.display = 'none'; render(); }
        function addColumn() { const newCol = document.getElementById('newColName').value.trim(); if (newCol && !columns.includes(newCol)) { columns.push(newCol); db.forEach(row => row[newCol] = ''); renderColList(); render(); saveData(); showToast(`已添加列: ${newCol}`, false); document.getElementById('newColName').value = ''; } else if (columns.includes(newCol)) showToast("列名已存在", true); }
        function deleteColumn(colName) { if (confirm(`确定删除列 "${colName}" 吗？数据将丢失！`)) { const index = columns.indexOf(colName); if (index !== -1) { columns.splice(index, 1); db.forEach(row => delete row[colName]); renderColList(); render(); saveData(); showToast(`已删除列: ${colName}`, false); } } }

        // ---------- 导入导出 ----------
        document.getElementById('fileInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            showToast("正在导入...", false);
            const fileReader = new FileReader();
            fileReader.onload = function(ev) {
                try {
                    const data = new Uint8Array(ev.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                    if (json.length > 0) {
                        columns = Object.keys(json[0]);
                        if (!columns.includes('实际数量')) columns.unshift('实际数量');
                        normalizeActualQtyColumnPosition();
                        db = json.map(row => { 
                            const newRow = { ...row }; 
                            if (newRow['实际数量'] === undefined) newRow['实际数量'] = ''; 
                            computePrecomputedFields(newRow);
                            return newRow; 
                        });
                        saveData(); render(); showToast(`✅ 导入成功！共 ${db.length} 条数据`, false);
                    } else showToast("文件无数据", true);
                } catch(err) { console.error(err); showToast("解析失败", true); }
            };
            fileReader.onerror = function() { showToast("读取失败", true); };
            fileReader.readAsArrayBuffer(file);
            e.target.value = '';
        };

        function exportExcel() {
            if (!db.length) { showToast("暂无数据可导出", true); return; }
            const defaultName = `飞速盘点_${new Date().toLocaleDateString()}`;
            let name = prompt("请输入导出文件名：", defaultName);
            if (!name || !name.trim()) name = defaultName;
            // 导出时移除预计算字段
            const exportData = db.map(row => {
                const cleanRow = { ...row };
                delete cleanRow.__barcode_normalized;
                delete cleanRow.__barcode_reverse;
                delete cleanRow.__barcode_last6;
                delete cleanRow.__code_normalized;
                delete cleanRow.__code_reverse;
                delete cleanRow.__code_last6;
                return cleanRow;
            });
            const ws = XLSX.utils.json_to_sheet(exportData, { header: columns });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "库存数据");
            XLSX.writeFile(wb, name.trim() + ".xlsx");
            showToast("✅ 导出成功", false);
        }
        function hardReset() { 
            if (confirm("⚠️ 确定清空所有数据吗？此操作不可恢复！")) { 
                localStorage.removeItem(STORAGE_KEY); 
                db = []; 
                columns = ['实际数量', '商品名称', '编码', '价格']; 
                normalizeActualQtyColumnPosition(); 
                saveData(); render(); showToast("已清空所有数据", false); 
            } 
        }

        // ---------- 初始化事件 ----------
        window.addEventListener('resize', () => setTimeout(() => autoAdjustColumns(), 100));
        window.addEventListener('beforeunload', () => { if (scanning) stopScanning(true); });
        document.addEventListener('touchstart', function(e) { if (currentInputElement && !e.target.closest('.qty-input') && !e.target.closest('#manualInput')) hideKeyboard(); });
        
        loadData(); render(); setupKeyboardListener();
        initAuthSystem();
        
        // 授权输入框回车提交
        const authInput = document.getElementById('authInput');
        if (authInput) authInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyAuthCode(); });

        // 确认按钮 + 智能匹配
        document.getElementById('confirmBtn').onclick = () => { 
            const input = document.getElementById('manualInput'); 
            const val = input.value.trim(); 
            if (val === '授权码') { openAdminPanel(); input.value = ''; return; } 
            if (val) { 
                handleBarcode(val, false); 
                input.value = ''; 
                // 清除智能提示
                document.getElementById('smartIndicator').style.display = 'none';
                input.placeholder = '📱 输入条码/编码/名称（支持智能识别）...';
            } 
            hideKeyboard(); 
        };
        
        // 输入框实时智能探测
        document.getElementById('manualInput').oninput = function(e) {
            onManualInputChange();
        };
        
        document.getElementById('manualInput').onkeypress = (e) => { 
            if (e.key === 'Enter') { 
                const input = e.target; 
                const val = input.value.trim(); 
                if (val === '授权码') { openAdminPanel(); input.value = ''; return; } 
                if (val) { 
                    handleBarcode(val, false); 
                    input.value = ''; 
                    document.getElementById('smartIndicator').style.display = 'none';
                    input.placeholder = '📱 输入条码/编码/名称（支持智能识别）...';
                } 
                hideKeyboard(); 
            } 
        };
        
        document.getElementById('scanBtn').onclick = () => { if (scanning) stopScanning(true); else startScanning(); hideKeyboard(); };
        document.getElementById('showKeyboardBtn').onclick = () => showKeyboard();
        
        // 绑定顶部增强按钮
        const topEnhanceBtn = document.getElementById('scanEnhanceBtn');
        if (topEnhanceBtn) topEnhanceBtn.onclick = () => toggleEnhanceMode();

        console.log(`⚡ 飞速盘点 智能扫码版 ${VERSION}`);
        console.log(`📌 已加载 ${db.length} 条商品数据`);
        console.log(`🔍 智能匹配引擎就绪: normalizeCode + reverseString + last6 + 多匹配弹窗`);
        console.log(`📷 摄像头优化: 持续自动对焦 + 快速阶梯对焦(180ms轮询)`);
    </script>
</body>
