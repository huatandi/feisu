function normalizeCode(str) {
    if (!str) return '';
    return String(str).toUpperCase().replace(/\s+/g,'').replace(/-/g,'').replace(/_/g,'').replace(/[^A-Z0-9]/g,'');
}

function reverseString(str) {
    if (!str) return '';
    return str.split('').reverse().join('');
}

/** 智能列检测（支持中/英/西班牙语混合列名） */
function detectBarcodeAndCodeColumns(row) {
    const bk = ['条码','barcode','ean','upc','商品编号','产品编号','货号','sku','codigo','código','product code','item','ref','referencia'];
    const ck = ['编码','code','编号','商品编码','产品编码','型号','modelo','codigo','código','producto','item code','part','partnumber','零件号','料号','规格','spec'];
    const sk = ['名称','name','descripcion','desc','备注','说明'];
    let sb = [], sc = [];
    for (let key of Object.keys(row)) {
        const kl = key.toLowerCase().trim();
        const val = String(row[key]||'').trim();
        if (!val) continue;
        // 跳过内部预计算字段
        if (key.startsWith('__')) continue;
        let skip = false;
        for (let s of sk) { if (kl.includes(s)) { skip = true; break; } }
        if (skip) continue;
        for (let k of bk) { if (kl.includes(k)) { sb.push({key,val,score:10}); break; } }
        for (let k of ck) { if (kl.includes(k)) { sc.push({key,val,score:10}); break; } }
        if (kl.includes('名称')||kl.includes('name')) continue;
        if (/^\d{8,}$/.test(val)) sb.push({key,val,score:5});
        else if (/[A-Za-z]/.test(val)&&/\d/.test(val)) sc.push({key,val,score:5});
    }
    const b = sb.sort((a,b)=>b.score-a.score)[0];
    const c = sc.sort((a,b)=>b.score-a.score)[0];
    if (b&&c&&b.key===c.key) return {barcodeKey:b.key,codeKey:null};
    return {barcodeKey:b?b.key:null,codeKey:c?c.key:null};
}

/** 预计算字段 */
function computePrecomputedFields(row) {
    const {barcodeKey,codeKey} = detectBarcodeAndCodeColumns(row);
    let barcode = barcodeKey ? String(row[barcodeKey]||'').trim() : '';
    let code = codeKey ? String(row[codeKey]||'').trim() : '';
    if (!barcode) {
        for (let key of Object.keys(row)) {
            const val = String(row[key]||'').trim();
            if (val&&/^\d{8,}$/.test(val)) { barcode = val; break; }
        }
    }
    if (!barcode) {
        for (let key of Object.keys(row)) {
            if (key.startsWith('__')) continue;
            const val = String(row[key]||'').trim();
            if (!val) continue;
            const kl = key.toLowerCase();
            if (kl.includes('名称')||kl.includes('name')||kl.includes('descripcion')||kl.includes('desc')||
                kl.includes('备注')||kl.includes('说明')||kl.includes('cantidad')||kl.includes('precio')||
                kl.includes('price')||kl.includes('数量')||kl.includes('折扣')||kl.includes('descuento')||
                kl.includes('total')||kl.includes('precio')) continue;
            if (val.length>=3) { barcode = val; break; }
        }
    }
    if (!code&&barcode) code = barcode;
    const bn = normalizeCode(barcode||'');
    const cn = normalizeCode(code||'');
    row.__bn = bn; row.__br = reverseString(bn);
    row.__b6 = bn.length>=6?bn.slice(-6):bn;
    row.__cn = cn; row.__cr = reverseString(cn);
    row.__c6 = cn.length>=6?cn.slice(-6):cn;
}

function recomputeAll() { for (let i=0;i<db.length;i++) computePrecomputedFields(db[i]); }

/** 
 * 完全重写的智能匹配引擎 v2
 * 支持：精确/反向/尾6位/反向尾6位/子串包含/去头去尾/全字段兜底/片段匹配
 */
function smartMatch(input) {
    if (!input||!db.length) return null;
    const normalized = normalizeCode(input);
    if (!normalized) return null;
    const reversed = reverseString(normalized);
    
    let matched = new Set();
    let results = [];

    // 辅助函数
    const addMatch = (idx,type,score) => {
        if (!matched.has(idx)) { matched.add(idx); results.push({index:idx,matchType:type,score}); }
    };

    // ① 精确匹配（normalized）
    for (let i=0;i<db.length;i++) {
        const r=db[i];
        if (r.__bn===normalized||r.__cn===normalized) addMatch(i,'精确匹配',1000);
    }
    if (results.length===1) return results[0];
    if (results.length>1) return {multiMatch:true,results};

    // ② 反向精确匹配
    for (let i=0;i<db.length;i++) {
        const r=db[i];
        if (r.__br===normalized||r.__cr===normalized) addMatch(i,'反向精确匹配',900);
    }
    if (results.length===1) return results[0];
    if (results.length>1) return {multiMatch:true,results};

    // ③ 尾6位匹配
    const l6 = normalized.length>=6?normalized.slice(-6):normalized;
    for (let i=0;i<db.length;i++) {
        const r=db[i];
        if (l6&&r.__b6===l6) addMatch(i,'尾6位匹配',800);
    }
    for (let i=0;i<db.length;i++) {
        const r=db[i];
        if (l6&&r.__c6===l6) addMatch(i,'编码尾6位匹配',700);
    }
    if (results.length===1) return results[0];
    if (results.length>1) return {multiMatch:true,results};

    // ④ 反向尾6位匹配：用户先把条码反向，再只输入后6位
    // 判断：normalized === __br.slice(-6) (反向条码的后6位)
    for (let i=0;i<db.length;i++) {
        const r=db[i];
        const revLast6 = r.__br && r.__br.length>=6 ? r.__br.slice(-6) : null;
        if (revLast6 && revLast6===normalized) { addMatch(i,'反向尾6位匹配',600); continue; }
        const revLastC6 = r.__cr && r.__cr.length>=6 ? r.__cr.slice(-6) : null;
        if (revLastC6 && revLastC6===normalized) { addMatch(i,'编码反向尾6位匹配',560); }
    }
    if (results.length===1) return results[0];
    if (results.length>1) return {multiMatch:true,results};

    // ⑤ contains模糊匹配（预计算字段）
    for (let i=0;i<db.length;i++) {
        const r=db[i];
        if ((r.__bn&&r.__bn.includes(normalized))||(r.__cn&&r.__cn.includes(normalized))||
            getSearchableRowText(r).includes(normalized.toLowerCase())) addMatch(i,'模糊匹配',500);
    }
    if (results.length===1) return results[0];
    if (results.length>1) return {multiMatch:true,results};

    // ⑥ 全字段兜底（遍历每一行的每一个字段，做各种柔性匹配）
    for (let i=0;i<db.length;i++) {
        const row = db[i];
        for (let key of Object.keys(row)) {
            if (key.startsWith('__')) continue;
            const cellVal = String(row[key]||'').trim();
            if (!cellVal) continue;
            const cellNorm = normalizeCode(cellVal);
            
            // 6a: 标准化后精确
            if (cellNorm===normalized) { addMatch(i,'全字段精确',450); break; }
            // 6b: 标准化后包含
            if (cellNorm.includes(normalized)||normalized.includes(cellNorm)) { addMatch(i,'全字段包含',400); break; }
            // 6c: 原始值包含输入
            if (input.length>=3&&cellVal.toLowerCase().includes(input.toLowerCase())) { addMatch(i,'全字段原始包含',350); break; }
            // 6d: 子串匹配（输入是单元格值的子串）
            if (normalized.length>=4&&cellNorm.includes(normalized)) { addMatch(i,'子串匹配',300); break; }
            // 6e: 去校验位匹配（EAN-13去掉最后1位）
            if (/^\d{13}$/.test(cellNorm)&&/^\d{12}$/.test(normalized)&&cellNorm.startsWith(normalized)) { addMatch(i,'去校验位匹配',280); break; }
            // 6f: 去头字符匹配（去掉1-2个前缀字符）
            if (normalized.length>=3) {
                for (let trim=1;trim<=2;trim++) {
                    if (cellNorm.length>trim&&cellNorm.slice(trim)===normalized) { addMatch(i,'去前缀匹配',260); break; }
                }
            }
            if (normalized.length>=3) {
                for (let trim=1;trim<=2;trim++) {
                    if (cellNorm.length>trim&&cellNorm.slice(0,-trim)===normalized) { addMatch(i,'去后缀匹配',260); break; }
                }
            }
        }
    }
    if (results.length===1) return results[0];
    if (results.length>1) return {multiMatch:true,results};

    return null;
}

function smartMatchWithPopup(input) {
    const result = smartMatch(input);
    if (result&&result.multiMatch!==true&&typeof result.index==='number') return result.index;
    if (result&&result.multiMatch&&result.results&&result.results.length>1) {
        showMultiMatchPopup(result.results);
        return null;

    return null;
}

        } else if (r&&r.multiMatch) { input.placeholder=`📋 匹配到 ${r.results.length} 个商品，点击确认选择`; ind.style.display='inline-block'; }
        else { input.placeholder='📱 输入条码/编码/名称（支持智能识别）...'; ind.style.display='none'; }
    } else { input.placeholder='📱 输入条码/编码/名称（支持智能识别）...'; ind.style.display='none'; }

// ---------- 兼容旧版 ----------
function preprocessCode(c) { if (!c) return c; let s=c.replace(/[^\w\d]/g,''); if (s.startsWith('*')&&s.endsWith('*')) s=s.slice(1,-1); if (s.length===12&&/^\d+$/.test(s)) s='0'+s; return s; }
function exactMatch(c,dv) { if (!c||!dv) return false; const cs=String(c).trim(),ds=String(dv).trim(); if (cs===ds) return true; if (preprocessCode(cs)===preprocessCode(ds)) return true; if (cs.toLowerCase()===ds.toLowerCase()) return true; if (/^\d+$/.test(cs)&&/^\d+$/.test(ds)) { const cn=cs.replace(/^0+/,''),dn=ds.replace(/^0+/,''); if (cn===dn&&cn.length>0) return true; } return false; }
function findBarcodeRow(c) { if (!c||!db.length) return -1; const cs=String(c).trim(); for (let i=0;i<db.length;i++) { const r=db[i]; for (let k in r) { if (k.startsWith('__')) continue; if (exactMatch(cs,String(r[k]||'').trim())) return i; } } return -1; }
function getSearchableRowText(r) { return Object.keys(r).filter(k=>!k.startsWith('__')).map(k=>String(r[k]||'').trim()).join(' ').toLowerCase(); }
function findBestMatchRowIndex(q) { if (!q||!db.length) return -1; const t=String(q).trim(); if (!t) return -1; const ex=findBarcodeRow(t); if (ex!==-1) return ex; const n=preprocessCode(t).toLowerCase(); for (let i=0;i<db.length;i++) { const r=db[i]||{},vals=Object.keys(r).filter(k=>!k.startsWith('__')).map(k=>String(r[k]||'').trim()); for (const v of vals) { const vl=v.toLowerCase(); if ((n&&(vl.startsWith(n)||preprocessCode(v).toLowerCase().startsWith(n)))||vl.startsWith(t.toLowerCase())) return i; } } for (let i=0;i<db.length;i++) { if (getSearchableRowText(db[i]).includes(t.toLowerCase())) return i; } return -1; }

// ---------- UI ----------
function jumpToRowAndFocusQty(idx) {
    const el=document.getElementById(`row-${idx}`);
    if (el) {
        document.querySelectorAll('#mainTable tbody tr').forEach(t=>t.classList.remove('row-focus'));
        el.classList.add('row-focus'); el.scrollIntoView({behavior:'smooth',block:'center'});
        const qi=document.getElementById(`qty-${idx}`);
        if (qi) {
            currentInputElement=qi;
            setTimeout(()=>{
                qi.focus(); qi.select();
                qi.style.transform='scale(1.02)'; qi.style.borderColor='#10b981'; qi.style.backgroundColor='#fef9c3';
                const h=function(e){if(e.type==='blur'||(e.type==='keypress'&&e.key==='Enter')){hideKeyboard();qi.removeEventListener('blur',h);qi.removeEventListener('keypress',h);}};
                qi.addEventListener('blur',h); qi.addEventListener('keypress',h);
                setTimeout(()=>{if(qi){qi.style.transform='';qi.style.borderColor='';qi.style.backgroundColor='';}},500);
            },300);
        }
        return true;
    }
    return false;
}

function stopScanningAndJump(idx) {
    pendingJump=idx; scanning=false;
    if (currentFocusInterval) {clearInterval(currentFocusInterval);currentFocusInterval=null;}
    if (reader) {try{reader.reset()}catch(e){}reader=null;}
    const ve=document.getElementById('video');
    if (ve&&ve.srcObject) {ve.srcObject.getTracks().forEach(t=>t.stop());ve.srcObject=null;}
    document.getElementById('scanUI').style.display='none';
    setTimeout(()=>{jumpToRowAndFocusQty(idx);pendingJump=null;},150);
}

function handleBarcode(code,fromCamera){
    if (!code) return false;
    const now=Date.now(),cs=String(code).trim();
    if (cs===lastCode&&(now-lastTime)<200) return false;
    lastCode=cs; lastTime=now;
    let fi=smartMatchWithPopup(cs);
    if (fi===null||fi===undefined||fi===-1) {
        if (multiMatchPopupShowing) return true;
        fi=findBestMatchRowIndex(cs);
    }
    if (fi===null||fi===undefined||fi===-1) {
        playBeep(false); showToast(`❌ 未匹配: ${cs.substring(0,20)}`,true); vibrate();
        consecutiveFailures++; lastDecodeSucceeded=false;
        setTimeout(()=>{const m=document.getElementById('manualInput');if(m){m.focus();m.select();currentInputElement=m;}},100);
        return false;
    }
    consecutiveFailures=0; lastDecodeSucceeded=true; playBeep(true); vibrate();
    showToast(`✅ ${db[fi]['商品名称']||db[fi]['名称']||cs}`,false);
    const sf=document.getElementById('scanFrame'); if (sf){sf.classList.add('scan-success');setTimeout(()=>sf.classList.remove('scan-success'),200);}
    if (fromCamera) stopScanningAndJump(fi); else jumpToRowAndFocusQty(fi);
    return true;
}

function setupCameraControls(track) {
    cameraTrack=track||null;
    const tb=document.getElementById('torchBtn'); if (!tb) return;
    tb.classList.remove('active'); tb.textContent='🔦 补光';
    tb.onclick=async()=>{
        if (!cameraTrack||!cameraTrack.getCapabilities){showToast('当前相机不支持补光控制',true);return;}
        const caps=cameraTrack.getCapabilities();
        if (!caps.torch){showToast('当前设备不支持手电筒',true);return;}
        const on=!tb.classList.contains('active');
        try{await cameraTrack.applyConstraints({advanced:[{torch:on}]});tb.classList.toggle('active',on);tb.textContent=on?'🔦 关补光':'🔦 补光';}catch(e){showToast('补光切换失败',true);}
    };
}

/** iPad Pro M4: 更快速的对焦阶梯 */
async function triggerFastFocus(track) {
    if (!track||!track.getCapabilities) return;
    const caps=track.getCapabilities();
    if (!caps.focusMode) return;
    try {
        // iPad Pro M4: 极近距离快速扫描 + 恢复
        if (caps.focusMode.includes('manual')) {
            await track.applyConstraints({advanced:[{focusMode:'manual',focusDistance:0.02}]});
            await new Promise(r=>setTimeout(r,20));
            await track.applyConstraints({advanced:[{focusMode:'manual',focusDistance:0.05}]});
            await new Promise(r=>setTimeout(r,20));
            await track.applyConstraints({advanced:[{focusMode:'manual',focusDistance:0.10}]});
            await new Promise(r=>setTimeout(r,20));
            await track.applyConstraints({advanced:[{focusMode:'manual',focusDistance:0.20}]});
        }
        if (caps.focusMode.includes('continuous')) {
            await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
        }
    } catch(e) {
        try{if(caps.focusMode.includes('continuous')) await track.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(_){}
    }
}

function applyCameraTuning(track) {
    if (!track||!track.getCapabilities) return;
    const caps=track.getCapabilities(),adv=[];
    if (caps.focusMode&&caps.focusMode.includes('continuous')) adv.push({focusMode:'continuous'});
    if (caps.exposureMode&&caps.exposureMode.includes('continuous')) adv.push({exposureMode:'continuous'});
    if (caps.whiteBalanceMode&&caps.whiteBalanceMode.includes('continuous')) adv.push({whiteBalanceMode:'continuous'});
    if (caps.exposureCompensation) {
        const mn=typeof caps.exposureCompensation.min==='number'?caps.exposureCompensation.min:-2;
        const mx=typeof caps.exposureCompensation.max==='number'?caps.exposureCompensation.max:2;
        adv.push({exposureCompensation:Math.max(mn,Math.min(mx,0.8))});
    }
    if (caps.frameRate&&caps.frameRate.max) {
        adv.push({frameRate:{ideal:Math.min(caps.frameRate.max,60)}});
    }
    if (adv.length) track.applyConstraints({advanced:adv}).catch(()=>{});
}

/** iPad Pro: 点击画面触发手动对焦 + 连续扫描重置 */
function setupVideoClickFocus(videoEl) {
    videoEl.addEventListener('click',async()=>{
        if (!scanning) return;
        const track=videoEl?.srcObject?.getVideoTracks?.()[0];
        if (track) {
            await triggerFastFocus(track);
            showToast("🎯 快速对焦完成",false);
        }
    });
}

// 图像预处理（用于增强模式）
function getFrameROI(ve,fe) {
    const vw=ve.videoWidth,vh=ve.videoHeight;
    if (!vw||!vh) return null;
    const vr=ve.getBoundingClientRect(),fr=fe.getBoundingClientRect();
    const va=vw/vh,ba=vr.width/vr.height;
    let rw,rh,ox=0,oy=0;
    if (va>ba){rh=vr.height;rw=rh*va;ox=(rw-vr.width)/2;}else{rw=vr.width;rh=rw/va;oy=(rh-vr.height)/2;}
    const xi=fr.left-vr.left+ox,yi=fr.top-vr.top+oy,sx=vw/rw,sy=vh/rh;
    let rx=Math.max(0,Math.floor(xi*sx)),ry=Math.max(0,Math.floor(yi*sy));
    let rw2=Math.min(vw-rx,Math.floor(fr.width*sx)),rh2=Math.min(vh-ry,Math.floor(fr.height*sy));
    if (rw2<=0||rh2<=0) return null;
    const ly=ry+Math.floor(rh2*0.55),lh=rh2-Math.floor(rh2*0.55);
    if (lh<10) return{x:rx,y:ry,w:rw2,h:rh2};
    return{x:rx,y:ly,w:rw2,h:lh};
}

function preprocessImage(ve,roi) {
    const c=document.createElement('canvas');c.width=roi.w;c.height=roi.h;
    const ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(ve,roi.x,roi.y,roi.w,roi.h,0,0,roi.w,roi.h);
    const id=ctx.getImageData(0,0,roi.w,roi.h),d=id.data;
    let mn=255,mx=0;
    for (let i=0;i<d.length;i+=4){const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];d[i]=d[i+1]=d[i+2]=g;if(g<mn)mn=g;if(g>mx)mx=g;}
    const th=mn+(mx-mn)*0.55;
    for (let i=0;i<d.length;i+=4){const v=d[i]>th?255:0;d[i]=d[i+1]=d[i+2]=v;}
    ctx.putImageData(id,0,0);return c;
}

/**
 * 图像增强解码：支持 videoEl 或 canvas 输入
 */
async function tryEnhanced(source, frameEl) {
    if (!source) return null;
    
    if (source instanceof HTMLVideoElement) {
        if (source.readyState < 2) return null;
        const roi = getFrameROI(source, frameEl);
        if (!roi) return null;
        const pc = preprocessImage(source, roi);
        if (!pc) return null;
        
        if ('BarcodeDetector' in window) {
            try {
                const detector = new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_39','code_93','code_128','itf','codabar']});
                const codes = await detector.detect(pc);
                if (codes && codes.length > 0) return codes[0].rawValue;
            } catch(e) {}
        }
        return null;
    } else if (source instanceof HTMLCanvasElement) {
        // canvas 输入（iOS截帧模式）：直接对canvas做增强检测
        if ('BarcodeDetector' in window) {
            try {
                const detector = new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_39','code_93','code_128','itf','codabar']});
                const codes = await detector.detect(source);
                if (codes && codes.length > 0) return codes[0].rawValue;
            } catch(e) {}
        }
        return null;
    }
    return null;
}

/**
 * iPad 近距扫码核心策略：
 * iPad Pro M4 主摄像头最近对焦距离约 15-20cm，拿太近必然模糊。
 * 解决方案：启用 2x 数字变焦 → 用户站在 25-30cm 处，条码在画面中
 * 仍然够大，识别率大幅提升。
 *
 * 如果相机不支持 zoom（各型号不一），用 canvas 帧捕获方案替代。
 */
async function startScanning() {
    if (scanning){showToast("扫描器已在运行",false);return;}
    
    const isIPad=/iPad|Macintosh/.test(navigator.userAgent)&&'ontouchstart' in window;
    const hasNative='BarcodeDetector' in window;
    const sf=document.getElementById('scanFrame');
    if (sf) sf.style.top=isIPad?'15%':'25%';
    
    document.getElementById('scanUI').style.display='flex';
    scanning=true;
    if(reader){try{await reader.reset()}catch(e){}reader=null;}
    
    const badge=document.getElementById('enhanceBadge');
    if(enhanceMode) badge.classList.remove('hidden'); else badge.classList.add('hidden');
    
    try {
        // iPad: 用 1080p 就够了，太高分辨率对远程解码无帮助
        const stream=await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:{exact:"environment"},
                width:{ideal:1920},
                height:{ideal:1080},
                frameRate:{ideal:60}
            }
        });
        const videoEl=document.getElementById('video');
        videoEl.srcObject=stream;
        await videoEl.play();
        
        const track=stream.getVideoTracks()[0];
        
        // ========== 核心：iPad 数字变焦 ==========
        // 2x 光学级数字变焦（iPad Pro M4 支持 0.5x~3x 数字变焦）
        // 让用户拿远一些（25cm+），画面自动拉近使条码清晰可辨
        if (isIPad && track && track.getCapabilities) {
            const caps = track.getCapabilities();
            
            // 尝试连续自动对焦（让系统自己管理，不人工干预）
            const initConstraints = [];
            
            // 2x 数字变焦（iPad Pro M4 支持，近摄核心）
            if (caps.zoom && caps.zoom.max >= 2) {
                initConstraints.push({ zoom: Math.min(caps.zoom.max, 2.0) });
                console.log('[扫描] 已启用 2x 数字变焦，max zoom:', caps.zoom.max);
            }
            
            // 连续自动对焦
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
                initConstraints.push({ focusMode: 'continuous' });
            }
            // 连续自动曝光
            if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
                initConstraints.push({ exposureMode: 'continuous' });
            }
            // 曝光补偿略亮（条码更清晰）
            if (caps.exposureCompensation) {
                const mn = typeof caps.exposureCompensation.min === 'number' ? caps.exposureCompensation.min : -2;
                const mx = typeof caps.exposureCompensation.max === 'number' ? caps.exposureCompensation.max : 2;
                initConstraints.push({ exposureCompensation: Math.max(mn, Math.min(mx, 0.5)) });
            }
            
            if (initConstraints.length > 0) {
                track.applyConstraints({ advanced: initConstraints }).catch(e => {
                    console.log('[扫描] 部分约束不受支持:', e.message);
                });
            }
        }
        
        // 设置补光灯控制
        setupCameraControls(track);
        
        // 第1次: 相机准备后提示扫码
        setTimeout(()=>{
            showToast(`📷 ${isIPad?'2x 变焦模式已开启，请距离 25-30cm 处扫码':'扫码引擎已启动'}`,false);
        },600);
        
        // 实时保持连续自动对焦（iOS 系统级对焦最可靠）
        currentFocusInterval=setInterval(()=>{
            if(!scanning||!track) {clearInterval(currentFocusInterval);return;}
            const caps=track.getCapabilities();
            if (!caps) return;
            // 不做手动对焦干扰，仅确保连续模式开启
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
                track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
            }
        },500); // 500ms 保持一次自动对焦
        
        // 点击画面手动触发自动对焦（iPad Tap to Focus）
        videoEl.addEventListener('click',async ()=>{
            if (!scanning||!track) return;
            const caps=track.getCapabilities();
            if (!caps||!caps.focusMode) return;
            try {
                // 快速近距扫描 -> 恢复自动
                if (caps.focusMode.includes('manual')) {
                    await track.applyConstraints({advanced:[{focusMode:'manual',focusDistance:0.05}]});
                    await new Promise(r=>setTimeout(r,50));
                    await track.applyConstraints({advanced:[{focusMode:'manual',focusDistance:0.15}]});
                }
                if (caps.focusMode.includes('continuous')) {
                    await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
                }
                showToast("🎯 已重新对焦",false);
            } catch(e){}
        });
        
        // ===== 主解码 =====
        if (hasNative) {
            const detector = new window.BarcodeDetector({
                formats:['ean_13','ean_8','upc_a','upc_e','code_39','code_93','code_128','itf','codabar','qr_code','data_matrix','pdf417','aztec']
            });
            
            if (isIPad) {
                // iPad 专用：canvas 截帧解码（2x 变焦后，截帧比 video 流更稳定）
                // 200ms 间隔，从 video 截帧到 canvas 检测，精度更高
                const offscreenCanvas = document.createElement('canvas');
                const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
                
                const iPadLoop = async () => {
                    while (scanning && videoEl.readyState >= 2) {
                        try {
                            offscreenCanvas.width = videoEl.videoWidth;
                            offscreenCanvas.height = videoEl.videoHeight;
                            offCtx.drawImage(videoEl, 0, 0);
                            const codes = await detector.detect(offscreenCanvas);
                            if (codes && codes.length > 0 && scanning) {
                                const code = codes[0].rawValue;
                                if (code) {
                                    const now = Date.now();
                                    if (code !== lastCode || (now - lastTime) >= 300) {
                                        handleBarcode(code, true);
                                        consecutiveFailures = 0; lastDecodeSucceeded = true;
                                        lastCode = code; lastTime = now;
                                    }
                                }
                            } else {
                                consecutiveFailures++;
                                if (enhanceMode || consecutiveFailures >= AUTO_ENHANCE_THRESHOLD) {
                                    const enhanced = await tryEnhanced(offscreenCanvas, sf);
                                    if (enhanced) { handleBarcode(enhanced, true); consecutiveFailures = 0; vibrate(); }
                                }
                            }
                        } catch(e) { consecutiveFailures++; }
                        await new Promise(r => setTimeout(r, 200));
                    }
                };
                iPadLoop();
                showToast(`📷 iPad 截帧扫码 v3.3.8 | 2x 变焦 25-30cm`, false);
            } else {
                // iPhone / 桌面端：直接 video 检测（更快 80ms）
                const mainLoop = async () => {
                    while (scanning && videoEl.readyState >= 2) {
                        try {
                            const codes = await detector.detect(videoEl);
                            if (codes && codes.length > 0 && scanning) {
                                const code = codes[0].rawValue;
                                if (code) {
                                    const now = Date.now();
                                    if (code !== lastCode || (now - lastTime) >= 300) {
                                        handleBarcode(code, true);
                                        consecutiveFailures = 0; lastDecodeSucceeded = true;
                                        lastCode = code; lastTime = now;
                                    }
                                }
                            } else {
                                consecutiveFailures++;
                                if (enhanceMode || consecutiveFailures >= AUTO_ENHANCE_THRESHOLD) {
                                    const enhanced = await tryEnhanced(videoEl, sf);
                                    if (enhanced) { handleBarcode(enhanced, true); consecutiveFailures = 0; vibrate(); }
                                }
                            }
                        } catch(e) { consecutiveFailures++; }
                        await new Promise(r => setTimeout(r, 80));
                    }
                };
                mainLoop();
                showToast(`📷 扫码引擎已启动${enhanceMode?' (增强模式)':''}`, false);
            }
        } else {
            // 无 BarcodeDetector：ZXing 降级
            const hints = new Map();
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
            hints.set(ZXing.DecodeHintType.CHARACTER_SET, "UTF-8");
            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
                ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
                ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR
            ]);
            reader = new ZXing.BrowserMultiFormatReader(hints);
            reader.timeBetweenDecodingAttempts = 20;
            reader.decodeFromVideoElement('video', (result, err) => {
                if (!scanning) return;
                if (result) { const code = result.getText(); if (code) { handleBarcode(code, true); consecutiveFailures = 0; lastDecodeSucceeded = true; return; } }
                // 只在实际解码错误时递增失败计数，而不是每个无结果帧
                if (err) { consecutiveFailures++; lastDecodeSucceeded = false; }
                if (enhanceMode || consecutiveFailures >= AUTO_ENHANCE_THRESHOLD) {
                    tryEnhanced(videoEl, sf).then(ec => { if (ec) { handleBarcode(ec, true); consecutiveFailures = 0; vibrate(); } });
                }
            });
            showToast(`ZXing 扫码引擎已启动${enhanceMode?' (增强模式)':''}`, false);
        }
    } catch(err) {
        console.error("相机错误:",err);
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video:{facingMode:"back", width:{ideal:1280}, height:{ideal:720}}
            });
            const videoEl = document.getElementById('video');
            videoEl.srcObject = stream; await videoEl.play();
            setTimeout(() => {
                const track = videoEl?.srcObject?.getVideoTracks?.()[0];
                if (track) setupCameraControls(track);
            }, 300);
            const hints = new Map();
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
                ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
                ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR
            ]);
            reader = new ZXing.BrowserMultiFormatReader(hints);
            reader.timeBetweenDecodingAttempts = 20;
            reader.decodeFromVideoElement('video', (result, err) => {
                if (!scanning) return;
                if (result) { const code = result.getText(); if (code) handleBarcode(code, true); }
            });
            showToast("📷 后置相机已启动（降级模式）", false);
        } catch(err2) {
            showToast("无法启动摄像头，请检查权限", true);
            stopScanning(true);
        }
    }
}

function stopScanning(manual){
    scanning=false;
    if(currentFocusInterval){clearInterval(currentFocusInterval);currentFocusInterval=null;}
    if(reader){try{reader.reset()}catch(e){}reader=null;}
    const ve=document.getElementById('video');
    if(ve&&ve.srcObject){ve.srcObject.getTracks().forEach(t=>t.stop());ve.srcObject=null;}
    document.getElementById('scanUI').style.display='none';cameraTrack=null;consecutiveFailures=0;
}

function toggleEnhanceMode(){
    enhanceMode=!enhanceMode;
    const tb=document.getElementById('scanEnhanceBtn'),bg=document.getElementById('enhanceBadge');
    if(enhanceMode){tb.classList.add('active');tb.innerHTML='✨ 增强开';if(bg)bg.classList.remove('hidden');showToast("增强模式已开启",false);}
    else{tb.classList.remove('active');tb.innerHTML='✨ 增强';if(bg)bg.classList.add('hidden');showToast("增强模式已关闭",false);}
    if(scanning){stopScanning(true);setTimeout(()=>startScanning(),200);}
}

function setupKeyboardListener(){
    if(!(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent))) return;
    if(window.visualViewport){
        window.visualViewport.addEventListener('resize',()=>{
            const kh=originalViewportHeight-window.visualViewport.height;
            if(kh>150) document.body.classList.add('keyboard-open');
            else{document.body.classList.remove('keyboard-open');setTimeout(()=>{if(pendingJump!==null){const el=document.getElementById(`row-${pendingJump}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}},100);}
        });
    }
    window.addEventListener('resize',()=>{if(originalViewportHeight-window.innerHeight>150)document.body.classList.add('keyboard-open');else document.body.classList.remove('keyboard-open');});
}
function showKeyboard(){
    if(currentInputElement&&document.activeElement!==currentInputElement){currentInputElement.focus();currentInputElement.select();}
    else{const m=document.getElementById('manualInput');if(m){m.focus();m.select();currentInputElement=m;}}
}
function hideKeyboard(){
    if(currentInputElement){currentInputElement.blur();currentInputElement=null;}
    document.activeElement?.blur();document.body.classList.remove('keyboard-open');
}

function loadData(){
    try{
        const saved=localStorage.getItem(STORAGE_KEY);
        if(saved){const d=JSON.parse(saved);db=d.db||[];columns=d.columns||[];}
        if(!columns.length){columns=['实际数量','商品名称','编码','价格'];db=[];}
        normalizeQtyCol();db.forEach(r=>{if(r['实际数量']===undefined)r['实际数量']='';});recomputeAll();
    }catch(e){console.error(e);columns=['实际数量','商品名称','编码','价格'];normalizeQtyCol();db=[];}
}
function normalizeQtyCol(){
    if(!Array.isArray(columns)||!columns.length) return;
    const idx=columns.indexOf('实际数量');if(idx===-1)return;
    columns.splice(idx,1);columns.splice(Math.min(4,columns.length),0,'实际数量');
}

}
function playBeep(s){
    try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=s?1200:400;g.gain.value=0.6;o.start();g.gain.exponentialRampToValueAtTime(0.00001,c.currentTime+0.2);o.stop(c.currentTime+0.2);c.resume();}catch(e){}
}

function openAdminPanel(){let ia=false;try{const d=JSON.parse(localStorage.getItem("FEISUPANDIAN_AUTH_V2"));if(d&&d.admin)ia=true;}catch(e){}if(!ia){showToast("⚠️ 你不是管理员",true);return;}adminMode=true;renderAdmin();document.getElementById('adminPanel').style.display='flex';}
function closeAdminPanel(){document.getElementById('adminPanel').style.display='none';}
function renderAdmin(){const c=document.getElementById('adminCodeList');if(!c)return;const t=authCodes.length,uc=authCodes.filter(a=>a.used).length,un=authCodes.filter(a=>!a.used);c.innerHTML=`<div style="text-align:center;font-size:14px;color:#334155;margin-bottom:12px;font-weight:bold;">已用 ${uc} / 总计 ${t}</div>${un.length?un.map(a=>`<div class="admin-code-item"><span style="font-size:16px;letter-spacing:2px;">${a.code}</span><span class="status-badge">未使用</span></div>`).join(''):'<div style="text-align:center;color:#94a3b8;padding:20px;font-size:14px;">⚠️ 所有授权码已用完，请追加</div>'}`;}
function generateNewCodes(){const fb=["000WENXI","11W1ENXI","22WE2NXI","33WEN3XI","44WENX4I","55WENXI5","6W66ENXI","7W7E7NXI","8W8EN8XI","9W9ENX9I","0W0ENXI0","1WE11NXI","2WE2N2XI","3WE3NX3I","4WE4NXI4","5WEN55XI","6WEN6X6I","7WEN7XI7","8WENX88I","9WENX9I9","0WENXI00","W111ENXI","W22E2NXI","W33EN3XI","W44ENX4I","W55ENXI5","W6E66NXI","W7E7N7XI","W8E8NX8I","W9E9NXI9","W0EN00XI","W1EN1X1I","W2EN2XI2","W3ENX33I","W4ENX4I4","W5ENXI55","WE666NXI","WE77N7XI","WE88NX8I","WE99NXI9","WE0N00XI","WE1N1X1I","WE2N2XI2","WE3NX33I","WE4NX4I4","WE5NXI55","WEN666XI","WEN77X7I","WEN88XI8","WEN9X99I"];let added=0;const exist=new Set(authCodes.map(a=>a.code));for(let c of fb){if(added>=10)break;if(!exist.has(c)){exist.add(c);authCodes.push({code:c,used:false,deviceId:''});added++;}}saveAuthState();renderAdmin();showToast(`✅ 已追加 ${added} 个新授权码`,false);}

// ---------- 渲染 ----------
function render(){
    const th=document.getElementById('tHead'),tb=document.getElementById('tBody');
    if(!columns.length){tb.innerHTML='<tr><td colspan="10" class="text-center p-6 text-gray-500">暂无数据，请导入Excel或添加列表</td></tr>';return;}
    th.innerHTML=`<tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr>`;
    tb.innerHTML=db.map((r,i)=>`<tr id="row-${i}">${columns.map(c=>`<td>${c==='实际数量'?`<input id="qty-${i}" type="number" value="${r[c]||''}" class="qty-input" onchange="updateQty(${i},this.value)" onfocus="this.select()" placeholder="0" inputmode="numeric" />`:`<input type="text" value="${esc(String(r[c]||''))}" class="w-full p-2 text-sm outline-none bg-transparent" style="min-width:80px;width:100%;" onchange="updateCell(${i},'${c}',this.value)" />`}</td>`).join('')}</tr>`).join('');
    setTimeout(()=>autoAdj(),50);
    if(pendingJump!==null) setTimeout(()=>{jumpToRowAndFocusQty(pendingJump);pendingJump=null;},100);
}
function updateQty(i,v){db[i]['实际数量']=v;saveData();showToast("已保存",false);hideKeyboard();}
function updateCell(i,col,v){db[i][col]=v;computePrecomputedFields(db[i]);saveData();}
function autoAdj(){
    const table=document.getElementById('mainTable');if(!table)return;
    const cc=columns.length;if(cc===0)return;
    const hd=table.querySelectorAll('thead th'),rows=table.querySelectorAll('tbody tr');
    if(!hd.length)return;const mw=new Array(cc).fill(0);
    hd.forEach((th,i)=>{if(i<cc)mw[i]=Math.max(mw[i],Math.min((th.textContent||'').length*14+40,200));});
    rows.forEach(row=>{row.querySelectorAll('td').forEach((cell,i)=>{if(i<cc){const inp=cell.querySelector('input');let t=inp?(inp.value||inp.placeholder||''):(cell.textContent||'');let w=0;for(let c of t){const cd=c.charCodeAt(0);w+=cd>=0x4e00&&cd<=0x9fff?16:(cd>=0x30&&cd<=0x39?8:10);}w=Math.min(Math.max(w+30,80),250);if(w>mw[i])mw[i]=w;}});});
    hd.forEach((th,i)=>{if(i<cc&&mw[i]>0){th.style.width=mw[i]+'px';th.style.minWidth=mw[i]+'px';}});
}
function renderColList(){document.getElementById('colList').innerHTML=columns.map((c,i)=>`<div class="col-item p-3" draggable="true" data-index="${i}" data-col="${c}"><div class="flex items-center justify-between"><div class="flex items-center gap-2 flex-1"><span class="drag-handle text-xl cursor-move">☰</span><span class="font-bold text-sm">${i+1}. ${c}</span></div><div class="flex gap-1"><button onclick="moveUp(${i})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬆️</button><button onclick="moveDown(${i})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬇️</button><button onclick="delCol('${c}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">删</button></div></div></div>`).join('');setupDrag();}
function setupDrag(){const items=document.querySelectorAll('.col-item');const isTouch='ontouchstart' in window;let dragged=null;items.forEach(item=>{if(isTouch){item.setAttribute('draggable','false');return;}item.setAttribute('draggable','true');item.addEventListener('dragstart',e=>{dragged=item;item.style.opacity='0.5';e.dataTransfer.effectAllowed='move';});item.addEventListener('dragend',()=>{item.style.opacity='';dragged=null;});item.addEventListener('dragover',e=>e.preventDefault());item.addEventListener('drop',e=>{e.preventDefault();if(!dragged||dragged===item)return;const fi=parseInt(dragged.dataset.index),ti=parseInt(item.dataset.index);if(!isNaN(fi)&&!isNaN(ti)){const t=columns[fi];columns[fi]=columns[ti];columns[ti]=t;renderColList();render();saveData();showToast("列顺序已更新",false);}});});}
function moveUp(i){if(i>0){const t=columns[i];columns[i]=columns[i-1];columns[i-1]=t;renderColList();render();saveData();showToast("列顺序已更新",false);}}
function moveDown(i){if(i<columns.length-1){const t=columns[i];columns[i]=columns[i+1];columns[i+1]=t;renderColList();render();saveData();showToast("列顺序已更新",false);}}
function openColModal(){renderColList();document.getElementById('colModal').style.display='flex';}
function closeColModal(){document.getElementById('colModal').style.display='none';render();}
function addColumn(){const n=document.getElementById('newColName').value.trim();if(n&&!columns.includes(n)){columns.push(n);db.forEach(r=>r[n]='');renderColList();render();saveData();showToast(`已添加列: ${n}`,false);document.getElementById('newColName').value='';}else if(columns.includes(n))showToast("列名已存在",true);}
function delCol(col){if(confirm(`确定删除列 "${col}" 吗？数据将丢失！`)){const i=columns.indexOf(col);if(i!==-1){columns.splice(i,1);db.forEach(r=>delete r[col]);renderColList();render();saveData();showToast(`已删除列: ${col}`,false);}}}

// ---------- 导入导出 ----------
document.getElementById('fileInput').onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    showToast("正在导入...",false);
    const fr=new FileReader();
    fr.onload=function(ev){
        try{
            const data=new Uint8Array(ev.target.result);
            const wb=XLSX.read(data,{type:'array'});
            const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
            if(json.length>0){
                columns=Object.keys(json[0]);if(!columns.includes('实际数量'))columns.unshift('实际数量');
                normalizeQtyCol();db=json.map(row=>{const r={...row};if(r['实际数量']===undefined)r['实际数量']='';computePrecomputedFields(r);return r;});
                saveData();render();showToast(`✅ 导入成功！共 ${db.length} 条数据`,false);
            }else showToast("文件无数据",true);
        }catch(err){console.error(err);showToast("解析失败",true);}
    };
    fr.onerror=function(){showToast("读取失败",true);};
    fr.readAsArrayBuffer(file);e.target.value='';
};

function exportExcel(){
    if(!db.length){showToast("暂无数据可导出",true);return;}
    let name=prompt("请输入导出文件名：",`飞速盘点_${new Date().toLocaleDateString()}`);
    if(!name||!name.trim())name=`飞速盘点_${new Date().toLocaleDateString()}`;
    const ed=db.map(row=>{const r={...row};delete r.__bn;delete r.__br;delete r.__b6;delete r.__cn;delete r.__cr;delete r.__c6;return r;});
    const ws=XLSX.utils.json_to_sheet(ed,{header:columns});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"库存数据");XLSX.writeFile(wb,name.trim()+".xlsx");showToast("✅ 导出成功",false);
}

function hardReset(){if(confirm("⚠️ 确定清空所有数据吗？此操作不可恢复！")){localStorage.removeItem(STORAGE_KEY);db=[];columns=['实际数量','商品名称','编码','价格'];normalizeQtyCol();saveData();render();showToast("已清空所有数据",false);}}

// ---------- 初始化 ----------
window.addEventListener('resize',()=>setTimeout(()=>autoAdj(),100));
window.addEventListener('beforeunload',()=>{if(scanning)stopScanning(true);});
document.addEventListener('touchstart',function(e){if(currentInputElement&&!e.target.closest('.qty-input')&&!e.target.closest('#manualInput'))hideKeyboard();});

loadData();render();setupKeyboardListener();initAuth();

const ai=document.getElementById('authInput');
if(ai)ai.addEventListener('keypress',(e)=>{if(e.key==='Enter')verifyAuthCode();});

document.getElementById('confirmBtn').onclick=()=>{
    const inp=document.getElementById('manualInput'),val=inp.value.trim();
    if(val==='授权码'){openAdminPanel();inp.value='';return;}
    if(val){handleBarcode(val,false);inp.value='';document.getElementById('smartIndicator').style.display='none';inp.placeholder='📱 输入条码/编码/名称（支持智能识别）...';}
    hideKeyboard();
};
document.getElementById('manualInput').oninput=onManualInputChange;
document.getElementById('manualInput').onkeypress=(e)=>{
    if(e.key==='Enter'){
        const inp=e.target,val=inp.value.trim();
        if(val==='授权码'){openAdminPanel();inp.value='';return;}
        if(val){handleBarcode(val,false);inp.value='';document.getElementById('smartIndicator').style.display='none';inp.placeholder='📱 输入条码/编码/名称（支持智能识别）...';}
        hideKeyboard();
    }
};
document.getElementById('scanBtn').onclick=()=>{if(scanning)stopScanning(true);else startScanning();hideKeyboard();};
document.getElementById('showKeyboardBtn').onclick=()=>showKeyboard();
const teb=document.getElementById('scanEnhanceBtn');if(teb)teb.onclick=()=>toggleEnhanceMode();

console.log(`⚡ 飞速盘点 v${VERSION}`);
console.log(`📌 ${db.length} 条商品 | 6级柔性匹配引擎 | 去前缀/后缀/校验位`);
console.log(`📷 iPad 截帧扫码(v3.3.8) | 2x变焦 25-30cm | 连续自动对焦`);
