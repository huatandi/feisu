<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>飞速盘点 · Sanfei v4.0.0</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.19.1"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="toast"></div>
    <div id="colModal"><div class="modal-content p-5"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h2 class="text-xl font-bold">📋 列管理</h2><button onclick="closeColModal()" style="background:#1e293b;color:#fff;border:none;border-radius:999px;padding:8px 20px;font-weight:900;font-size:14px;cursor:pointer;">完成</button></div><p class="text-xs text-gray-500 text-center mb-3">💡 点击箭头上下排序</p><div id="colList" class="space-y-2 mb-4" style="max-height:55vh;overflow:auto;"></div><div class="flex gap-2 p-2 bg-gray-100 rounded-lg"><input type="text" id="newColName" placeholder="新列名..." class="flex-1 bg-white rounded-lg px-3 py-2 font-bold text-sm outline-none" /><button onclick="addColumn()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm">添加</button></div></div></div>
    <div class="main-card">
        <div class="header-fixed">
            <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-4 text-white">
                <div class="flex items-center justify-center gap-3">
                    <span class="text-2xl">⚡</span>
                    <h1 class="text-2xl font-black tracking-tight">飞速盘点</h1>
                    <div class="version-badge">sanfei v4.0.0</div>
                </div>
            </div>
            <div style="padding: 16px 16px 0 16px;">
                <input type="text" id="manualInput" placeholder="📱 输入条码/编码/名称..." />
                <div class="btn-group-4">
                    <button onclick="openColModal()" class="action-btn bg-gray-700 text-white shadow-md">📊 列管理</button>
                    <label class="action-btn bg-emerald-600 text-white shadow-md cursor-pointer">📂 导入 <input type="file" id="fileInput" class="hidden" accept=".xlsx,.xls,.csv" /></label>
                    <button onclick="exportExcel()" class="action-btn bg-emerald-600 text-white shadow-md">💾 导出</button>
                    <button id="confirmBtn" class="action-btn bg-blue-600 text-white shadow-md">✅ 确认</button>
                </div>
            </div>
        </div>
        <div class="scrollable-area">
            <div id="progressArea">
                <div class="progress-title">
                    <span id="progressLabel">⏳ 正在读取数据...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                </div>
                <div class="progress-detail">
                    <span id="progressCount">0 / 0</span>
                    <span id="progressStatus">准备中</span>
                </div>
            </div>
            <div id="errorSummary" class="error-summary"><details><summary id="errorSummaryTitle">⚠️ 导入完成，部分行失败</summary><ul id="errorList"></ul></details></div>
            <div class="table-container">
                <table id="mainTable">
                    <thead id="tHead"></thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination">
                <button id="prevPageBtn" onclick="changePage(-1)">◀ 上一页</button>
                <span class="info" id="pageInfo">第 1 / 1 页</span>
                <button id="nextPageBtn" onclick="changePage(1)">下一页 ▶</button>
                <span class="info" id="totalInfo">共 0 条</span>
            </div>
        </div>
    </div>

    <div class="bottom-fixed-btns">
        <div class="bottom-btns">
            <button id="scanBtn" class="bottom-btn bg-blue-600 text-white shadow-lg cam-btn-large">📷 扫码</button>
            <button onclick="hardReset()" class="bottom-btn bg-red-600 text-white shadow-lg">🗑️ 重置</button>
            <button id="showKeyboardBtn" class="bottom-btn bg-purple-600 text-white shadow-lg keyboard-btn">⌨️ 键盘</button>
        </div>
    </div>

    <div id="scanUI" class="fixed inset-0 bg-black z-[999] hidden flex-col">
        <div class="scan-header"><div class="scan-header-left"><span class="font-bold text-blue-400 text-lg">🔍 极速条码引擎</span><button id="scanEnhanceBtn" class="scan-enhance-btn">✨ 增强</button></div><button onclick="stopScanning(true)" class="close-scan-btn text-white font-bold">✕ 关闭扫描</button></div>
        <div class="relative flex-1 bg-black"><video id="video" class="w-full h-full object-cover" playsinline muted autoplay></video><div class="focus-guide">💡 点击画面辅助对焦 | 识别速度已优化 | 增强模式可提升劣质条码识别率</div><div class="scan-frame" id="scanFrame"><div class="scan-line"></div></div><div id="enhanceBadge" class="enhance-badge hidden">✨ 增强模式已激活</div><div class="absolute bottom-8 left-0 right-0 text-center"><div class="bg-black/70 backdrop-blur text-white px-4 py-2 rounded-full inline-block text-sm font-bold border-2 border-blue-500">📷 将条码对准扫描框</div><div class="mt-3"><button id="torchBtn" type="button" class="scan-tool-btn">🔦 补光</button></div></div></div>
    </div>

  <script src="./js/core.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/search.js"></script>
  <script src="./js/table.js"></script>
  <script src="./js/import-export.js"></script>
  <script src="./js/scanner.js"></script>
  <script src="./js/columns.js"></script>
  <script src="./js/keyboard.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
