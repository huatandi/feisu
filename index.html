                    <div class="version-badge">sanfei v3.3.10</div>
                </div>
            </div>
            
            <div style="padding: 16px 16px 0 16px;">
                <input type="text" id="manualInput" placeholder="📱 输入条码/编码/名称..." />
                
                <div class="btn-group-4">
                    <button onclick="openColModal()" class="action-btn bg-gray-700 text-white shadow-md">📊 列管理</button>
                    <label class="action-btn bg-emerald-600 text-white shadow-md cursor-pointer">
                        📂 导入 <input type="file" id="fileInput" class="hidden" accept=".xlsx,.xls,.csv" />
                    </label>
                    <button onclick="exportExcel()" class="action-btn bg-emerald-600 text-white shadow-md">💾 导出</button>
                    <button id="confirmBtn" class="action-btn bg-blue-600 text-white shadow-md">✅ 确认</button>
                </div>
            </div>
        </div>

        <div class="scrollable-area">
            <div id="progressArea">
                <div class="progress-title">
                    <span id="progressLabel">⏳ 正在读取数据...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                </div>
                <div class="progress-detail">
                    <span id="progressCount">0 / 0</span>
                    <span id="progressStatus">准备中</span>
                </div>
            </div>
            <div id="errorSummary" class="error-summary">
                <details>
                    <summary id="errorSummaryTitle">⚠️ 导入完成，部分行失败</summary>
                    <ul id="errorList"></ul>
                </details>
            </div>

            <div class="table-container">
                <table id="mainTable">
                    <thead id="tHead"></thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="bottom-fixed-btns">
        <div class="bottom-btns">
            <button id="scanBtn" class="bottom-btn bg-blue-600 text-white shadow-lg cam-btn-large">📷 扫码</button>
            <button onclick="hardReset()" class="bottom-btn bg-red-600 text-white shadow-lg">🗑️ 重置</button>
            <button id="showKeyboardBtn" class="bottom-btn bg-purple-600 text-white shadow-lg keyboard-btn">⌨️ 键盘</button>
        </div>
    </div>

    <div id="scanUI" class="fixed inset-0 bg-black z-[999] hidden flex-col">
        <div class="scan-header">
            <div class="scan-header-left">
                <span class="font-bold text-blue-400 text-lg">🔍 极速条码引擎</span>
                <button id="scanEnhanceBtn" class="scan-enhance-btn">✨ 增强</button>
            </div>
            <button onclick="stopScanning(true)" class="close-scan-btn text-white font-bold">✕ 关闭扫描</button>
        </div>
        <div class="relative flex-1 bg-black">
            <video id="video" class="w-full h-full object-cover" playsinline muted autoplay></video>
            <div class="focus-guide">💡 点击画面辅助对焦 | 识别速度已优化 | 增强模式可提升劣质条码识别率</div>
            <div class="scan-frame" id="scanFrame">
                <div class="scan-line"></div>
            </div>
            <div id="enhanceBadge" class="enhance-badge hidden">✨ 增强模式已激活</div>
            <div class="absolute bottom-8 left-0 right-0 text-center">
                <div class="bg-black/70 backdrop-blur text-white px-4 py-2 rounded-full inline-block text-sm font-bold border-2 border-blue-500">📷 将条码对准扫描框</div>
                <div class="mt-3">
                    <button id="torchBtn" type="button" class="scan-tool-btn">🔦 补光</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 核心版本 ==========
        const VERSION = "S3.3.10";
        const STORAGE_KEY = "FEISUPANDIAN_DATA";
        let db = [];
        let columns = [];
        let scanning = false;
        let reader = null;
        let lastCode = "";
        let lastTime = 0;
        let currentFocusInterval = null;
        let pendingJump = null;
        let currentInputElement = null;
        let originalViewportHeight = window.innerHeight;
        let cameraTrack = null;
        let enhanceMode = false;
        let consecutiveFailures = 0;
        const AUTO_ENHANCE_THRESHOLD = 3;
        let lastDecodeSucceeded = true;
        let preprocessCanvas = null;
        let toastTimer = null;

        const AUTH_STORAGE_KEY = "FEISUPANDIAN_AUTH_V2";
        let authCodes = [];
        let isActivated = false;
        let adminMode = false;

        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIPad = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
        const isMobile = isAndroid || isIPad || /iPhone/i.test(navigator.userAgent);

        // ========== Toast 增强版 ==========
        function showToast(msg, isError = false, persistent = false) {
            const toast = document.getElementById('toast');
            
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastTimer = null;
            }
            
            const errorId = 'toast-msg-' + Date.now();
            
            if (isError) {
                const escapedMsg = msg.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                toast.innerHTML = `
                    <span id="${errorId}" style="word-break:break-all;">${escapedMsg}</span>
                    <button class="toast-copy" onclick="copyToastMessage('${errorId}')">📋 复制</button>
                    <button class="toast-close" onclick="dismissToast()">✕</button>
                `;
                toast.style.background = '#dc2626';
                toast.style.display = 'block';
                toast.style.maxWidth = '92%';
                toast.style.whiteSpace = 'normal';
                toast.style.wordBreak = 'break-all';
                toast.style.padding = '14px 20px';
                toast.style.lineHeight = '1.8';
                toast.style.borderRadius = '12px';
                toast.style.textAlign = 'left';
                
                const duration = persistent ? 60000 : 15000;
                toastTimer = setTimeout(() => {
                    toast.style.display = 'none';
                    toastTimer = null;
                }, duration);
            } else {
                toast.style.background = '#10b981';
                toast.style.display = 'block';
                toast.style.whiteSpace = 'nowrap';
                toast.style.maxWidth = '80%';
                toast.style.padding = '10px 20px';
                toast.style.borderRadius = '40px';
                toast.style.textAlign = 'center';
                toast.textContent = msg;
                toastTimer = setTimeout(() => {
                    toast.style.display = 'none';
                    toastTimer = null;
                }, 2000);
            }
        }

        function dismissToast() {
            const toast = document.getElementById('toast');
            toast.style.display = 'none';
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastTimer = null;
            }
        }

        function copyToastMessage(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const text = el.textContent || el.innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('✅ 已复制到剪贴板', false);
                }).catch(() => {
                    copyTextFallback(text);
                });
            } else {
                copyTextFallback(text);
            }
        }

        function copyTextFallback(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制', false);
            } catch (e) {
                showToast('❌ 复制失败，请手动复制', true);
            }
            document.body.removeChild(textarea);
        }

        function playBeep(success) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = success ? 1200 : 400;
                gainNode.gain.value = 0.6;
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                oscillator.stop(audioCtx.currentTime + 0.2);
                audioCtx.resume();
            } catch(e) {}
        }

        function vibrate() {
            if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(30);
        }

        // ========== 数据存储 ==========
        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    db = data.db || [];
                    columns = data.columns || [];
                }
                if (!columns.length) {
                    columns = ['实际数量', '实际价格', '商品名称', '编码', '价格'];
                    db = [];
                }
                if (!columns.includes('实际价格')) columns.push('实际价格');
                normalizeSpecialColumns();
                db.forEach(row => {
                    if (row['实际数量'] === undefined) row['实际数量'] = '';
                    if (row['实际价格'] === undefined) row['实际价格'] = '';
                });
            } catch(e) {
                console.error(e);
                columns = ['实际数量', '实际价格', '商品名称', '编码', '价格'];
                normalizeSpecialColumns();
                db = [];
            }
        }

        function normalizeSpecialColumns() {
            const qtyCol = '实际数量';
            const priceCol = '实际价格';
            if (!columns.includes(qtyCol)) columns.unshift(qtyCol);
            if (!columns.includes(priceCol)) columns.push(priceCol);
            const qtyIndex = columns.indexOf(qtyCol);
            if (qtyIndex > 0) { columns.splice(qtyIndex, 1); columns.unshift(qtyCol); }
            const priceIndex = columns.indexOf(priceCol);
            if (priceIndex !== 1 && priceIndex > 0) { columns.splice(priceIndex, 1); columns.splice(1, 0, priceCol); }
            else if (priceIndex === -1) columns.splice(1, 0, priceCol);
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ db, columns, version: VERSION }));
            } catch(e) { showToast("存储空间不足", true); }
        }

        // ========== 渐进式加载 ==========
        function showProgress(show) {
            const el = document.getElementById('progressArea');
            if (show) el.classList.add('active');
            else el.classList.remove('active');
        }

        function updateProgress(current, total, label, status) {
            const pct = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
            document.getElementById('progressPercent').textContent = Math.min(pct, 100) + '%';
            document.getElementById('progressCount').textContent = `${current} / ${total}`;
            if (label) document.getElementById('progressLabel').textContent = label;
            if (status) document.getElementById('progressStatus').textContent = status;
        }

        function showErrors(errors) {
            const el = document.getElementById('errorSummary');
            const list = document.getElementById('errorList');
            const title = document.getElementById('errorSummaryTitle');
            if (!errors || errors.length === 0) { el.classList.remove('active'); return; }
            el.classList.add('active');
            title.textContent = `⚠️ 导入完成，${errors.length} 行失败`;
            list.innerHTML = errors.map(e => `<li>行 ${e.row}: ${e.message || '数据异常'}</li>`).join('');
        }

        // ========== 自动识别列名 (增强版 - 支持库存数量、零售价等) ==========
        function autoMapColumns(headers) {
            const map = {};
            const lowerMap = {
                // 条码相关
                '条码': 'barcode', 'barcode': 'barcode', 'code': 'barcode', '编码': 'barcode', 'sku': 'barcode',
                '商品编码': 'barcode', '货号': 'barcode', 'productcode': 'barcode',
                // 名称相关
                '名称': 'name', 'name': 'name', '商品名称': 'name', '商品名': 'name', 'product': 'name', '品名': 'name',
                '产品名称': 'name', '货品名称': 'name',
                // 数量相关 (支持 库存数量、数量、Qty等)
                '库存数量': 'quantity', '数量': 'quantity', 'qty': 'quantity', 'quantity': 'quantity',
                '库存': 'quantity', '库存量': 'quantity', '数量': 'quantity',
                // 价格相关 (支持 零售价、售价、价格、单价等)
                '零售价': 'price', '售价': 'price', 'price': 'price', '价格': 'price', '单价': 'price',
                '销售价': 'price', '卖价': 'price', '市场价': 'price'
            };
            for (let h of headers) {
                const hTrim = h.trim();
                const lower = hTrim.toLowerCase();
                let matched = false;
                for (let key in lowerMap) {
                    if (lower === key || lower.includes(key) || key.includes(lower)) {
                        map[lowerMap[key]] = hTrim;
                        matched = true;
                        break;
                    }
                }
                if (!matched) {
                    for (let key in lowerMap) {
                        if (lower.includes(key) || key.includes(lower)) {
                            map[lowerMap[key]] = hTrim;
                            break;
                        }
                    }
                }
            }
            const defaults = { barcode: '条码', name: '名称', quantity: '库存数量', price: '零售价' };
            for (let k in defaults) {
                if (!map[k]) map[k] = defaults[k];
            }
            console.log('🔍 列识别结果:', map);
            return map;
        }

        function extractProduct(row, colMap) {
            const barcodeKey = colMap.barcode || '条码';
            const nameKey = colMap.name || '名称';
            const qtyKey = colMap.quantity || '库存数量';
            const priceKey = colMap.price || '零售价';
            
            const barcode = row[barcodeKey] || '';
            const name = row[nameKey] || '';
            const quantity = parseFloat(row[qtyKey]) || 0;
            const price = parseFloat(row[priceKey]) || 0;
            
            return { barcode, name, quantity, price };
        }

        // ========== 批量加载数据 ==========
        function loadDataInBatches(rawRows, isCSV = false) {
            return new Promise((resolve, reject) => {
                const total = rawRows.length;
                if (total === 0) { resolve({ rows: [], errors: [] }); return; }

                const sample = rawRows[0] || {};
                const headers = Object.keys(sample);
                const colMap = autoMapColumns(headers);
                console.log('📋 原始列名:', headers);

                const finalCols = new Set();
                for (let h of headers) finalCols.add(h);
                const coreCols = ['barcode', 'name', 'quantity', 'price'];
                for (let c of coreCols) {
                    if (colMap[c] && !finalCols.has(colMap[c])) {
                        finalCols.add(colMap[c]);
                    }
                }
                finalCols.add('实际数量');
                finalCols.add('实际价格');
                finalCols.add('条码');
                finalCols.add('名称');
                
                const columnArray = Array.from(finalCols);
                const qtyCol = '实际数量';
                const priceCol = '实际价格';
                const qtyIdx = columnArray.indexOf(qtyCol);
                if (qtyIdx > 0) { columnArray.splice(qtyIdx, 1); columnArray.unshift(qtyCol); }
                const priceIdx = columnArray.indexOf(priceCol);
                if (priceIdx > 1 && priceIdx !== -1) { columnArray.splice(priceIdx, 1); columnArray.splice(1, 0, priceCol); }

                const BATCH_SIZE = 500;
                let loaded = 0;
                const resultRows = [];
                const errorList = [];
                let isCompleted = false;

                function processNextBatch() {
                    if (isCompleted) return;
                    const start = loaded;
                    const end = Math.min(start + BATCH_SIZE, total);
                    const batch = rawRows.slice(start, end);

                    for (let i = 0; i < batch.length; i++) {
                        const idx = start + i;
                        const row = batch[i];
                        try {
                            const product = extractProduct(row, colMap);
                            const newRow = { ...row };
                            
                            const barcodeKey = colMap.barcode || '条码';
                            const nameKey = colMap.name || '名称';
                            
                            // 设置条码
                            if (row[barcodeKey] !== undefined && row[barcodeKey] !== '') {
                                newRow['条码'] = String(row[barcodeKey]).trim();
                            } else if (product.barcode) {
                                newRow['条码'] = String(product.barcode).trim();
                            } else {
                                newRow['条码'] = '';
                            }
                            
                            // 设置名称
                            if (row[nameKey] !== undefined && row[nameKey] !== '') {
                                newRow['名称'] = String(row[nameKey]).trim();
                            } else if (product.name) {
                                newRow['名称'] = String(product.name).trim();
                            } else {
                                newRow['名称'] = '';
                            }
                            
                            newRow['实际数量'] = product.quantity;
                            newRow['实际价格'] = product.price;
                            
                            for (let col of columnArray) {
                                if (newRow[col] === undefined) newRow[col] = '';
                            }
                            resultRows.push(newRow);
                        } catch (e) {
                            errorList.push({ row: idx + 1, message: e.message || '数据解析异常' });
                        }
                    }

                    loaded = end;
                    updateProgress(loaded, total, isCSV ? '📄 正在解析 CSV...' : '📊 正在加载数据...', `${Math.round((loaded/total)*100)}%`);

                    if (loaded < total) {
                        if (window.requestIdleCallback) {
                            requestIdleCallback(() => processNextBatch(), { timeout: 50 });
                        } else {
                            setTimeout(processNextBatch, 0);
                        }
                    } else {
                        isCompleted = true;
                        console.log('✅ 加载完成，共', resultRows.length, '条');
                        if (resultRows.length > 0) {
                            console.log('📦 示例数据:', resultRows[0]);
                        }
                        resolve({ rows: resultRows, errors: errorList, columns: columnArray });
                    }
                }

                updateProgress(0, total, isCSV ? '📄 正在解析 CSV...' : '📊 正在加载数据...', '0%');
                showProgress(true);
                setTimeout(processNextBatch, 10);
            });
        }

        // ========== 文件导入 ==========
        document.getElementById('fileInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const ext = file.name.split('.').pop().toLowerCase();

            if (ext === 'csv') {
                showProgress(true);
                updateProgress(0, 1, '📄 正在读取 CSV 文件...', '准备中');
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        let csvText = ev.target.result;
                        if (csvText.charCodeAt(0) === 0xFEFF) csvText = csvText.slice(1);
                        const parseResult = Papa.parse(csvText, {
                            header: true,
                            skipEmptyLines: true,
                            trimHeaders: true,
                            dynamicTyping: false,
                            transformHeader: h => h.trim()
                        });
                        if (parseResult.errors && parseResult.errors.length > 0) {
                            console.error('CSV解析错误详情:', parseResult.errors);
                            const errorDetails = parseResult.errors.map(e => 
                                `行 ${e.row}: ${e.message}`
                            ).join('\n');
                            showToast(`⚠️ CSV解析警告: ${parseResult.errors.length} 个问题`, true, true);
                            console.error('CSV解析错误列表:\n' + errorDetails);
                        }
                        const rows = parseResult.data || [];
                        if (rows.length === 0) {
                            showToast('CSV 文件无有效数据', true, true);
                            showProgress(false);
                            return;
                        }
                        loadDataInBatches(rows, true).then(({ rows: loadedRows, errors, columns: finalCols }) => {
                            columns = finalCols;
                            db = loadedRows;
                            saveData();
                            render();
                            showErrors(errors);
                            showProgress(false);
                            showToast(`✅ CSV 导入成功！共 ${db.length} 条，失败 ${errors.length} 条`, false);
                            updateStats();
                        }).catch(err => {
                            const errorMsg = 'CSV加载失败: ' + (err.message || err.toString());
                            console.error('详细错误:', err);
                            showToast(errorMsg, true, true);
                            showProgress(false);
                        });
                    } catch (err) {
                        console.error(err);
                        showToast('CSV解析失败: ' + (err.message || err.toString()), true, true);
                        showProgress(false);
                    }
                };
                reader.onerror = function() { 
                    const errorMsg = '读取CSV文件失败: ' + (this.error ? this.error.message : '未知错误');
                    showToast(errorMsg, true, true); 
                    showProgress(false);
                };
                reader.readAsText(file);
                e.target.value = '';
                return;
            }

            // Excel
            showToast("正在导入 Excel...", false);
            const fileReader = new FileReader();
            fileReader.onload = function(ev) {
                try {
                    const data = new Uint8Array(ev.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                    if (json.length > 0) {
                        loadDataInBatches(json, false).then(({ rows: loadedRows, errors, columns: finalCols }) => {
                            columns = finalCols;
                            db = loadedRows;
                            saveData();
                            render();
                            showErrors(errors);
                            showProgress(false);
                            showToast(`✅ Excel 导入成功！共 ${db.length} 条，失败 ${errors.length} 条`, false);
                            updateStats();
                        }).catch(err => {
                            const errorMsg = 'Excel加载失败: ' + (err.message || err.toString());
                            console.error('详细错误:', err);
                            showToast(errorMsg, true, true);
                            showProgress(false);
                        });
                    } else {
                        showToast("文件无数据", true, true);
                        showProgress(false);
                    }
                } catch(err) {
                    console.error(err);
                    showToast("解析失败: " + (err.message || err.toString()), true, true);
                    showProgress(false);
                }
            };
            fileReader.onerror = function() { 
                const errorMsg = '读取Excel文件失败: ' + (this.error ? this.error.message : '未知错误');
                showToast(errorMsg, true, true); 
                showProgress(false);
            };
            fileReader.readAsArrayBuffer(file);
            e.target.value = '';
        };

        // ========== 更新统计 ==========
        function updateStats() {
            const total = db.length;
            let totalPrice = 0;
            for (let row of db) {
                const qty = parseFloat(row['实际数量']) || 0;
                const price = parseFloat(row['实际价格']) || 0;
                totalPrice += qty * price;
            }
            document.getElementById('countDisplay')?.remove();
            const statsDiv = document.querySelector('.stats');
            if (statsDiv) {
                statsDiv.innerHTML = `<span>📊 ${total} 条</span><span>💰 ${totalPrice.toFixed(2)}</span>`;
            }
        }

        // ========== 匹配逻辑 ==========
        function preprocessCode(code) {
            if (!code) return code;
            let cleaned = String(code).replace(/[^\w\d\-]/g, '');
            if (cleaned.startsWith('*') && cleaned.endsWith('*')) cleaned = cleaned.slice(1, -1);
            if (cleaned.length === 12 && /^\d+$/.test(cleaned)) cleaned = '0' + cleaned;
            return cleaned;
        }

        function exactMatch(code, dbValue) {
            if (!code || !dbValue) return false;
            const codeStr = String(code).trim();
            const dbStr = String(dbValue).trim();
            if (codeStr === dbStr) return true;
            const processedCode = preprocessCode(codeStr);
            const processedDb = preprocessCode(dbStr);
            if (processedCode === processedDb) return true;
            if (codeStr.toLowerCase() === dbStr.toLowerCase()) return true;
            if (/^\d+$/.test(codeStr) && /^\d+$/.test(dbStr)) {
                const codeNum = codeStr.replace(/^0+/, '');
                const dbNum = dbStr.replace(/^0+/, '');
                if (codeNum === dbNum && codeNum.length > 0) return true;
            }
            return false;
        }

        function findBarcodeRow(code) {
            if (!code || db.length === 0) return -1;
            const codeStr = String(code).trim();
            for (let i = 0; i < db.length; i++) {
                const row = db[i];
                for (let key in row) {
                    const val = String(row[key] || '').trim();
                    if (exactMatch(codeStr, val)) return i;
                }
            }
            return -1;
        }

        function getSearchableRowText(row) {
            return Object.keys(row || {}).map(k => String(row[k] || '').trim()).join(' ').toLowerCase();
        }

        function findBestMatchRowIndex(query) {
            if (!query || !db.length) return -1;
            const token = String(query).trim();
            if (!token) return -1;
            const exact = findBarcodeRow(token);
            if (exact !== -1) return exact;
            const normalized = preprocessCode(token).toLowerCase();
            for (let i = 0; i < db.length; i++) {
                const row = db[i] || {};
                const values = Object.keys(row).map(k => String(row[k] || '').trim());
                for (const val of values) {
                    const v = val.toLowerCase();
                    const pv = preprocessCode(val).toLowerCase();
                    if ((normalized && (v.startsWith(normalized) || pv.startsWith(normalized))) || v.startsWith(token.toLowerCase())) {
                        return i;
                    }
                }
            }
            for (let i = 0; i < db.length; i++) {
                if (getSearchableRowText(db[i]).includes(token.toLowerCase())) return i;
            }
            return -1;
        }

        // ========== UI 渲染 ==========
        function render() {
            const thead = document.getElementById('tHead');
            const tbody = document.getElementById('tBody');
            if (!columns.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center p-6 text-gray-500">暂无数据，请导入Excel或添加列表</td></tr>';
                return;
            }
            thead.innerHTML = `<tr>${columns.map(col => `<th>${col}</th>`).join('')}</tr>`;
            tbody.innerHTML = db.map((row, idx) => `
                <tr id="row-${idx}">
                    ${columns.map(col => {
                        if (col === '实际数量') {
                            return `<td><input id="qty-${idx}" type="number" value="${row[col] || ''}" 
                                    class="qty-input" onchange="updateQty(${idx}, this.value)"
                                    onfocus="this.select()" placeholder="0" inputmode="numeric" /></td>`;
                        } else if (col === '实际价格') {
                            return `<td><input id="price-${idx}" type="number" step="0.01" value="${row[col] || ''}" 
                                    class="price-input" onchange="updatePrice(${idx}, this.value)"
                                    onfocus="this.select()" placeholder="0.00" inputmode="decimal" /></td>`;
                        } else {
                            return `<td><input type="text" value="${escapeHtml(String(row[col] || ''))}" 
                                    class="w-full p-2 text-sm outline-none bg-transparent"
                                    style="min-width:80px; width:100%;"
                                    onchange="updateCell(${idx}, '${col}', this.value)" /></td>`;
                        }
                    }).join('')}
                </tr>
            `).join('');
            setTimeout(() => autoAdjustColumns(), 50);
            if (pendingJump !== null) setTimeout(() => { jumpToRowAndFocusQty(pendingJump); pendingJump = null; }, 100);
            updateStats();
        }

        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        
        function updateQty(rowIndex, value) { db[rowIndex]['实际数量'] = value; saveData(); showToast("数量已更新", false); hideKeyboard(); }
        function updatePrice(rowIndex, value) { db[rowIndex]['实际价格'] = value; saveData(); showToast("价格已更新", false); hideKeyboard(); }
        function updateCell(rowIndex, col, value) { db[rowIndex][col] = value; saveData(); }
        
        function autoAdjustColumns() {
            const table = document.getElementById('mainTable');
            if (!table) return;
            const colCount = columns.length;
            if (colCount === 0) return;
            const headers = table.querySelectorAll('thead th');
            const rows = table.querySelectorAll('tbody tr');
            if (headers.length === 0) return;
            const colMaxWidths = new Array(colCount).fill(0);
            headers.forEach((th, idx) => {
                if (idx < colCount) {
                    let headerWidth = (th.textContent || '').length * 14 + 40;
                    colMaxWidths[idx] = Math.max(colMaxWidths[idx], Math.min(headerWidth, 200));
                }
            });
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                cells.forEach((cell, idx) => {
                    if (idx < colCount) {
                        const input = cell.querySelector('input');
                        let text = input ? (input.value || input.placeholder || '') : (cell.textContent || '');
                        let textWidth = 0;
                        for (let i = 0; i < text.length; i++) {
                            const code = text.charCodeAt(i);
                            if (code >= 0x4e00 && code <= 0x9fff) textWidth += 16;
                            else if (code >= 0x30 && code <= 0x39) textWidth += 8;
                            else textWidth += 10;
                        }
                        textWidth = Math.max(textWidth + 30, 80);
                        textWidth = Math.min(textWidth, 250);
                        if (textWidth > colMaxWidths[idx]) colMaxWidths[idx] = textWidth;
                    }
                });
            });
            headers.forEach((th, idx) => {
                if (idx < colCount && colMaxWidths[idx] > 0) {
                    th.style.width = colMaxWidths[idx] + 'px';
                    th.style.minWidth = colMaxWidths[idx] + 'px';
                }
            });
        }

        function jumpToRowAndFocusQty(foundIndex) {
            const rowEl = document.getElementById(`row-${foundIndex}`);
            if (rowEl) {
                document.querySelectorAll('#mainTable tbody tr').forEach(tr => tr.classList.remove('row-focus'));
                rowEl.classList.add('row-focus');
                rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const qtyInput = document.getElementById(`qty-${foundIndex}`);
                if (qtyInput) {
                    currentInputElement = qtyInput;
                    setTimeout(() => {
                        qtyInput.focus();
                        qtyInput.select();
                        qtyInput.style.transform = 'scale(1.02)';
                        qtyInput.style.borderColor = '#10b981';
                        qtyInput.style.backgroundColor = '#fef9c3';
                        const handleInputComplete = function(e) {
                            if (e.type === 'blur' || (e.type === 'keypress' && e.key === 'Enter')) {
                                hideKeyboard();
                                qtyInput.removeEventListener('blur', handleInputComplete);
                                qtyInput.removeEventListener('keypress', handleInputComplete);
                            }
                        };
                        qtyInput.addEventListener('blur', handleInputComplete);
                        qtyInput.addEventListener('keypress', handleInputComplete);
                        setTimeout(() => {
                            if (qtyInput) {
                                qtyInput.style.transform = '';
                                qtyInput.style.borderColor = '';
                                qtyInput.style.backgroundColor = '';
                            }
                        }, 500);
                    }, 300);
                }
                return true;
            }
            return false;
        }

        function handleBarcode(code, fromCamera = false) {
            if (!code) return false;
            const now = Date.now();
            const codeStr = String(code).trim();
            if (codeStr === lastCode && (now - lastTime) < 200) return false;
            lastCode = codeStr;
            lastTime = now;
            
            const foundIndex = findBestMatchRowIndex(codeStr);
            if (foundIndex === -1) {
                playBeep(false);
                showToast(`❌ 条码不存在: ${codeStr.substring(0, 20)}`, true);
                vibrate();
                consecutiveFailures++;
                lastDecodeSucceeded = false;
                setTimeout(() => {
                    const manualInput = document.getElementById('manualInput');
                    if (manualInput) { manualInput.focus(); manualInput.select(); currentInputElement = manualInput; }
                }, 100);
                return false;
            }
            consecutiveFailures = 0;
            lastDecodeSucceeded = true;
            playBeep(true);
            vibrate();
            const productName = db[foundIndex]['名称'] || db[foundIndex]['商品名称'] || codeStr;
            showToast(`✅ ${productName}`, false);
            const scanFrame = document.getElementById('scanFrame');
            if (scanFrame) { scanFrame.classList.add('scan-success'); setTimeout(() => scanFrame.classList.remove('scan-success'), 200); }
            if (fromCamera) stopScanningAndJump(foundIndex);
            else jumpToRowAndFocusQty(foundIndex);
            return true;
        }

        function stopScanningAndJump(foundIndex) {
            pendingJump = foundIndex;
            scanning = false;
            if (currentFocusInterval) { clearInterval(currentFocusInterval); currentFocusInterval = null; }
            if (reader) { try { reader.reset(); } catch(e) {} reader = null; }
            const videoEl = document.getElementById('video');
            if (videoEl && videoEl.srcObject) {
                const tracks = videoEl.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoEl.srcObject = null;
            }
            document.getElementById('scanUI').style.display = 'none';
            setTimeout(() => { jumpToRowAndFocusQty(foundIndex); pendingJump = null; }, 150);
        }

        // ========== 扫码相机 ==========
        function setupCameraControls(track) {
            cameraTrack = track || null;
            const torchBtn = document.getElementById('torchBtn');
            if (!torchBtn) return;
            torchBtn.classList.remove('active');
            torchBtn.textContent = '🔦 补光';
            torchBtn.onclick = async () => {
                if (!cameraTrack || !cameraTrack.getCapabilities) { showToast('当前相机不支持补光控制', true); return; }
                const caps = cameraTrack.getCapabilities();
                if (!caps.torch) { showToast('当前设备不支持手电筒', true); return; }
                const turnOn = !torchBtn.classList.contains('active');
                try {
                    await cameraTrack.applyConstraints({ advanced: [{ torch: turnOn }] });
                    torchBtn.classList.toggle('active', turnOn);
                    torchBtn.textContent = turnOn ? '🔦 关补光' : '🔦 补光';
                } catch (e) { showToast('补光切换失败', true); }
            };
            const videoContainer = document.querySelector('#scanUI .relative');
            if (videoContainer) {
                videoContainer.addEventListener('click', async () => {
                    if (cameraTrack && cameraTrack.getCapabilities && cameraTrack.getCapabilities().focusMode) {
                        try {
                            const probe = [0.05, 0.08, 0.12, 0.18, 0.25, 0.35];
                            for (const d of probe) {
                                await cameraTrack.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: d }] });
                                await new Promise(r => setTimeout(r, 60));
                            }
                            setTimeout(() => {
                                if (cameraTrack) cameraTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                            }, 600);
                            showToast("🎯 近距扫描完成", false);
                        } catch(e) {}
                    }
                });
            }
        }

        function applyCameraTuning(track) {
            if (!track || !track.getCapabilities) return;
            const caps = track.getCapabilities();
            const advanced = [];
            if (caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({ focusMode: 'continuous' });
            if (caps.exposureMode && caps.exposureMode.includes('continuous')) advanced.push({ exposureMode: 'continuous' });
            if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) advanced.push({ whiteBalanceMode: 'continuous' });
            if (caps.exposureCompensation) {
                const minExp = typeof caps.exposureCompensation.min === 'number' ? caps.exposureCompensation.min : -1;
                const maxExp = typeof caps.exposureCompensation.max === 'number' ? caps.exposureCompensation.max : 1;
                advanced.push({ exposureCompensation: Math.max(minExp, Math.min(maxExp, 0.2)) });
            }
            if (advanced.length) track.applyConstraints({ advanced }).catch(() => {});
        }

        async function startScanning() {
            if (scanning) { showToast("扫描器已在运行", false); return; }
            
            const isIPadDevice = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
            const scanFrame = document.getElementById('scanFrame');
            if (scanFrame) {
                if (isIPadDevice) { scanFrame.style.top = '15%'; }
                else { scanFrame.style.top = '25%'; }
            }
            
            const scanUI = document.getElementById('scanUI');
            scanUI.style.display = 'flex';
            scanning = true;
            if (reader) { try { await reader.reset(); } catch(e) {} reader = null; }
            
            const badge = document.getElementById('enhanceBadge');
            if (enhanceMode) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
            
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    }
                };
                
                const hints = new Map();
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                hints.set(ZXing.DecodeHintType.CHARACTER_SET, "UTF-8");
                hints.set(ZXing.DecodeHintType.ALLOWED_LENGTHS, null);
                hints.set(ZXing.DecodeHintType.RETURN_CODABAR_START_END, true);
                hints.set(ZXing.DecodeHintType.ALSO_INVERTED, true);
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
                    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR,
                    ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.PDF_417, ZXing.BarcodeFormat.QR_CODE
                ]);
                
                reader = new ZXing.BrowserMultiFormatReader(hints);
                reader.timeBetweenDecodingAttempts = 20;
                
                const videoEl = document.getElementById('video');
                const frameEl = document.getElementById('scanFrame');
                
                await reader.decodeFromConstraints(constraints, 'video', async (result, err) => {
                    if (!scanning) return;
                    if (result) {
                        const code = result.getText();
                        if (code) {
                            handleBarcode(code, true);
                            consecutiveFailures = 0;
                            lastDecodeSucceeded = true;
                            return;
                        }
                    }
                    consecutiveFailures++;
                    lastDecodeSucceeded = false;
                    if (enhanceMode || consecutiveFailures >= AUTO_ENHANCE_THRESHOLD) {
                        const enhancedCode = await tryEnhancedDecode(videoEl, frameEl);
                        if (enhancedCode) {
                            handleBarcode(enhancedCode, true);
                            consecutiveFailures = 0;
                            vibrate();
                        }
                    }
                });
                
                showToast("极速扫码引擎已启动" + (enhanceMode ? " (增强模式)" : ""), false);
                setTimeout(() => {
                    const track = videoEl?.srcObject?.getVideoTracks?.()[0];
                    if (track) {
                        setupCameraControls(track);
                        applyCameraTuning(track);
                    }
                }, 300);
                
                currentFocusInterval = setInterval(() => {
                    if (!scanning) { clearInterval(currentFocusInterval); return; }
                    if (videoEl && videoEl.srcObject) {
                        const track = videoEl.srcObject.getVideoTracks()[0];
                        if (track && track.getCapabilities) {
                            const caps = track.getCapabilities();
                            const step = Math.floor(Date.now() / 200) % 10;
                            if (step < 4 && caps.focusMode && caps.focusMode.includes('manual')) {
                                const dist = [0.05, 0.08, 0.12, 0.18][step];
                                track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: dist }] }).catch(() => {});
                            } else {
                                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                                    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                                }
                                if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
                                    track.applyConstraints({ advanced: [{ exposureMode: 'continuous' }] }).catch(() => {});
                                }
                            }
                        }
                    }
                }, 200);
            } catch(err) {
                console.error("相机错误:", err);
                showToast("无法启动摄像头，请检查权限", true);
                stopScanning(true);
            }
        }

        function stopScanning(manual = false) {
            scanning = false;
            if (currentFocusInterval) { clearInterval(currentFocusInterval); currentFocusInterval = null; }
            if (reader) { try { reader.reset(); } catch(e) {} reader = null; }
            const videoEl = document.getElementById('video');
            if (videoEl && videoEl.srcObject) {
                const tracks = videoEl.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoEl.srcObject = null;
            }
            document.getElementById('scanUI').style.display = 'none';
            cameraTrack = null;
            consecutiveFailures = 0;
        }

        function toggleEnhanceMode() {
            enhanceMode = !enhanceMode;
            const topBtn = document.getElementById('scanEnhanceBtn');
            const badge = document.getElementById('enhanceBadge');
            if (enhanceMode) {
                topBtn.classList.add('active');
                topBtn.innerHTML = "✨ 增强开";
                if (badge) badge.classList.remove('hidden');
                showToast("增强模式已开启，将提高劣质条码识别率", false);
            } else {
                topBtn.classList.remove('active');
                topBtn.innerHTML = "✨ 增强";
                if (badge) badge.classList.add('hidden');
                showToast("增强模式已关闭", false);
            }
            if (scanning) {
                stopScanning(true);
                setTimeout(() => startScanning(), 200);
            }
        }

        function getFrameROI(videoEl, frameEl) {
            const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
            if (!vw || !vh) return null;
            const vr = videoEl.getBoundingClientRect();
            const fr = frameEl.getBoundingClientRect();
            const videoAspect = vw / vh;
            const boxAspect = vr.width / vr.height;
            let renderW, renderH, offsetX = 0, offsetY = 0;
            if (videoAspect > boxAspect) {
                renderH = vr.height;
                renderW = renderH * videoAspect;
                offsetX = (renderW - vr.width) / 2;
            } else {
                renderW = vr.width;
                renderH = renderW / videoAspect;
                offsetY = (renderH - vr.height) / 2;
            }
            const xInBox = fr.left - vr.left + offsetX;
            const yInBox = fr.top - vr.top + offsetY;
            const sx = vw / renderW, sy = vh / renderH;
            let roiX = Math.max(0, Math.floor(xInBox * sx));
            let roiY = Math.max(0, Math.floor(yInBox * sy));
            let roiW = Math.min(vw - roiX, Math.floor(fr.width * sx));
            let roiH = Math.min(vh - roiY, Math.floor(fr.height * sy));
            if (roiW <= 0 || roiH <= 0) return null;
            const lowerY = roiY + Math.floor(roiH * 0.55);
            const lowerH = roiH - Math.floor(roiH * 0.55);
            if (lowerH < 10) return { x: roiX, y: roiY, w: roiW, h: roiH };
            return { x: roiX, y: lowerY, w: roiW, h: lowerH };
        }

        function preprocessImageForBarcode(videoEl, roi) {
            const canvas = document.createElement('canvas');
            canvas.width = roi.w;
            canvas.height = roi.h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(videoEl, roi.x, roi.y, roi.w, roi.h, 0, 0, roi.w, roi.h);
            const imgData = ctx.getImageData(0, 0, roi.w, roi.h);
            const data = imgData.data;
            let min = 255, max = 0;
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                data[i] = data[i+1] = data[i+2] = gray;
                if (gray < min) min = gray;
                if (gray > max) max = gray;
            }
            const range = max - min;
            const threshold = min + range * 0.55;
            for (let i = 0; i < data.length; i += 4) {
                const val = data[i] > threshold ? 255 : 0;
                data[i] = data[i+1] = data[i+2] = val;
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }

        async function tryEnhancedDecode(videoEl, frameEl) {
            if (!videoEl || videoEl.readyState < 2) return null;
            const roi = getFrameROI(videoEl, frameEl);
            if (!roi) return null;
            const processedCanvas = preprocessImageForBarcode(videoEl, roi);
            if (!processedCanvas) return null;
            if ('BarcodeDetector' in window) {
                try {
                    const detector = new window.BarcodeDetector({
                        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_39', 'code_93', 'code_128', 'itf', 'codabar']
                    });
                    const codes = await detector.detect(processedCanvas);
                    if (codes && codes.length > 0) {
                        return codes[0].rawValue;
                    }
                } catch(e) { /* fallback */ }
            }
            return null;
        }

        // ========== 列管理 ==========
        function renderColList() {
            const container = document.getElementById('colList');
            container.innerHTML = columns.map((col, idx) => `
                <div class="col-item p-3" draggable="true" data-index="${idx}" data-col="${col}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 flex-1">
                            <span class="drag-handle text-xl cursor-move">☰</span>
                            <span class="font-bold text-sm">${idx + 1}. ${col}</span>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="moveColumnUp(${idx})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬆️</button>
                            <button onclick="moveColumnDown(${idx})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬇️</button>
                            <button onclick="deleteColumn('${col}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">删</button>
                        </div>
                    </div>
                </div>
            `).join('');
            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            const items = document.querySelectorAll('.col-item');
            const isTouch = 'ontouchend' in document;
            let draggedItem = null;
            items.forEach(item => {
                if (isTouch) { item.setAttribute('draggable', 'false'); return; }
                item.setAttribute('draggable', 'true');
                item.addEventListener('dragstart', (e) => { draggedItem = item; item.style.opacity = '0.5'; e.dataTransfer.effectAllowed = 'move'; });
                item.addEventListener('dragend', (e) => { item.style.opacity = ''; draggedItem = null; });
                item.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (!draggedItem || draggedItem === item) return;
                    const fromIndex = parseInt(draggedItem.getAttribute('data-index'));
                    const toIndex = parseInt(item.getAttribute('data-index'));
                    if (!isNaN(fromIndex) && !isNaN(toIndex)) {
                        const temp = columns[fromIndex];
                        columns[fromIndex] = columns[toIndex];
                        columns[toIndex] = temp;
                        renderColList(); render(); saveData(); showToast("列顺序已更新", false);
                    }
                });
            });
        }

        function moveColumnUp(index) { if (index > 0) { const temp = columns[index]; columns[index] = columns[index-1]; columns[index-1] = temp; renderColList(); render(); saveData(); showToast("列顺序已更新", false); } }
        function moveColumnDown(index) { if (index < columns.length-1) { const temp = columns[index]; columns[index] = columns[index+1]; columns[index+1] = temp; renderColList(); render(); saveData(); showToast("列顺序已更新", false); } }
        function openColModal() { renderColList(); document.getElementById('colModal').style.display = 'flex'; }
        function closeColModal() { document.getElementById('colModal').style.display = 'none'; render(); }
        function addColumn() { const newCol = document.getElementById('newColName').value.trim(); if (newCol && !columns.includes(newCol)) { columns.push(newCol); db.forEach(row => row[newCol] = ''); renderColList(); render(); saveData(); showToast(`已添加列: ${newCol}`, false); document.getElementById('newColName').value = ''; } else if (columns.includes(newCol)) showToast("列名已存在", true); }
        function deleteColumn(colName) { 
            if (colName === '实际数量' || colName === '实际价格') {
                showToast("⚠️ 核心列不能删除", true);
                return;
            }
            if (confirm(`确定删除列 "${colName}" 吗？数据将丢失！`)) { 
                const index = columns.indexOf(colName); 
                if (index !== -1) { columns.splice(index, 1); db.forEach(row => delete row[colName]); renderColList(); render(); saveData(); showToast(`已删除列: ${colName}`, false); } 
            } 
        }

        // ========== 导出 ==========
        function exportExcel() {
            if (!db.length) { showToast("暂无数据可导出", true); return; }
            const defaultName = `飞速盘点_${new Date().toLocaleDateString()}`;
            let name = prompt("请输入导出文件名：", defaultName);
            if (!name || !name.trim()) name = defaultName;
            const ws = XLSX.utils.json_to_sheet(db, { header: columns });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "库存数据");
            XLSX.writeFile(wb, name.trim() + ".xlsx");
            showToast("✅ 导出成功", false);
        }

        function hardReset() { if (confirm("⚠️ 确定清空所有数据吗？此操作不可恢复！")) { localStorage.removeItem(STORAGE_KEY); db = []; columns = ['实际数量', '实际价格', '商品名称', '编码', '价格']; normalizeSpecialColumns(); saveData(); render(); showToast("已清空所有数据", false); } }

        // ========== 键盘处理 ==========
        function setupKeyboardListener() {
            if (!isMobile) return;
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    const currentHeight = window.visualViewport.height;
                    const keyboardHeight = originalViewportHeight - currentHeight;
                    if (keyboardHeight > 150) {
                        document.body.classList.add('keyboard-open');
                    } else {
                        document.body.classList.remove('keyboard-open');
                        setTimeout(() => {
                            if (pendingJump !== null) {
                                const rowEl = document.getElementById(`row-${pendingJump}`);
                                if (rowEl) rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }, 100);
                    }
                });
            }
            window.addEventListener('resize', () => {
                const currentHeight = window.innerHeight;
                const keyboardHeight = originalViewportHeight - currentHeight;
                if (keyboardHeight > 150) document.body.classList.add('keyboard-open');
                else document.body.classList.remove('keyboard-open');
            });
        }

        function showKeyboard() {
            if (currentInputElement && document.activeElement !== currentInputElement) {
                currentInputElement.focus();
                currentInputElement.select();
            } else {
                const manualInput = document.getElementById('manualInput');
                if (manualInput) { manualInput.focus(); manualInput.select(); currentInputElement = manualInput; }
            }
        }

        function hideKeyboard() {
            if (currentInputElement) { currentInputElement.blur(); currentInputElement = null; }
            document.activeElement?.blur();
            document.body.classList.remove('keyboard-open');
        }

        function getDeviceId() {
            let id = localStorage.getItem('_device_id');
            if (!id) { id = 'DEV_' + Math.random().toString(36).substring(2, 10).toUpperCase(); localStorage.setItem('_device_id', id); }
            return id;
        }
        
        function openAdminPanel() {
            const AUTH_SKEY = "FEISUPANDIAN_AUTH_V2";
            let isAdmin = false;
            try { const d = JSON.parse(localStorage.getItem(AUTH_SKEY)); if (d && d.admin) isAdmin = true; } catch(e) {}
            if (!isAdmin) { showToast("⚠️ 你不是管理员", true); return; }
            adminMode = true;
            renderAdminCodeList();
            document.getElementById('adminPanel').style.display = 'flex';
        }

        function closeAdminPanel() { document.getElementById('adminPanel').style.display = 'none'; }

        function renderAdminCodeList() {
            const container = document.getElementById('adminCodeList');
            if (!container) return;
            const total = authCodes.length;
            const usedCount = authCodes.filter(a => a.used).length;
            const unused = authCodes.filter(a => !a.used);
            container.innerHTML = `
                <div style="text-align:center;font-size:14px;color:#334155;margin-bottom:12px;font-weight:bold;">已用 ${usedCount} / 总计 ${total}</div>
                ${unused.length ? unused.map(a => `
                    <div class="admin-code-item">
                        <span style="font-size:16px;letter-spacing:2px;">${a.code}</span>
                        <span class="status-badge">未使用</span>
                    </div>
                `).join('') : '<div style="text-align:center;color:#94a3b8;padding:20px;font-size:14px;">⚠️ 所有授权码已用完，请追加</div>'}
            `;
        }

        if (authInput) authInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyAuthCode(); });

            const input = document.getElementById('manualInput'); 
            const val = input.value.trim(); 
            if (val === '授权码') { openAdminPanel(); input.value = ''; return; } 
            if (val) { handleBarcode(val, false); input.value = ''; } 
            hideKeyboard(); 
        };

            if (e.key === 'Enter') {
