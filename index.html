<body>

    <script>
        var VERSION = "S3.3.38";
        var db = [];
        var columns = [];
        var currentPage = 0;
        var pageSize = 500;
        var totalPages = 0;
        var scanning = false;
        var reader = null;
        var lastCode = "";
        var lastTime = 0;
        var currentFocusInterval = null;
        var pendingJump = null;
        var currentInputElement = null;
        var originalViewportHeight = window.innerHeight;
        var cameraTrack = null;
        var enhanceMode = false;
        var consecutiveFailures = 0;
        var AUTO_ENHANCE_THRESHOLD = 3;
        var toastTimer = null;
        var isProcessing = false;
        var BATCH_SIZE = 50;

        var isAndroid = /Android/i.test(navigator.userAgent);
        var isIPad = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
        var isMobile = isAndroid || isIPad || /iPhone/i.test(navigator.userAgent);

        // ==================== Toast ====================
        function showToast(msg, isError, persistent) {
            if (isError === undefined) isError = false;
            if (persistent === undefined) persistent = false;
            var toast = document.getElementById('toast');
            if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
            var errorId = 'toast-msg-' + Date.now();
            if (isError) {
                var escapedMsg = msg.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                toast.innerHTML = '<span id="' + errorId + '" style="word-break:break-all;">' + escapedMsg + '</span><button class="toast-copy" onclick="copyToastMessage(\'' + errorId + '\')">📋 复制</button><button class="toast-close" onclick="dismissToast()">✕</button>';
                toast.style.background = '#dc2626';
                toast.style.display = 'block';
                toast.style.maxWidth = '92%';
                toast.style.whiteSpace = 'normal';
                toast.style.wordBreak = 'break-all';
                toast.style.padding = '14px 20px';
                toast.style.lineHeight = '1.8';
                toast.style.borderRadius = '12px';
                toast.style.textAlign = 'left';
                var duration = persistent ? 60000 : 20000;
                toastTimer = setTimeout(function() { toast.style.display = 'none'; toastTimer = null; }, duration);
            } else {
                toast.style.background = '#10b981';
                toast.style.display = 'block';
                toast.style.whiteSpace = 'nowrap';
                toast.style.maxWidth = '80%';
                toast.style.padding = '10px 20px';
                toast.style.borderRadius = '40px';
                toast.style.textAlign = 'center';
                toast.textContent = msg;
                toastTimer = setTimeout(function() { toast.style.display = 'none'; toastTimer = null; }, 2000);
            }
        }
        function dismissToast() { var toast = document.getElementById('toast'); toast.style.display = 'none'; if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; } }
        function copyToastMessage(elementId) { var el = document.getElementById(elementId); if (!el) return; var text = el.textContent || el.innerText; if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function() { showToast('✅ 已复制', false); }).catch(function() { copyTextFallback(text); }); } else { copyTextFallback(text); } }
        function copyTextFallback(text) { var textarea = document.createElement('textarea'); textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0'; textarea.style.left = '-9999px'; document.body.appendChild(textarea); textarea.select(); try { document.execCommand('copy'); showToast('✅ 已复制', false); } catch (e) { showToast('❌ 复制失败，请手动复制', true); } document.body.removeChild(textarea); }

        function playBeep(success) { try { var audioCtx = new (window.AudioContext || window.webkitAudioContext)(); var oscillator = audioCtx.createOscillator(); var gainNode = audioCtx.createGain(); oscillator.connect(gainNode); gainNode.connect(audioCtx.destination); oscillator.frequency.value = success ? 1200 : 400; gainNode.gain.value = 0.6; oscillator.start(); gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2); oscillator.stop(audioCtx.currentTime + 0.2); audioCtx.resume(); } catch(e) {} }
        function vibrate() { if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(30); }

        // ==================== 数据提取 ====================
        function extractProduct(row) {
            var barcode = row['条码'] || row['barcode'] || row['Barcode'] || row['商品编码'] || row['编码'] || '';
            var name = row['名称'] || row['商品名称'] || row['name'] || row['Name'] || '';
            var qty = parseFloat(row['库存数量'] || row['数量'] || row['库存'] || 0) || 0;
            var price = parseFloat(row['零售价'] || row['售价'] || row['价格'] || 0) || 0;

            if (!barcode) {
                for (var key in row) {
                    var val = String(row[key] || '').trim();
                    if (val && /^\d{8,14}$/.test(val.replace(/-/g, ''))) {
                        barcode = val;
                        break;
                    }
                }
            }
            if (!name && barcode) { name = barcode; }

            return {
                barcode: String(barcode).trim(),
                name: String(name).trim(),
                quantity: qty,
                price: price,
                valid: (barcode && barcode !== '') || (name && name !== '')
            };
        }

        function normalizeSpecialColumns() {
            var qtyCol = '实际数量';
            var priceCol = '实际价格';
            if (!columns.includes(qtyCol)) columns.unshift(qtyCol);
            if (!columns.includes(priceCol)) columns.push(priceCol);
            var qtyIndex = columns.indexOf(qtyCol);
            if (qtyIndex > 0) { columns.splice(qtyIndex, 1); columns.unshift(qtyCol); }
            var priceIndex = columns.indexOf(priceCol);
            if (priceIndex !== 1 && priceIndex > 0) { columns.splice(priceIndex, 1); columns.splice(1, 0, priceCol); }
            else if (priceIndex === -1) columns.splice(1, 0, priceCol);
        }

        // ==================== 进度显示 ====================
        function showProgress(show) { var el = document.getElementById('progressArea'); if (show) el.classList.add('active'); else el.classList.remove('active'); }
        function updateProgress(current, total, label, status) {
            var pct = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
            document.getElementById('progressPercent').textContent = Math.min(pct, 100) + '%';
            document.getElementById('progressCount').textContent = current + ' / ' + total;
            if (label) document.getElementById('progressLabel').textContent = label;
            if (status) document.getElementById('progressStatus').textContent = status;
        }

        function showErrors(errors) {
            var el = document.getElementById('errorSummary');
            var list = document.getElementById('errorList');
            var title = document.getElementById('errorSummaryTitle');
            if (!errors || errors.length === 0) { el.classList.remove('active'); return; }
            el.classList.add('active');
            title.textContent = '⚠️ 导入完成，' + errors.length + ' 行失败';
            list.innerHTML = errors.map(function(e) { return '<li>行 ' + e.row + ': ' + (e.message || '数据异常') + '</li>'; }).join('');
        }

        // ==================== 分页渲染 ====================
        function renderPage() {
            try {
                var thead = document.getElementById('tHead');
                var tbody = document.getElementById('tBody');
                var total = db.length;
                totalPages = Math.ceil(total / pageSize) || 1;
                if (currentPage >= totalPages) currentPage = totalPages - 1;
                if (currentPage < 0) currentPage = 0;

                var start = currentPage * pageSize;
                var end = Math.min(start + pageSize, total);
                var pageData = db.slice(start, end);

                document.getElementById('pageInfo').textContent = '第 ' + (currentPage + 1) + ' / ' + totalPages + ' 页';
                document.getElementById('totalInfo').textContent = '共 ' + total + ' 条';
                document.getElementById('prevPageBtn').disabled = (currentPage === 0);
                document.getElementById('nextPageBtn').disabled = (currentPage >= totalPages - 1);

                if (!columns.length || total === 0) {
                    thead.innerHTML = '';
                    tbody.innerHTML = '<tr><td colspan="10" class="text-center p-6 text-gray-500">暂无数据，请导入Excel或CSV文件</td></tr>';
                    return;
                }

                thead.innerHTML = '<tr>' + columns.map(function(col) { return '<th>' + col + '</th>'; }).join('') + '</tr>';
                tbody.innerHTML = pageData.map(function(row, idx) {
                    var realIdx = start + idx;
                    return '<tr id="row-' + realIdx + '">' +
                        columns.map(function(col) {
                            if (col === '实际数量') {
                                return '<td><input id="qty-' + realIdx + '" type="number" value="' + (row[col] || '') + '" class="qty-input" onchange="updateQty(' + realIdx + ', this.value)" onfocus="this.select()" placeholder="0" inputmode="numeric" /></td>';
                            } else if (col === '实际价格') {
                                return '<td><input id="price-' + realIdx + '" type="number" step="0.01" value="' + (row[col] || '') + '" class="price-input" onchange="updatePrice(' + realIdx + ', this.value)" onfocus="this.select()" placeholder="0.00" inputmode="decimal" /></td>';
                            } else {
                                var val = String(row[col] || '');
                                if (val.length > 100) val = val.substring(0, 100) + '...';
                                return '<td title="' + String(row[col] || '') + '"><input type="text" value="' + escapeHtml(val) + '" class="w-full p-2 text-sm outline-none bg-transparent" style="min-width:80px; width:100%;" onchange="updateCell(' + realIdx + ', \'' + col + '\', this.value)" /></td>';
                            }
                        }).join('') +
                        '</tr>';
                }).join('');

                setTimeout(function() { autoAdjustColumns(); }, 50);
                if (pendingJump !== null) {
                    var jumpIdx = pendingJump;
                    var targetPage = Math.floor(jumpIdx / pageSize);
                    if (targetPage !== currentPage) {
                        currentPage = targetPage;
                        renderPage();
                    }
                    setTimeout(function() { jumpToRowAndFocusQty(jumpIdx); pendingJump = null; }, 100);
                }
                updateStats();
            } catch(e) {
                console.error('渲染错误:', e);
                showToast('渲染错误: ' + e.message, true);
            }
        }

        function changePage(delta) {
            var newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                renderPage();
            }
        }

        function updateStats() {
            var total = db.length;
            var totalPrice = 0;
            for (var i = 0; i < db.length; i++) {
                var row = db[i];
                var qty = parseFloat(row['实际数量']) || 0;
                var price = parseFloat(row['实际价格']) || 0;
                totalPrice += qty * price;
            }
            var statsDiv = document.querySelector('.stats');
            if (statsDiv) {
                statsDiv.innerHTML = '<span>📊 ' + total + ' 条</span><span>💰 ' + totalPrice.toFixed(2) + '</span>';
            }
        }

        // ==================== 分批导入 Excel（无截断） ====================
        function importExcelInBatches(jsonData) {
            return new Promise(function(resolve, reject) {
                var total = jsonData.length;
                if (total === 0) { resolve({ rows: [], errors: [] }); return; }

                var allColumns = new Set();
                allColumns.add('实际数量');
                allColumns.add('实际价格');
                allColumns.add('条码');
                allColumns.add('名称');

                var resultRows = [];
                var errorList = [];
                var processed = 0;

                function processBatch() {
                    var start = processed;
                    var end = Math.min(start + BATCH_SIZE, total);
                    var batch = jsonData.slice(start, end);

                    for (var i = 0; i < batch.length; i++) {
                        var idx = start + i;
                        var row = batch[i];
                        try {
                            var product = extractProduct(row);
                            var newRow = {};
                            for (var key in row) {
                                if (row.hasOwnProperty(key)) {
                                    newRow[key] = row[key];
                                    allColumns.add(key);
                                }
                            }
                            newRow['条码'] = product.barcode || '';
                            newRow['名称'] = product.name || '';
                            newRow['实际数量'] = product.quantity || 0;
                            newRow['实际价格'] = product.price || 0;
                            resultRows.push(newRow);
                        } catch (err) {
                            errorList.push({ row: idx + 1, message: err.message || '数据异常' });
                        }
                    }

                    processed = end;
                    updateProgress(processed, total, '📊 正在导入数据...', processed + ' / ' + total + '  (' + Math.round((processed/total)*100) + '%)');

                    if (processed < total) {
                        setTimeout(processBatch, 30);
                    } else {
                        var finalCols = Array.from(allColumns);
                        var qtyCol = '实际数量';
                        var priceCol = '实际价格';
                        var qtyIdx = finalCols.indexOf(qtyCol);
                        if (qtyIdx > 0) { finalCols.splice(qtyIdx, 1); finalCols.unshift(qtyCol); }
                        var priceIdx = finalCols.indexOf(priceCol);
                        if (priceIdx > 1 && priceIdx !== -1) { finalCols.splice(priceIdx, 1); finalCols.splice(1, 0, priceCol); }

                        resolve({ rows: resultRows, errors: errorList, columns: finalCols });
                    }
                }

                updateProgress(0, total, '📊 正在准备导入...', '0 / ' + total + ' (0%)');
                showProgress(true);
                setTimeout(processBatch, 100);
            });
        }

        // ==================== CSV导入（无截断） ====================
        function importCSVInBatches(file) {
            return new Promise(function(resolve, reject) {
                var result = { rows: [], errors: [], total: 0, valid: 0 };
                var allColumns = new Set();
                allColumns.add('实际数量');
                allColumns.add('实际价格');
                allColumns.add('条码');
                allColumns.add('名称');

                var reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        var csvText = ev.target.result;
                        if (csvText.charCodeAt(0) === 0xFEFF) { csvText = csvText.slice(1); }
                        
                        var firstRowPrinted = false;
                        var batchBuffer = [];
                        var batchCount = 0;
                        var totalRows = 0;

                        Papa.parse(csvText, {
                            header: true,
                            comments: '#',
                            skipEmptyLines: true,
                            trimHeaders: true,
                            transformHeader: function(h) { return h.trim(); },
                            worker: false,
                            step: function(results) {
                                var row = results.data;
                                if (!row || Object.keys(row).length === 0) return;
                                
                                totalRows++;
                                if (!firstRowPrinted) { 
                                    firstRowPrinted = true; 
                                    console.log('📋 列名:', Object.keys(row)); 
                                }

                                var product = extractProduct(row);
                                if (product.valid) {
                                    var newRow = {};
                                    for (var key in row) {
                                        if (row.hasOwnProperty(key)) {
                                            newRow[key] = row[key];
                                            allColumns.add(key);
                                        }
                                    }
                                    newRow['条码'] = product.barcode || '';
                                    newRow['名称'] = product.name || '';
                                    newRow['实际数量'] = product.quantity || 0;
                                    newRow['实际价格'] = product.price || 0;
                                    batchBuffer.push(newRow);
                                    result.valid++;
                                } else {
                                    result.errors.push({ row: totalRows, data: row, message: '缺少条码或名称' });
                                }

                                batchCount++;
                                if (batchCount >= BATCH_SIZE) {
                                    result.rows = result.rows.concat(batchBuffer);
                                    batchBuffer = [];
                                    batchCount = 0;
                                    updateProgress(result.rows.length, 0, '📄 解析中...', result.rows.length + ' 行');
                                }
                            },
                            complete: function() {
                                if (batchBuffer.length > 0) {
                                    result.rows = result.rows.concat(batchBuffer);
                                    batchBuffer = [];
                                }
                                
                                var finalCols = Array.from(allColumns);
                                var qtyCol = '实际数量';
                                var priceCol = '实际价格';
                                var qtyIdx = finalCols.indexOf(qtyCol);
                                if (qtyIdx > 0) { finalCols.splice(qtyIdx, 1); finalCols.unshift(qtyCol); }
                                var priceIdx = finalCols.indexOf(priceCol);
                                if (priceIdx > 1 && priceIdx !== -1) { finalCols.splice(priceIdx, 1); finalCols.splice(1, 0, priceCol); }

                                console.log('✅ 解析完成');
                                console.log('📊 总行数:', totalRows);
                                console.log('✅ 有效:', result.valid);
                                console.log('❌ 错误:', result.errors.length);
                                
                                resolve({ rows: result.rows, errors: result.errors, columns: finalCols });
                            },
                            error: function(err) {
                                console.error('PapaParse错误:', err);
                                reject(err);
                            }
                        });
                    } catch (err) { reject(err); }
                };
                reader.onerror = function() { reject(new Error('读取文件失败')); };
                reader.readAsText(file);
            });
        }

        // ==================== 文件导入入口 ====================
        document.getElementById('fileInput').onchange = function(e) {
            if (isProcessing) { showToast('⏳ 正在处理中...', false); return; }
            var file = e.target.files[0];
            if (!file) return;
            e.target.value = '';
            var ext = file.name.split('.').pop().toLowerCase();

            if (ext === 'csv') {
                isProcessing = true;
                showProgress(true);
                updateProgress(0, 1, '📄 正在读取 CSV...', '准备中');

                importCSVInBatches(file).then(function(result) {
                    if (result.rows.length === 0) { 
                        showToast('⚠️ 没有有效数据行', true); 
                        showProgress(false); 
                        isProcessing = false; 
                        return; 
                    }

                    columns = result.columns;
                    db = result.rows;
                    console.log('✅ 最终数据条数:', db.length);
                    currentPage = 0;
                    renderPage();
                    showErrors(result.errors.slice(0, 100));
                    showProgress(false);
                    
                    if (db.length > 0) { 
                        showToast('✅ 导入成功！共 ' + db.length + ' 条商品', false); 
                        if (result.errors.length > 0) { 
                            showToast('⚠️ 跳过 ' + result.errors.length + ' 行无效数据', true); 
                        } 
                    } else { 
                        showToast('⚠️ 无有效商品数据', true); 
                    }
                    isProcessing = false;
                }).catch(function(err) {
                    console.error('CSV导入失败:', err);
                    showToast('❌ 导入失败: ' + (err.message || err.toString()), true);
                    showProgress(false);
                    isProcessing = false;
                });
                return;
            }

            // Excel
            isProcessing = true;
            showToast("正在读取 Excel...", false);
            var fileReader = new FileReader();
            fileReader.onload = function(ev) {
                try {
                    var data = new Uint8Array(ev.target.result);
                    var workbook = XLSX.read(data, { type: 'array' });
                    var sheet = workbook.Sheets[workbook.SheetNames[0]];
                    var json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                    
                    if (json.length === 0) {
                        showToast("文件无数据", true);
                        showProgress(false);
                        isProcessing = false;
                        return;
                    }

                    console.log('📊 Excel 读取完成，共 ' + json.length + ' 行');

                    importExcelInBatches(json).then(function(result) {
                        if (result.rows.length === 0) {
                            showToast('⚠️ 没有有效数据行', true);
                            showProgress(false);
                            isProcessing = false;
                            return;
                        }

                        columns = result.columns;
                        db = result.rows;
                        console.log('✅ 最终数据条数:', db.length);
                        currentPage = 0;
                        renderPage();
                        showErrors(result.errors.slice(0, 100));
                        showProgress(false);
                        showToast('✅ 导入成功！共 ' + db.length + ' 条商品', false);
                        if (result.errors.length > 0) {
                            showToast('⚠️ 跳过 ' + result.errors.length + ' 行无效数据', true);
                        }
                        isProcessing = false;
                    }).catch(function(err) {
                        console.error('导入失败:', err);
                        showToast('❌ 导入失败: ' + (err.message || err.toString()), true);
                        showProgress(false);
                        isProcessing = false;
                    });

                } catch(err) {
                    console.error(err);
                    showToast("解析失败: " + (err.message || err.toString()), true);
                    showProgress(false);
                    isProcessing = false;
                }
            };
            fileReader.onerror = function() { 
                showToast('读取Excel文件失败', true); 
                showProgress(false); 
                isProcessing = false; 
            };
            fileReader.readAsArrayBuffer(file);
        };

        // ==================== 匹配逻辑 ====================
        function preprocessCode(code) {
            if (!code) return code;
            var cleaned = String(code).replace(/[^\w\d\-]/g, '');
            if (cleaned.startsWith('*') && cleaned.endsWith('*')) cleaned = cleaned.slice(1, -1);
            if (cleaned.length === 12 && /^\d+$/.test(cleaned)) cleaned = '0' + cleaned;
            return cleaned;
        }

        function exactMatch(code, dbValue) {
            if (!code || !dbValue) return false;
            var codeStr = String(code).trim();
            var dbStr = String(dbValue).trim();
            if (codeStr === dbStr) return true;
            var processedCode = preprocessCode(codeStr);
            var processedDb = preprocessCode(dbStr);
            if (processedCode === processedDb) return true;
            if (codeStr.toLowerCase() === dbStr.toLowerCase()) return true;
            if (/^\d+$/.test(codeStr) && /^\d+$/.test(dbStr)) {
                var codeNum = codeStr.replace(/^0+/, '');
                var dbNum = dbStr.replace(/^0+/, '');
                if (codeNum === dbNum && codeNum.length > 0) return true;
            }
            return false;
        }

        function findBarcodeRow(code) {
            if (!code || db.length === 0) return -1;
            var codeStr = String(code).trim();
            for (var i = 0; i < db.length; i++) {
                var row = db[i];
                for (var key in row) {
                    var val = String(row[key] || '').trim();
                    if (exactMatch(codeStr, val)) return i;
                }
            }
            return -1;
        }

        function getSearchableRowText(row) {
            var keys = Object.keys(row || {});
            var texts = [];
            for (var i = 0; i < keys.length; i++) {
                texts.push(String(row[keys[i]] || '').trim());
            }
            return texts.join(' ').toLowerCase();
        }

        function findBestMatchRowIndex(query) {
            if (!query || !db.length) return -1;
            var token = String(query).trim();
            if (!token) return -1;
            var exact = findBarcodeRow(token);
            if (exact !== -1) return exact;
            var normalized = preprocessCode(token).toLowerCase();
            for (var i = 0; i < db.length; i++) {
                var row = db[i] || {};
                var keys = Object.keys(row);
                for (var j = 0; j < keys.length; j++) {
                    var val = String(row[keys[j]] || '').trim();
                    var v = val.toLowerCase();
                    var pv = preprocessCode(val).toLowerCase();
                    if ((normalized && (v.startsWith(normalized) || pv.startsWith(normalized))) || v.startsWith(token.toLowerCase())) {
                        return i;
                    }
                }
            }
            for (var i = 0; i < db.length; i++) {
                if (getSearchableRowText(db[i]).includes(token.toLowerCase())) return i;
            }
            return -1;
        }

        // ==================== UI 函数 ====================
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        
        function updateQty(rowIndex, value) { 
            if (db[rowIndex]) { db[rowIndex]['实际数量'] = value; updateStats(); showToast("数量已更新", false); hideKeyboard(); } 
        }
        function updatePrice(rowIndex, value) { 
            if (db[rowIndex]) { db[rowIndex]['实际价格'] = value; updateStats(); showToast("价格已更新", false); hideKeyboard(); } 
        }
        function updateCell(rowIndex, col, value) { if (db[rowIndex]) { db[rowIndex][col] = value; } }
        
        function autoAdjustColumns() {
            var table = document.getElementById('mainTable');
            if (!table) return;
            var colCount = columns.length;
            if (colCount === 0) return;
            var headers = table.querySelectorAll('thead th');
            var rows = table.querySelectorAll('tbody tr');
            if (headers.length === 0) return;
            var colMaxWidths = new Array(colCount).fill(0);
            headers.forEach(function(th, idx) {
                if (idx < colCount) {
                    var headerWidth = (th.textContent || '').length * 14 + 40;
                    colMaxWidths[idx] = Math.max(colMaxWidths[idx], Math.min(headerWidth, 200));
                }
            });
            rows.forEach(function(row) {
                var cells = row.querySelectorAll('td');
                cells.forEach(function(cell, idx) {
                    if (idx < colCount) {
                        var input = cell.querySelector('input');
                        var text = input ? (input.value || input.placeholder || '') : (cell.textContent || '');
                        var textWidth = 0;
                        for (var i = 0; i < text.length; i++) {
                            var code = text.charCodeAt(i);
                            if (code >= 0x4e00 && code <= 0x9fff) textWidth += 16;
                            else if (code >= 0x30 && code <= 0x39) textWidth += 8;
                            else textWidth += 10;
                        }
                        textWidth = Math.max(textWidth + 30, 80);
                        textWidth = Math.min(textWidth, 250);
                        if (textWidth > colMaxWidths[idx]) colMaxWidths[idx] = textWidth;
                    }
                });
            });
            headers.forEach(function(th, idx) {
                if (idx < colCount && colMaxWidths[idx] > 0) {
                    th.style.width = colMaxWidths[idx] + 'px';
                    th.style.minWidth = colMaxWidths[idx] + 'px';
                }
            });
        }

        function jumpToRowAndFocusQty(foundIndex) {
            var rowEl = document.getElementById('row-' + foundIndex);
            if (rowEl) {
                document.querySelectorAll('#mainTable tbody tr').forEach(function(tr) { tr.classList.remove('row-focus'); });
                rowEl.classList.add('row-focus');
                rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                var qtyInput = document.getElementById('qty-' + foundIndex);
                if (qtyInput) {
                    currentInputElement = qtyInput;
                    setTimeout(function() {
                        qtyInput.focus();
                        qtyInput.select();
                        qtyInput.style.transform = 'scale(1.02)';
                        qtyInput.style.borderColor = '#10b981';
                        qtyInput.style.backgroundColor = '#fef9c3';
                        var handleInputComplete = function(e) {
                            if (e.type === 'blur' || (e.type === 'keypress' && e.key === 'Enter')) {
                                hideKeyboard();
                                qtyInput.removeEventListener('blur', handleInputComplete);
                                qtyInput.removeEventListener('keypress', handleInputComplete);
                            }
                        };
                        qtyInput.addEventListener('blur', handleInputComplete);
                        qtyInput.addEventListener('keypress', handleInputComplete);
                        setTimeout(function() {
                            if (qtyInput) {
                                qtyInput.style.transform = '';
                                qtyInput.style.borderColor = '';
                                qtyInput.style.backgroundColor = '';
                            }
                        }, 500);
                    }, 300);
                }
                return true;
            }
            return false;
        }

        function handleBarcode(code, fromCamera) {
            if (!code) return false;
            var now = Date.now();
            var codeStr = String(code).trim();
            if (codeStr === lastCode && (now - lastTime) < 200) return false;
            lastCode = codeStr;
            lastTime = now;
            
            var foundIndex = findBestMatchRowIndex(codeStr);
            if (foundIndex === -1) {
                playBeep(false);
                showToast('❌ 条码不存在: ' + codeStr.substring(0, 20), true);
                vibrate();
                consecutiveFailures++;
                setTimeout(function() {
                    var manualInput = document.getElementById('manualInput');
                    if (manualInput) { manualInput.focus(); manualInput.select(); currentInputElement = manualInput; }
                }, 100);
                return false;
            }
            consecutiveFailures = 0;
            playBeep(true);
            vibrate();
            var productName = db[foundIndex]['名称'] || db[foundIndex]['商品名称'] || codeStr;
            showToast('✅ ' + productName, false);
            var scanFrame = document.getElementById('scanFrame');
            if (scanFrame) { scanFrame.classList.add('scan-success'); setTimeout(function() { scanFrame.classList.remove('scan-success'); }, 200); }
            if (fromCamera) stopScanningAndJump(foundIndex);
            else {
                var targetPage = Math.floor(foundIndex / pageSize);
                if (targetPage !== currentPage) {
                    currentPage = targetPage;
                    renderPage();
                }
                jumpToRowAndFocusQty(foundIndex);
            }
            return true;
        }

        function stopScanningAndJump(foundIndex) {
            pendingJump = foundIndex;
            scanning = false;
            if (currentFocusInterval) { clearInterval(currentFocusInterval); currentFocusInterval = null; }
            if (reader) { try { reader.reset(); } catch(e) {} reader = null; }
            var videoEl = document.getElementById('video');
            if (videoEl && videoEl.srcObject) {
                var tracks = videoEl.srcObject.getTracks();
                tracks.forEach(function(track) { track.stop(); });
                videoEl.srcObject = null;
            }
            document.getElementById('scanUI').style.display = 'none';
            var targetPage = Math.floor(foundIndex / pageSize);
            if (targetPage !== currentPage) {
                currentPage = targetPage;
                renderPage();
            }
            setTimeout(function() { jumpToRowAndFocusQty(foundIndex); pendingJump = null; }, 150);
        }

        // ==================== 扫码相机（精简） ====================
        function setupCameraControls(track) {
            cameraTrack = track || null;
            var torchBtn = document.getElementById('torchBtn');
            if (!torchBtn) return;
            torchBtn.classList.remove('active');
            torchBtn.textContent = '🔦 补光';
            torchBtn.onclick = async function() {
                if (!cameraTrack || !cameraTrack.getCapabilities) { showToast('当前相机不支持补光控制', true); return; }
                var caps = cameraTrack.getCapabilities();
                if (!caps.torch) { showToast('当前设备不支持手电筒', true); return; }
                var turnOn = !torchBtn.classList.contains('active');
                try {
                    await cameraTrack.applyConstraints({ advanced: [{ torch: turnOn }] });
                    torchBtn.classList.toggle('active', turnOn);
                    torchBtn.textContent = turnOn ? '🔦 关补光' : '🔦 补光';
                } catch (e) { showToast('补光切换失败', true); }
            };
            var videoContainer = document.querySelector('#scanUI .relative');
            if (videoContainer) {
                videoContainer.addEventListener('click', async function() {
                    if (cameraTrack && cameraTrack.getCapabilities && cameraTrack.getCapabilities().focusMode) {
                        try {
                            var probe = [0.05, 0.08, 0.12, 0.18, 0.25, 0.35];
                            for (var d of probe) {
                                await cameraTrack.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: d }] });
                                await new Promise(function(r) { setTimeout(r, 60); });
                            }
                            setTimeout(function() {
                                if (cameraTrack) cameraTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function() {});
                            }, 600);
                            showToast("🎯 近距扫描完成", false);
                        } catch(e) {}
                    }
                });
            }
        }

        function applyCameraTuning(track) {
            if (!track || !track.getCapabilities) return;
            var caps = track.getCapabilities();
            var advanced = [];
            if (caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({ focusMode: 'continuous' });
            if (caps.exposureMode && caps.exposureMode.includes('continuous')) advanced.push({ exposureMode: 'continuous' });
            if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) advanced.push({ whiteBalanceMode: 'continuous' });
            if (caps.exposureCompensation) {
                var minExp = typeof caps.exposureCompensation.min === 'number' ? caps.exposureCompensation.min : -1;
                var maxExp = typeof caps.exposureCompensation.max === 'number' ? caps.exposureCompensation.max : 1;
                advanced.push({ exposureCompensation: Math.max(minExp, Math.min(maxExp, 0.2)) });
            }
            if (advanced.length) track.applyConstraints({ advanced: advanced }).catch(function() {});
        }

        async function startScanning() {
            if (scanning) { showToast("扫描器已在运行", false); return; }
            var isIPadDevice = /iPad|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
            var scanFrame = document.getElementById('scanFrame');
            if (scanFrame) {
                if (isIPadDevice) { scanFrame.style.top = '15%'; }
                else { scanFrame.style.top = '25%'; }
            }
            var scanUI = document.getElementById('scanUI');
            scanUI.style.display = 'flex';
            scanning = true;
            if (reader) { try { await reader.reset(); } catch(e) {} reader = null; }
            var badge = document.getElementById('enhanceBadge');
            if (enhanceMode) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
            try {
                var constraints = {
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    }
                };
                var hints = new Map();
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                hints.set(ZXing.DecodeHintType.CHARACTER_SET, "UTF-8");
                hints.set(ZXing.DecodeHintType.ALLOWED_LENGTHS, null);
                hints.set(ZXing.DecodeHintType.RETURN_CODABAR_START_END, true);
                hints.set(ZXing.DecodeHintType.ALSO_INVERTED, true);
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
                    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR,
                    ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.PDF_417, ZXing.BarcodeFormat.QR_CODE
                ]);
                reader = new ZXing.BrowserMultiFormatReader(hints);
                reader.timeBetweenDecodingAttempts = 20;
                var videoEl = document.getElementById('video');
                var frameEl = document.getElementById('scanFrame');
                await reader.decodeFromConstraints(constraints, 'video', async function(result, err) {
                    if (!scanning) return;
                    if (result) {
                        var code = result.getText();
                        if (code) {
                            handleBarcode(code, true);
                            consecutiveFailures = 0;
                            return;
                        }
                    }
                    consecutiveFailures++;
                    if (enhanceMode || consecutiveFailures >= AUTO_ENHANCE_THRESHOLD) {
                        var enhancedCode = await tryEnhancedDecode(videoEl, frameEl);
                        if (enhancedCode) {
                            handleBarcode(enhancedCode, true);
                            consecutiveFailures = 0;
                            vibrate();
                        }
                    }
                });
                showToast("极速扫码引擎已启动" + (enhanceMode ? " (增强模式)" : ""), false);
                setTimeout(function() {
                    var track = videoEl?.srcObject?.getVideoTracks?.()[0];
                    if (track) {
                        setupCameraControls(track);
                        applyCameraTuning(track);
                    }
                }, 300);
                currentFocusInterval = setInterval(function() {
                    if (!scanning) { clearInterval(currentFocusInterval); return; }
                    if (videoEl && videoEl.srcObject) {
                        var track = videoEl.srcObject.getVideoTracks()[0];
                        if (track && track.getCapabilities) {
                            var caps = track.getCapabilities();
                            var step = Math.floor(Date.now() / 200) % 10;
                            if (step < 4 && caps.focusMode && caps.focusMode.includes('manual')) {
                                var dist = [0.05, 0.08, 0.12, 0.18][step];
                                track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: dist }] }).catch(function() {});
                            } else {
                                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                                    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function() {});
                                }
                                if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
                                    track.applyConstraints({ advanced: [{ exposureMode: 'continuous' }] }).catch(function() {});
                                }
                            }
                        }
                    }
                }, 200);
            } catch(err) {
                console.error("相机错误:", err);
                showToast("无法启动摄像头，请检查权限", true);
                stopScanning(true);
            }
        }

        function stopScanning(manual) {
            scanning = false;
            if (currentFocusInterval) { clearInterval(currentFocusInterval); currentFocusInterval = null; }
            if (reader) { try { reader.reset(); } catch(e) {} reader = null; }
            var videoEl = document.getElementById('video');
            if (videoEl && videoEl.srcObject) {
                var tracks = videoEl.srcObject.getTracks();
                tracks.forEach(function(track) { track.stop(); });
                videoEl.srcObject = null;
            }
            document.getElementById('scanUI').style.display = 'none';
            cameraTrack = null;
            consecutiveFailures = 0;
        }

        function toggleEnhanceMode() {
            enhanceMode = !enhanceMode;
            var topBtn = document.getElementById('scanEnhanceBtn');
            var badge = document.getElementById('enhanceBadge');
            if (enhanceMode) {
                topBtn.classList.add('active');
                topBtn.innerHTML = "✨ 增强开";
                if (badge) badge.classList.remove('hidden');
                showToast("增强模式已开启，将提高劣质条码识别率", false);
            } else {
                topBtn.classList.remove('active');
                topBtn.innerHTML = "✨ 增强";
                if (badge) badge.classList.add('hidden');
                showToast("增强模式已关闭", false);
            }
            if (scanning) {
                stopScanning(true);
                setTimeout(function() { startScanning(); }, 200);
            }
        }

        function getFrameROI(videoEl, frameEl) {
            var vw = videoEl.videoWidth, vh = videoEl.videoHeight;
            if (!vw || !vh) return null;
            var vr = videoEl.getBoundingClientRect();
            var fr = frameEl.getBoundingClientRect();
            var videoAspect = vw / vh;
            var boxAspect = vr.width / vr.height;
            var renderW, renderH, offsetX = 0, offsetY = 0;
            if (videoAspect > boxAspect) {
                renderH = vr.height;
                renderW = renderH * videoAspect;
                offsetX = (renderW - vr.width) / 2;
            } else {
                renderW = vr.width;
                renderH = renderW / videoAspect;
                offsetY = (renderH - vr.height) / 2;
            }
            var xInBox = fr.left - vr.left + offsetX;
            var yInBox = fr.top - vr.top + offsetY;
            var sx = vw / renderW, sy = vh / renderH;
            var roiX = Math.max(0, Math.floor(xInBox * sx));
            var roiY = Math.max(0, Math.floor(yInBox * sy));
            var roiW = Math.min(vw - roiX, Math.floor(fr.width * sx));
            var roiH = Math.min(vh - roiY, Math.floor(fr.height * sy));
            if (roiW <= 0 || roiH <= 0) return null;
            var lowerY = roiY + Math.floor(roiH * 0.55);
            var lowerH = roiH - Math.floor(roiH * 0.55);
            if (lowerH < 10) return { x: roiX, y: roiY, w: roiW, h: roiH };
            return { x: roiX, y: lowerY, w: roiW, h: lowerH };
        }

        function preprocessImageForBarcode(videoEl, roi) {
            var canvas = document.createElement('canvas');
            canvas.width = roi.w;
            canvas.height = roi.h;
            var ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(videoEl, roi.x, roi.y, roi.w, roi.h, 0, 0, roi.w, roi.h);
            var imgData = ctx.getImageData(0, 0, roi.w, roi.h);
            var data = imgData.data;
            var min = 255, max = 0;
            for (var i = 0; i < data.length; i += 4) {
                var gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                data[i] = data[i+1] = data[i+2] = gray;
                if (gray < min) min = gray;
                if (gray > max) max = gray;
            }
            var range = max - min;
            var threshold = min + range * 0.55;
            for (var i = 0; i < data.length; i += 4) {
                var val = data[i] > threshold ? 255 : 0;
                data[i] = data[i+1] = data[i+2] = val;
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }

        async function tryEnhancedDecode(videoEl, frameEl) {
            if (!videoEl || videoEl.readyState < 2) return null;
            var roi = getFrameROI(videoEl, frameEl);
            if (!roi) return null;
            var processedCanvas = preprocessImageForBarcode(videoEl, roi);
            if (!processedCanvas) return null;
            if ('BarcodeDetector' in window) {
                try {
                    var detector = new window.BarcodeDetector({
                        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_39', 'code_93', 'code_128', 'itf', 'codabar']
                    });
                    var codes = await detector.detect(processedCanvas);
                    if (codes && codes.length > 0) {
                        return codes[0].rawValue;
                    }
                } catch(e) { /* fallback */ }
            }
            return null;
        }

        // ==================== 列管理 ====================
        function renderColList() {
            var container = document.getElementById('colList');
            container.innerHTML = columns.map(function(col, idx) {
                return '<div class="col-item p-3" draggable="true" data-index="' + idx + '" data-col="' + col + '"><div class="flex items-center justify-between"><div class="flex items-center gap-2 flex-1"><span class="drag-handle text-xl cursor-move">☰</span><span class="font-bold text-sm">' + (idx + 1) + '. ' + col + '</span></div><div class="flex gap-1"><button onclick="moveColumnUp(' + idx + ')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬆️</button><button onclick="moveColumnDown(' + idx + ')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">⬇️</button><button onclick="deleteColumn(\'' + col + '\')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">删</button></div></div></div>';
            }).join('');
            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            var items = document.querySelectorAll('.col-item');
            var isTouch = 'ontouchend' in document;
            var draggedItem = null;
            items.forEach(function(item) {
                if (isTouch) { item.setAttribute('draggable', 'false'); return; }
                item.setAttribute('draggable', 'true');
                item.addEventListener('dragstart', function(e) { draggedItem = item; item.style.opacity = '0.5'; e.dataTransfer.effectAllowed = 'move'; });
                item.addEventListener('dragend', function(e) { item.style.opacity = ''; draggedItem = null; });
                item.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
                item.addEventListener('drop', function(e) {
                    e.preventDefault();
                    if (!draggedItem || draggedItem === item) return;
                    var fromIndex = parseInt(draggedItem.getAttribute('data-index'));
                    var toIndex = parseInt(item.getAttribute('data-index'));
                    if (!isNaN(fromIndex) && !isNaN(toIndex)) {
                        var temp = columns[fromIndex];
                        columns[fromIndex] = columns[toIndex];
                        columns[toIndex] = temp;
                        renderColList(); renderPage(); showToast("列顺序已更新", false);
                    }
                });
            });
        }

        function moveColumnUp(index) { if (index > 0) { var temp = columns[index]; columns[index] = columns[index-1]; columns[index-1] = temp; renderColList(); renderPage(); showToast("列顺序已更新", false); } }
        function moveColumnDown(index) { if (index < columns.length-1) { var temp = columns[index]; columns[index] = columns[index+1]; columns[index+1] = temp; renderColList(); renderPage(); showToast("列顺序已更新", false); } }
        function openColModal() { renderColList(); document.getElementById('colModal').style.display = 'flex'; }
        function closeColModal() { document.getElementById('colModal').style.display = 'none'; renderPage(); }
        function addColumn() { var newCol = document.getElementById('newColName').value.trim(); if (newCol && !columns.includes(newCol)) { columns.push(newCol); for (var i = 0; i < db.length; i++) { db[i][newCol] = ''; } renderColList(); renderPage(); showToast('已添加列: ' + newCol, false); document.getElementById('newColName').value = ''; } else if (columns.includes(newCol)) showToast("列名已存在", true); }
        function deleteColumn(colName) { 
            if (colName === '实际数量' || colName === '实际价格') {
                showToast("⚠️ 核心列不能删除", true);
                return;
            }
            if (confirm('确定删除列 "' + colName + '" 吗？数据将丢失！')) { 
                var index = columns.indexOf(colName); 
                if (index !== -1) { columns.splice(index, 1); for (var i = 0; i < db.length; i++) { delete db[i][colName]; } renderColList(); renderPage(); showToast('已删除列: ' + colName, false); } 
            } 
        }

        function hardReset() {
            if (confirm("⚠️ 确定清空所有数据吗？此操作不可恢复！")) {
                db = [];
                columns = ['实际数量', '实际价格', '商品名称', '编码', '价格'];
                normalizeSpecialColumns();
                currentPage = 0;
                renderPage();
                showToast("已清空所有数据", false);
            }
        }

        function exportExcel() {
            if (!db.length) { showToast("暂无数据可导出", true); return; }
            var defaultName = '飞速盘点_' + new Date().toLocaleDateString();
            var name = prompt("请输入导出文件名：", defaultName);
            if (!name || !name.trim()) name = defaultName;
            var ws = XLSX.utils.json_to_sheet(db, { header: columns });
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "库存数据");
            XLSX.writeFile(wb, name.trim() + ".xlsx");
            showToast("✅ 导出成功", false);
        }

        function setupKeyboardListener() {
            if (!isMobile) return;
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function() {
                    var currentHeight = window.visualViewport.height;
                    var keyboardHeight = originalViewportHeight - currentHeight;
                    if (keyboardHeight > 150) {
                        document.body.classList.add('keyboard-open');
                    } else {
                        document.body.classList.remove('keyboard-open');
                        setTimeout(function() {
                            if (pendingJump !== null) {
                                var rowEl = document.getElementById('row-' + pendingJump);
                                if (rowEl) rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }, 100);
                    }
                });
            }
            window.addEventListener('resize', function() {
                var currentHeight = window.innerHeight;
                var keyboardHeight = originalViewportHeight - currentHeight;
                if (keyboardHeight > 150) document.body.classList.add('keyboard-open');
                else document.body.classList.remove('keyboard-open');
            });
        }

        function showKeyboard() {
            if (currentInputElement && document.activeElement !== currentInputElement) {
                currentInputElement.focus();
                currentInputElement.select();
            } else {
                var manualInput = document.getElementById('manualInput');
                if (manualInput) { manualInput.focus(); manualInput.select(); currentInputElement = manualInput; }
            }
        }

        function hideKeyboard() {
            if (currentInputElement) { currentInputElement.blur(); currentInputElement = null; }
            if (document.activeElement) document.activeElement.blur();
            document.body.classList.remove('keyboard-open');
        }

        function initAuthSystem() { console.log('✅ 授权已跳过'); }
        function openAdminPanel() { showToast("⚠️ 管理员面板已禁用", true); }
        function closeAdminPanel() { document.getElementById('adminPanel').style.display = 'none'; }
        function renderAdminCodeList() {}
        function generateNewCodes() {}

        function render() { renderPage(); }

        window.addEventListener('resize', function() { setTimeout(function() { autoAdjustColumns(); }, 100); });
        window.addEventListener('beforeunload', function() { if (scanning) stopScanning(true); });
        document.addEventListener('touchstart', function(e) { if (currentInputElement && !e.target.closest('.qty-input') && !e.target.closest('.price-input') && !e.target.closest('#manualInput')) hideKeyboard(); });
        
        renderPage();
        setupKeyboardListener();
        initAuthSystem();
        
        document.getElementById('confirmBtn').onclick = function() { 
            var input = document.getElementById('manualInput'); 
            var val = input.value.trim(); 
            if (val) { handleBarcode(val, false); input.value = ''; } 
            hideKeyboard(); 
        };
        document.getElementById('manualInput').onkeypress = function(e) { 
            if (e.key === 'Enter') { 
                var input = e.target; 
                var val = input.value.trim(); 
                if (val) { handleBarcode(val, false); input.value = ''; } 
                hideKeyboard(); 
            } 
        };
        document.getElementById('scanBtn').onclick = function() { if (scanning) stopScanning(true); else startScanning(); hideKeyboard(); };
        document.getElementById('showKeyboardBtn').onclick = function() { showKeyboard(); };
        
        var topEnhanceBtn = document.getElementById('scanEnhanceBtn');
        if (topEnhanceBtn) topEnhanceBtn.onclick = function() { toggleEnhanceMode(); };
        
        console.log('⚡ 飞速盘点 ' + VERSION + ' - 完整导入，无截断');
        console.log('📌 进度条显示：已处理 / 总数 (百分比)');
        console.log('📌 请及时导出备份（💾 导出按钮）');
    </script>
